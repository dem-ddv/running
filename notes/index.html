акая-то сильная мобилизационная реакция организма на нагрузку и депривацию сна. Серёжа и Женя говорили, что такое может быть до недели, но я в ночь на среду уже спал как обычно.","listType":"ul","listId":"list-15","level":0},{"kind":"li","text":"Боли в надкостнице и стопе. После долгого периода без движения – сильные: сложно ходить, а если получается, то хромая и через боль. Если походить 3-4 минуты, то уже норм. В среду вечером уже полегче. В четверг днём впервые побегал после суток – побаливает, но окей.","listType":"ul","listId":"list-15","level":0},{"kind":"li","text":"Отёкшие ноги. Ноги слонёнка появились в понедельник вечером. Выглядит стрёмно, но вроде безвредно. Делаю ставку, что пройдут к воскресенью.","listType":"ul","listId":"list-15","level":0},{"kind":"li","text":"Вес. Утром в понедельник весил на два килограмма меньше, чем утром в субботу. Отражение в зеркале мощно и приятно схуднуло. В четверг утром весил уже на килограмм больше, чем до старта: наел или отёки? Скорее всего за неделю или две вес вернётся к обычному.","listType":"ul","listId":"list-15","level":0},{"kind":"p","text":"Полезен ли суточный бег для здоровья? Колени не болят. Общее самочувствие хорошее: слабость, головные боли и приступы паники не беспокоят. Сердечко работает в привычном ритме. Легко отделался, как обычно."},{"kind":"h3","text":"Команда, поддержка, болельщики"},{"kind":"p","text":"Многие участники бежали старт без сопровождения. У примерно половины был на соревновании человек, который поддерживал и помогал с питанием и другими околобеговыми рутинами."},{"kind":"p","text":"А у меня была КОМАНДА!"},{"kind":"p","text":"Всего на «‎Искре» за сутки побывало не меньше трёх десятков товарищей по беговому сообществу, друзей и членов семьи. Кто-то заходил на 30-40 минут, кто-то на несколько часов, кто-то дежурил в лагере всю ночь!"},{"kind":"p","text":"Капитан Андрей Меньшов – целые сутки. Влада – сутки с перерывами. Родители приезжали на стадион трижды и провели на нём не меньше 5-6 часов. Ночная смена – образчики терпения, принятия, заботы и поддержки. А Женя Однорог за сутки успел и сам пробежать 208 километров, и сопроводить полдюжины своих подопечных, и помочь советами, наставлениями и подпинываниями мне – оказалось очень актуально и ценно."},{"kind":"p","text":"Физический вклад: ребята рано утром заняли на стадионе лучшее место для лагеря, поставили шатёр, по расписанию кормили и поили на дистанции. Добывали во время соревнования дополнительное питание и фарму. Помогали переживать кризисы, мазаться кремами и переодеваться. Согревали на ночных остановках. А после старта, когда мне было очень не очень, собрали весь лагерь и загрузили его по машинам."},{"kind":"p","text":"Моральная поддержка: само присутствие, объятия, фоточки, разговоры, шутки, короткие пробежки вместе, музыка, плакаты, эмоциональная поддержка на финише. А ещё, не будь ребят рядом, вероятно, и не остался бы на стадионе к моменту общего завершения гонки."},{"kind":"p","text":"Организаторы сказали, что эта команда – самая яркая, большая и шумная за всю тридцатилетнюю историю соревнований. Я не особо люблю бег сам по себе, но с такими людьми вокруг любое занятие может быть любимым. Если читаете, ещё раз СПАСИБО!"},{"kind":"h3","text":"Съёмка фильма"},{"kind":"p","text":"Первая серия «‎Суточника» от Мишко Филмс про подготовку к старту собрала на Ютубе невероятные одиннадцать тысяч просмотров! Ребята не бросили затею поснимать и сам забег тоже."},{"kind":"p","text":"Подошли к вопросу основательно: свой шатёр, комплект всевозможных зарядок, несколько камер, осветительное оборудование. Что из всего этого получится, узнаю, видимо, только через 3-4 недели. Продакшн команда отсняла больше двух сотен гигабайт материалов – быстрее такой объём не переварить."},{"kind":"p","text":"Что помню из процесса съёмок:"},{"kind":"li","text":"Посиделки перед камерой у моего дома накануне старта. Говорили про самочувствие, готовность, настрой и план на гонку.","listType":"ul","listId":"list-16","level":0},{"kind":"li","text":"Как после каждого часа бега Миша снимал мой короткий спич про текущее состояние и мысли. И как ему неудобно было подходить ко мне с камерой в моменты, когда бег давался тяжело. Вот зря! Язык и ноги не были связаны: этот короткий ритуал больше поддерживал, чем мешал или отвлекал.","listType":"ul","listId":"list-16","level":0},{"kind":"li","text":"Как Миша уводил по одному в сторону от шатра ребят и девчат из команды, чтобы взять у них интервью на тему происходящего.","listType":"ul","listId":"list-16","level":0},{"kind":"li","text":"Подсъёмы бега с разных точек и ракурсов по ходу дистанции. И про то, как Миша, стесняясь, снимал мои приходы во время отдыха в лагере. Миша! Всё окей, ты же для этого и приехал. Зачем переживать?","listType":"ul","listId":"list-16","level":0},{"kind":"li","text":"Как после первого разворота несколько часов подряд принимал за Мишу мусорный пакет, который попадал в самый край периферийного зрения и раз за разом неверно интерпретировался слегка утомлённой нейронной сеткой.","listType":"ul","listId":"list-16","level":0},{"kind":"li","text":"Как после финиша шёл за Мишей на камеру, рассказывая про свои первые эмоции. А за мной и рядом шли ребята из команды. Непривычное ощущение себя голливудской звездой: ярко, приятно, но как будто бы не по статусу.","listType":"ul","listId":"list-16","level":0},{"kind":"p","text":"Ещё несколько мыслей на тему съёмки фильма."},{"kind":"p","text":"Во-первых, это нефиговый труд находиться в центре событий 24 часа с камерой и качественно делать не самую простую работу – кусок уважения! Тоже своего рода марафон на выносливость."},{"kind":"p","text":"Во-вторых, съёмочная команда была частью общей команды : п остоянно ощущал от ребят внимание, поддержку, заботу. И отвлечения на съёмочные рутины приятно разнообразили процесс, переключали мозг и помогали делу."},{"kind":"p","text":"В-третьих, фильм – рискованная ставка. Очень громко крикнул в пространство: «‎Гоп!» – и только потом пошёл прыгать. Больше мотивировало или давило? Помогло или помешало? Помогло! Как минимум добавило интереса и впечатлений – классный опыт, доволен, что вписался."},{"kind":"h3","text":"Другие впечатления"},{"kind":"li","text":"Про угасание сил на разных дистанциях. На домарафонских: почти линейный процесс, минимум сюрпризов. На ультрах интереснее: кризис в середине, а после него снова налаживается жизнь. На сутках ещё сложнее: американские горки кризисов и воскрешений. И не одна шкала сил, а пяток разных источников проблем: питание, ОДА, утомление, психика и чёрт знает, что ещё.","listType":"ul","listId":"list-17","level":0},{"kind":"li","text":"В довесок к пункту выше: для всех предыдущих гонок «‎сесть и сидеть» для меня означало конец соревнования. А в сутках это может быть эффективным тактическим приёмом, который неплохо бы изучить и освоить.","listType":"ul","listId":"list-17","level":0},{"kind":"li","text":"Одна из двух мыслей «‎а что если»: стоило ли начать поспокойнее? Может быть, тогда не встретил бы таких проблем с желудком и силы бы меня покинули попозже? Не знаю. Но точно бы отстал на несколько километров от плана и не факт, что смог бы их легко отыграть, уже растратив стартовую свежесть и задор.","listType":"ul","listId":"list-17","level":0},{"kind":"li","text":"Вторая: насколько был бы лучше результат, без этих спазмов? Так это не работает. Никто не знает, чтобы было бы. Возможно, если бы я смог продолжить бежать в хорошем темпе дольше, я бы раньше и жёстче поймал ту же самую проблему с надкостницей. И что тогда?","listType":"ul","listId":"list-17","level":0},{"kind":"li","text":"Впервые на длинной гонке мне не хотелось Кока-колы. Да и конфет съел всего несколько штук – от сладкого воротило. Самой желанной съедобной фантазией было мороженое! Но рисковать сходом ради эксперимента не стали.","listType":"ul","listId":"list-17","level":0},{"kind":"li","text":"Готовиться к суткам сложно. Непонятно, как тестировать и отрабатывать приёмы промежуточного отдыха и питания, эффект которых можно оценить только после 10-12 часов интенсивного бега.","listType":"ul","listId":"list-17","level":0},{"kind":"li","text":"Усталость и первые срьёзные проблемы встретил уже через 6-7 часов после старта из 24 часов гонки. Так рано! И всё равно хороший результат. Кажется и нелогичным, и необычным.","listType":"ul","listId":"list-17","level":0},{"kind":"li","text":"Про 200 километров. По ощущениям я не «не успел», а именно «не смог». Мне не времени не хватило, а сил, в расширенном значении слова про питание, ОДА, энергию и так далее.","listType":"ul","listId":"list-17","level":0},{"kind":"li","text":"По итогам гонки нет ни страха, ни желания повторять что-то подобное в ближайшие пару лет. Потом – может быть. Особенно, если к тому времени сделаю личник на марафоне из 3:15 и отработаю более эффективные протоколы питания.","listType":"ul","listId":"list-17","level":0},{"kind":"h2","text":"4. Заключение"},{"kind":"p","text":"В этот раз очень быстро «спрямились» эмоции. Сейчас думаю, что было нормально: местами тяжело, кое-где помучился, устал финально чуть раньше самого финиша, но и хорошего было много, доволен. Классное, мол, приключение."},{"kind":"p","text":"Но ведь реальная амплитуда эмоциональных колебаний, наверняка, была сильнее. И страдал в процессе, мне кажется, сильно, долго и разнообразно. Просто бутеры с сыром в кресле под пледом и ушедшее за облака солнце как будто обнулили эти эмоциональные записи. Или нет?"},{"kind":"p","text":"Неважно. Сейчас я доволен и рад! А важно вот что:"},{"kind":"li","text":"191 километр 869 метров за 24 часа","listType":"ul","listId":"list-18","level":0},{"kind":"li","text":"10 место из 50 участников","listType":"ul","listId":"list-18","level":0},{"kind":"li","text":"2-й взрослый разряд по л/а с большим запасом","listType":"ul","listId":"list-18","level":0},{"kind":"li","text":"Яркие эмоции, интересный опыт, много фоточек на память","listType":"ul","listId":"list-18","level":0},{"kind":"li","text":"Психика не хуже, чем была до старта. А тушка быстро приходит в норму","listType":"ul","listId":"list-18","level":0},{"kind":"li","text":"Приятное предвкушение будущего фильма про забег","listType":"ul","listId":"list-18","level":0},{"kind":"p","text":"Отлично отметил десять лет причастности к марафонскому бегу, я считаю."}]},{"id":"2023-сутки-бегом-за-одну-неделю-до","catalogPrefix":"Сутки 2023 ·","catalogTitle":"Неделя до","catalogSubtitle":"Подготовка","title":"«Сутки бегом». За одну неделю до","docTitle":"2023 — «Сутки бегом». За одну неделю до","sourceUrl":"https://ddv-comrades.blogspot.com/2023/05/blog-post.html","categories":["Ультра"],"date":"2023","place":"Москва","distance":"Цель: 200–205 км","result":"","elevation":"","format":"Подготовка к 24-часовому бегу","facts":[{"label":"До забега","value":"1 неделя"},{"label":"Цель","value":"200–205 км"},{"label":"Формат","value":"Суточный бег","wide":true}],"summary":"Финальная неделя перед первыми сутками: тренировочные объёмы, самочувствие и прогноз на старт.","related":[{"id":"2023-сутки-бегом-за-шесть-недель-до","label":"За шесть недель до старта"},{"id":"2023-сутки-бегом-отчет-о-старте","label":"Отчёт о старте"}],"paragraphs":[{"kind":"p","text":"Ну вот и всё. Подготовка закончилась. Осталось только попробовать хорошо поспать на неделе и ничего не забыть при сборах. Готовей чем есть, уже не буду."},{"kind":"h2","text":"Саммари по подготовке"},{"kind":"p","text":"За условные полгода тренировок к старту в среднем получилось 3,1 пробежки в неделю. В будни бегал кроссы, по выходным – длительные. Ещё два раза в неделю занимался в зале всяким не беговым."},{"kind":"p","text":"Пробежек от марафона и более за период: 13 штук. От шестидесяти километров и более – 6 штук. Самая длинная из длительных – 72 километра за примерно 8 часов. В апреле марафон-плюс пробежек было пять штук: то есть, каждые выходные на протяжении месяца."},{"kind":"p","text":"Объёмы по месяцам:"},{"kind":"li","level":0,"listId":"prep-months-2023","listType":"ul","text":"Ноябрь: 230"},{"kind":"li","level":0,"listId":"prep-months-2023","listType":"ul","text":"Декабрь: 222"},{"kind":"li","level":0,"listId":"prep-months-2023","listType":"ul","text":"Январь: 287"},{"kind":"li","level":0,"listId":"prep-months-2023","listType":"ul","text":"Февраль: 260"},{"kind":"li","level":0,"listId":"prep-months-2023","listType":"ul","text":"Март: 408"},{"kind":"li","level":0,"listId":"prep-months-2023","listType":"ul","text":"Апрель: 459"},{"kind":"p","text":"Готовность к забегу проверит сам старт, но, считаю, что подвёлся здорово. Никогда ещё не чувствовал себя настолько выносливым и сильным."},{"kind":"p","text":"Мог бы подготовиться лучше? Наверное, нет. Но в следующий раз постарался бы пораньше выйти на объёмы 350+ километров в месяц. И таки добавил бы ещё хотя бы одну пробежку на неделе, например, что-нибудь манежно-стадионное километров на 10-15."},{"kind":"p","text":"Ну и ещё, увы, не получилось побегать в жару. В Москве резко похолодало: возможности акклиматизироваться к гипотетически вероятному бегу в плюс двадцать у меня не было. Это риск, но ничего уже не поделаешь."},{"kind":"h2","text":"Как самочувствие"},{"kind":"p","text":"Выгорание, усталость, забитость – ничего этого нет. Были сложные пробежки, в конце которых думал «всё, баста, ни километром больше‎», но восстанавливался уверенно и быстро. Чего только стоит частично темповая двацадка через день после победы на Тетрагоне."},{"kind":"p","text":"Особая радость: за последние недели было несколько пробежек, в которых получал удовольствие от бега. Чувствовал лёгкость и упругость ног, радовался тому, как уверенно и лихо они перебирают по грунту и асфальту. Лишь однажды что-то подобное чувствовал перед целевым стартом – кажется, это было перед самым быстрым из моих Московских Марафонов."},{"kind":"p","text":"Хорошо себя чувствую. И телом, и головой."},{"kind":"h2","text":"Прогноз на старт"},{"kind":"p","text":"Всё получится. Пострадаю, выдумаю себе какую-нибудь драму на ровном месте. Сам для себя героически её преодолею и таки пробегу свои 200 или даже 205 километров. Ну или нет: отпишусь тут через пару неделек, как получилось."},{"kind":"p","text":"Другой вот вопрос есть."},{"kind":"p","text":"Смешной."},{"kind":"p","text":"Допустим, получится!"},{"kind":"p","text":"Как про это думать? И как говорить?"},{"kind":"p","text":"С одной стороны, не хочется быть как будто бы гламурным самовлюблённым тщеславным гордецом, который, как подвигу, радуется умеренно прикольному результату. С другой, не хочется и уходить в избыточную скромность, самоуничижение и обесценивание через «Да чего вы, не надо добрых слов, не о чем тут говорить. Ну пробежал и пробежал, любая бабушка так может. Всё-всё, засмущали‎»."},{"kind":"p","text":"Вот, уже начал: выдумал проблему! Как-нибудь уж справлюсь с гипотетическим испытанием медными трубами, если реально существующее испытание Искрой пройду."}]},{"id":"2023-приятный-сюрприз","title":"Приятный сюрприз","docTitle":"2023 — Приятный сюрприз","sourceUrl":"https://ddv-comrades.blogspot.com/2023/04/blog-post_18.html","categories":["Ультра","Приключения"],"date":"2023","place":"Москва","distance":"54 км (+18 км разминка)","result":"1-е место в команде","elevation":"","format":"6-часовой городской рогейн «Тетрагон»","facts":[{"label":"Лимит","value":"6 часов"},{"label":"Результат","value":"54 км"},{"label":"Командный зачёт","value":"1-е место"},{"label":"Формат","value":"Городской рогейн","wide":true}],"summary":"Первая победа в беговом соревновании — командный городской рогейн с длинной ночной дистанцией.","paragraphs":[{"kind":"p","text":"Вообще не планировал в ближайшее время писать что-то подобное. Но случился нежданчик: я впервые в жизни выиграл соревнования по бегу!"},{"kind":"p","text":"«‎Выиграл» – со звёздочкой."},{"kind":"p","text":"«‎По бегу» – тоже не беспорное утверждение."},{"kind":"p","text":"Сейчас чуть подробней расскажу."},{"kind":"h2","text":"Почему не совсем бег?"},{"kind":"p","text":"Старт назывался Тетрагон, номинация «‎6 часов бегом». Суть такая: надо за шесть часов пробежать мимо как можно большего числа объектов – станций метро и железной дороги. Если их брать в определённой последовательности, очков получится намного больше. Километраж тоже считается. За опоздание к финишу штраф."},{"kind":"p","text":"Преодолённое расстояние – 1 очко за километр. Стоимость объекта – 1 очко. Если два объекта подряд начинаются с одинаковых или последовательных букв алфавита, то их общая стоимость удваивается, если три подряд – утраивается и так далее."},{"kind":"p","text":"То есть побеждает в таком соревновании не самый быстрый и выносливый. А тот среди быстрых и выносливых, кто лучше других сделал домашнюю работу при подготовке к старту – придумал «‎дорогой» трек. Ну и, конечно, не запорол его на самой дистанции, прервав цепочку нужных станций случайным пробеганием мимо какой-нибудь лишней."},{"kind":"h2","text":"Почему не совсем победа?"},{"kind":"p","text":"Первое место я разделил с парой беговых товарищей, с которыми вместе и планировали маршрут, и преодолевали дистанцию."},{"kind":"p","text":"Более того, основным автором трека из пятнадцати подряд идущих объектов на букву «‎К» был Илья Дюков – вот кто причина нашей победы процентов на восемьдесят. Но, отбросив попытки побыть скромным, назову всё случившееся результатом слаженной командной работы. )"},{"kind":"p","text":"Тут, кстати, самое время передать привет и Андрею, и Ксюше – двум другим участникам нашего великолепного звёздного бегового квартета. Спасибо ребята за классную ночь."},{"kind":"h2","text":"Набор мини заметок про событие"},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"Про выбор старта. Классическая история: меня пригласили, и я согласился. Удобная возможность совместить предсуточную длительную, тренировку ночного бега и яркий досуг в хорошей компании. Так и вышло: 18 километров разминки до храма Василия Блаженного и 54 километра весёлого бега по ночному городу."},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"Про бег ночью. Мало машин, свежее воздух, почти нет людей на тротуарах – днём этот же маршрут бегать было бы не так задорно. Поспал дополнительно по полтора часа днём в субботу и утром в воскресенье – этого хватило. Не первый раз бегал ночью, каких-то особых биологических спецэффектов именно от этого компонента бега не заметил."},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"Про грустное. В нашей команде на старте было четыре человека, а финишировали и победили втроём. У Андрея потёк в жилете свежекупленный гидратор и капитально залил водой сам жилет, спину, попу и ноги. При температуре около двух градусов такой потоп оказался критичным – очень холодно. Пришлось сойти."},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"В шаге от провала. В один момент расслабились, потеряли концентрацию и чуть не запороли отлично спланированный трек: отклонились от курса и почти-почти попали в зону действия станции метро Дубровка, которая разорвала бы победную цепочку из 15 подряд идущих объектов на «‎К». До встречи с ноутбуком было не проверить, успели ли вовремя развернуться. И только дома измерил линейкой на Яндекс.Картах: 115 метров! По правилам зачётное расстояние – сотня. Повезло."},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"Километраж. У нас было порядком вынужденных остановок: суммарно по разным причинам потеряли минут 13-18. Ещё минуты 2-4, наверное, на фоточки. И ещё минуты три: ждали пока Ксюша разогнётся после шутки про… ну, не важно. В итоге пробежали 54 километра и финишировали минут за десять до лимита. Если бы успевали пробежать 60, могли бы удлинить цепочку ещё на одну станцию. Но и этого хватило."},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"Про финишный протокол. 23 человека стартовало, 18 финишировало. Двое участников пробежали чуть больше, чем мы – 55 и 56 километров соответственно. Но трек у нас оказался супер продуманским и поэтому победным. Даже сейчас нет идей, как его можно было бы улучшить."},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"Про первые разы. Про свой уже написал. Ещё ярче у Ксюши: первая ультра и сразу чемпионка и в абсолюте, и по девочкам. Вот он успешный, успех. Поздравляю."},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"Про отношение к победе. Очень радостно и ярко. Доволен. Понимаю, что не самый серьёзный старт и что не было сильной конкуренции: родной Измайловский паркран выиграть, кажется, сложнее. Ну и что? Всё равно приятно. Победа есть победа. И ещё наблюдение: командный успех ощущаю ярче, чем, кажется, ощущал бы личный."},{"kind":"li","level":0,"listId":"tetragon-notes","listType":"ul","text":"Про подготовку к суткам. Вместе с «‎разминкой» получилось 72 километра за 8 часов – это будет самая длительная тренировка перед целевым стартом. Перенёс хорошо. Представить, что буду бежать в три раза дольше и больше пока всё ещё сложно. Впрочем, и когда уже пробегу, уверен, будет сложно поверить, что смог."}]},{"id":"2023-сутки-бегом-за-шесть-недель-до","catalogPrefix":"Сутки 2023 ·","catalogTitle":"Шесть недель до","catalogSubtitle":"Подготовка","title":"«Сутки бегом». За шесть недель до","docTitle":"2023 — «Сутки бегом». За шесть недель до","sourceUrl":"https://ddv-comrades.blogspot.com/2023/04/blog-post.html","categories":["Ультра"],"date":"2023","place":"Москва","distance":"Цель: 200 км","result":"","elevation":"","format":"Подготовка к 24-часовому бегу","facts":[{"label":"До забега","value":"6 недель"},{"label":"Цель","value":"200 км"},{"label":"Формат","value":"Суточный бег","wide":true}],"summary":"Зачем вообще бежать сутки, как устроена подготовка и почему цель в двести километров выглядит возможной.","related":[{"id":"2023-сутки-бегом-за-одну-неделю-до","label":"За одну неделю до старта"},{"id":"2023-сутки-бегом-отчет-о-старте","label":"Отчёт о старте"}],"paragraphs":[{"kind":"p","text":"В старших классах одним из нормативов по физкультуре был один километр бегом. В университете – три километра. Когда в двадцать с хвостом бегал «для здоровья и антистресса‎» не из под палки, это были дистанции от полутора до пяти километров."},{"kind":"p","text":"Что общего у этих историй? Каждая из них была событием и предметом локальной гордости за свою физическую удаль. «‎Ну крутой!» – думал я про себя."},{"kind":"p","text":"В 2013 году что-то сломалось. Начался период совершенно других представлений о том, что такое длинный бег. И один за другим начали появляться в копилке личного опыта финиши на дистанциях 30, 42, 70, 88, 90, 105… и 162 километра!"},{"kind":"p","text":"Божечки, ущипните меня, это реально? Как это 4-5 часов бега подряд стали обычной воскресной рутиной, про которую даже отдельный пост в Фейсбуке писать не хочется?"},{"kind":"p","text":"Тело привыкло. Окружение тоже привыкло и уже не считает ультрабег каким-то особенным подвигом. Привык ли сам? И да, и нет. Вроде бы, уже рутина. А смотрю иногда на это всё глазами себя хотя бы пятилетней давности и слегка офигеваю. Мол, остановите планету, я сойду: в смысле, за раз бежать 100+ километров??!!"},{"kind":"h2","text":"Во что вписался в этот раз?"},{"kind":"p","text":"Соревнование называется «Сутки бегом‎». Состоится в Москве на стадионе Искра с 13 на 14 мая. В полдень начнётся и в полдень закончится. Чем больше пробегу, тем больше молодец."},{"kind":"p","text":"За месяц с небольшим до старта дела мои примерно таковы:"},{"kind":"li","level":0,"listId":"prep-state-2023","listType":"ul","text":"Тренируюсь «по плану‎»: стараюсь пробегать за неделю что-то близкое к 100 километрам, бегаю регулярно длительные от 4 до 7 часов и пару раз в неделю хожу в зал, чтобы укреплять ОДА."},{"kind":"li","level":0,"listId":"prep-state-2023","listType":"ul","text":"Прочитал заметки Сергея Якимова про его опыт участия в этих соревнованиях за прошлый и позапрошлый годы. Подметил любопытные организационные моменты, позаимствовал пункты для чек-листов. Болезненным щелчком по уху получил напоминание о том, что будет адски сложно."},{"kind":"li","level":0,"listId":"prep-state-2023","listType":"ul","text":"Собрал костяк команды поддержки, выбрал капитана. Как раз у Сергея почерпнул, что суточный бег – во многом командный вид спорта. От поддержки зависит и результат, и ощущения в процессе."},{"kind":"li","level":0,"listId":"prep-state-2023","listType":"ul","text":"Сохранил в заметках первые прототипы чек-листов на экипировку, питание и разное сопутствующее. Ищу, вот, шатёр теперь. Остальное соберу ближе к делу."},{"kind":"li","level":0,"listId":"prep-state-2023","listType":"ul","text":"Определился с целью на старт: ДВЕСТИ километров. 500 кругов, 7 минут на километр, 24 часа. Это норматив на 1-й взрослый разряд."},{"kind":"li","level":0,"listId":"prep-state-2023","listType":"ul","text":"Вовлёкся в съёмку MISHKO FILM`S про себя и своё участие в соревновании. В купе с собранной командой и оплаченным слотом – упс, нет пути назад, придётся бежать."},{"kind":"h2","text":"Каковы шансы на успех?"},{"kind":"p","text":"Затея звучит безумно, но шансы есть довольно неплохие. Мой прошлый «подвиг‎»: 100 миль ЗКМ за 22 часа – безумие того же порядка. Здесь дистанция ещё на один марафон длинее, но:"},{"kind":"li","level":0,"listId":"prep-reasons-2023","listType":"ol","text":"И времени будет на два часа больше"},{"kind":"li","level":0,"listId":"prep-reasons-2023","listType":"ol","text":"Побегу без двухкилограммового жилета с водой, гелями и экипировкой"},{"kind":"li","level":0,"listId":"prep-reasons-2023","listType":"ol","text":"Плоский стадион без рельефа и тропинко-трейловых участков"},{"kind":"li","level":0,"listId":"prep-reasons-2023","listType":"ol","text":"Без затрат усилий и времени на навигацию"},{"kind":"li","level":0,"listId":"prep-reasons-2023","listType":"ol","text":"Плюс два года регулярных тренировок"},{"kind":"li","level":0,"listId":"prep-reasons-2023","listType":"ol","text":"Большие беговые объёмы, лучшая форма и занятия в зале"},{"kind":"li","level":0,"listId":"prep-reasons-2023","listType":"ol","text":"Команда поддержки рядом и внешняя ответственность за результат"},{"kind":"p","text":"На мой вкус, весьма убедительный список причин для того, чтобы справиться. Но, получится ли на самом деле, конечно, не понятно."},{"kind":"p","text":"Самые значимые риски:"},{"kind":"li","level":0,"listId":"prep-risks-2023","listType":"ul","text":"Недостаточная подготовка. Всего 3,5 пробежки в неделю и беговые объёмы на уровне средней руки марафонца, а не ультрача"},{"kind":"li","level":0,"listId":"prep-risks-2023","listType":"ul","text":"Не сдюжу психологически кружиться 24 часа по четырёхсотметровому кругу стадиона"},{"kind":"li","level":0,"listId":"prep-risks-2023","listType":"ul","text":"Не справлюсь с кризисами, которые точно будут. Не продолжу бежать, не перетерплю"},{"kind":"li","level":0,"listId":"prep-risks-2023","listType":"ul","text":"Не осилю оставшийся месяц подготовки: уроню объёмы, травмируюсь или перегорю"},{"kind":"li","level":0,"listId":"prep-risks-2023","listType":"ul","text":"Нарвусь на плохую погоду в день старта: ливень или жара"},{"kind":"li","level":0,"listId":"prep-risks-2023","listType":"ul","text":"Стопнусь из-за проблем со здоровьем: мозоли, например, или проблемы с ЖКТ"},{"kind":"h2","text":"Ну и?"},{"kind":"p","text":"Пока никаких выводов. Просто было интересно подумать об текст и поделиться мыслями как минимум с собой."},{"kind":"p","text":"Тренить, высыпаться и не делать глупостей – вот план на ближайшие полтора месяца. Попробую осилить."}]},{"id":"2023-московский-марафон-2023","title":"Московский Марафон 2023","docTitle":"2023 — Московский Марафон 2023","sourceUrl":"https://ddv-comrades.blogspot.com/2023/09/2023.html","categories":["Марафоны"],"date":"2023","place":"Москва","distance":"42,2 км","result":"3:57:57","elevation":"","format":"Шоссейный марафон","summary":"Дежурный Московский марафон без погони за личником.","paragraphs":[{"kind":"p","text":"Смешанные чувства. Вроде бы и ничего так. И есть, что хорошего отметить. Но прямо сейчас, когда начинаю писать заметку, хочется сказать «‎не понравилось». И не потому, что было плохо. Скорее из-за того, что ожидания были другими."},{"kind":"p","text":"Сейчас и напишу: чего хотел, что было хорошего, что не зашло."},{"kind":"h2","text":"Чего хотел"},{"kind":"p","text":"Цель на марафон была примерно такая: «‎Получить медаль и не напрягаться». А ещё хотел попробовать прочувствовать вот эти вот яркие позитивные эмоции бегового праздника, которые частенько наблюдаю среди товарищей по хобби: «‎Ах! Ух! Это как лучшая новогодняя вечеринка и бразильский карнавал вместе взятые»."},{"kind":"p","text":"«‎Не напрягаться от марафона» – звучит дерзко? Ну не знаю. Московский я бегал до этого уже семь раз, лучший результат был в 2017-м : 3 часа 32 минуты. В этот раз я к марафону специально не готовился, но пробежать планировал за примерно четыре часа – кажется, можно рассчитывать на некую лёгкость в таком контексте, м?"},{"kind":"h2","text":"Что было хорошо"},{"kind":"p","text":"Может быть не очень длинный, но приятный список:"},{"kind":"li","text":"Комфортный околобег. Лёгкая дорога в компании до старта, быстро нашлись толпой Измайлонга на общую фотографию, минимум времени в очередях на вход и оба раза в туалет. И, кстати, оба раза – не синие кабинки, а что-то поприличнее. Легко переоделся на лавочке под солнцем и сдал вещи. Вообще не мёрз.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Люди. Хоть и странно видеть это пункт в плюсах для умеренно социофобушки меня. Весь марафон в компании Лёши Иванова – давнего товарища и бегового бадди времён первого Комрадса: раппорт, комфорт, приятно и есть о чём поговорить. На дистанции, в городке и среди болельщиков встречал много друзей и подруг, кого рад был видеть. Не зря в город выбрался.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Хватило сил. Стартовали из предпоследнего кластера и незаметно для себя потихоньку прибавляли: средний темп по ходу дистанции с 6:01 поднялся до 5:38. За четыре марафонских часа обогнали примерно 4000 участников.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Забавный опыт. Свело икры за 40 метров до финиша. Первые сигналы поймал примерно за километр. Потом ещё. Потом сильнее. Финишное ускорение на двести метров делал очень бережно – мало ли, с какой силой их прихватит. Прихватило умеренно почти перед самым финишем, повезло. Впервые за 11 лет бега финишировал пешком. Зря, видимо, забил на солевые таблетки. Было скорее забавно, чем неприятно – поэтому пункт в этом списке, а не в следующем.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Божественный молочный коктейль. В Беверли Хиллс на Сретенском бульваре. Лучший напиток, который можно пожелать себе после утомительного бегового мероприятия.","listType":"ol","listId":"list-1","level":0},{"kind":"h2","text":"Что не зашло"},{"kind":"p","text":"Этот ещё короче, но почему-то он задаёт настроение:"},{"kind":"li","text":"Устал на дистанции. Возможно, это нормально для марафона. Но я же чёртов ультрач, суточник и вообще сверхчеловеческий супергерой. Почему тогда тяжело на марафоне, который на полчаса медленнее личника? Потому, что тренируюсь под пятёрку? Почти не спал ночью? Было солнечно и жарко? Может быть! Но я хотел же медаль и не напрягаться. А тут такое – устал и даже потерпел километров 7-10 перед финишем.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Так себе самочувствие после. Возможно, захватил с финиша либо лёгкое обезвоживание, либо небольшой тепловой удар. Сухие губы, общая слабость, бесячесть на солнце, сложно сконцентрироваться на чём-то. Полегчало после холодного коктейля из 5-го пункта предыдущего списка и еды.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Не поймал эйфорию. Ну вот снова! Как, как люди ощущают вот эту вот атмосферу праздника? «Шум, гам, веселье, ура!‎» – пробовал через такие линзы смотреть вокруг себя, но прочувствовать снова не получилось.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Сомнения про беговую форму. У меня были фантастические объёмы в первой половине года и хорошие в последние месяцы. Положенные марафонцу длительные отстоял с бодрым для себя темпом 5:30. Работы хоть и под пятёрку, но делаю 2-3 раза в неделю. И чего? За сколько бы пробежал, если бы попробовал на максимум? А я всё ещё супергерой или уже доходяга? Глупые и неуместные вопросы после нецелевого страта в середине подготовки к вообще другой дистанции, но почему-то всплыли и тоже влияют на настроение.","listType":"ol","listId":"list-2","level":0},{"kind":"h2","text":"Итого"},{"kind":"p","text":"Выводов не будет. Отмечу только, что всё равно доволен, хоть и брюзжу. Странно было ожидать совсем уж лёгкую прогулку. Ну и хороший щелчок по носу перед поездкой в Геленджик: чтобы не задавался перед Невестой и был готов хорошо пострадать в горах."},{"kind":"p","text":"Без GPS, кстати, в целом, терпимо – можно бежать по километровым знакам. Просто странно такое принимать за норму. Ну эх."}]},{"id":"2023-и-снова-белая-невеста-m70","title":"И снова «Белая невеста». M70","docTitle":"2023 — И снова «Белая невеста». M70","sourceUrl":"https://ddv-comrades.blogspot.com/2023/10/70.html","categories":["Ультра","Трейлы","Приключения"],"date":"2023","place":"Геленджик","distance":"75 км","result":"14:57:36","elevation":"≈2500","format":"Горная ультра; повторный старт","summary":"Второй год подряд на White Bride M70 — жарко, сложно, понравилось.","paragraphs":[{"kind":"p","text":"«Повторение – мать учения». Из позитивного вновь пережитого опыта: дух приключения, время года, локация, организаторы и дистанция с приблизительно тем же километражом и набором. Из того, что предпочёл бы не повторять: отсутствие целенаправленной подготовки, слишком тёплая для меня погода и неготовность ОДА к спускам."},{"kind":"p","text":"И многие впечатления от старта, соответственно, тоже как под копирку с предыдущей невестой : первые более-менее бодрые подъёмы, угасание в середине дня от жары и возрождение ближе к финишу."},{"kind":"h2","text":"Чем эта поездка в Геленджик таки отличалась от предыдущей"},{"kind":"li","text":"Более сложная логистика. В этот раз на катере от Сочи прокатиться не получилось – не хватило билетов. Вместо четырёхчасового путешествия по волнам – почти восемь на связке «‎электричка + такси». Дешевле, но утомительнее.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Красивее и проще трасса. Меньше общий набор высоты, менее техничные спуски, в два раза больше пунктов питания и больше пробегов по открытым хребтам.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Забег без бадди. Бежал в одного и лишь на участке с 62-го по 67-й нашёл себе компанию на поболтать – спасибо тебе, Оксана из Владимира.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Ещё жарче. Плюс девятнадцать на старте в пять утра. До плюс двадцати шести днём. Очень сложная для меня погода.","listType":"ol","listId":"list-1","level":0},{"kind":"h2","text":"Самые яркие впечатления с дистанции"},{"kind":"li","text":"Начал забег аутсайдером. Стартовал в хвосте, бежал неспешно и одним из первых перешёл на шаг ещё на полпути к первой горке. Жарко.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Крутость и сложность первого подъёма. Большой градиент, сыпуха. Трудно и забираться вверх, и не съезжать вниз, чтобы как кегли не сбить ребят за собой.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Виды! Смотровая площадка с крестом в середине первого подъёма, горные хребты, «‎грозовые ворота», тропы среди сосен, вид с обрыва из леса на море. Много красоты.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Разница в уровне подготовки с сильными ребятами. Спустя 4 часа 17 минут меня обогнал лидер на дистанции E50, который стартовал на два часа позже! Трусцой забегал в подъём, куда я с усилием шёл пешком опираясь на обе палки.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Выживание в пик жары с 11 до 15 часов. Пешком даже по ровной поверхности и на спусках. Высокий пульс, одышка, общее неуверенное самочувствие. Действовал умно: знал, что пройдёт и надо просто неспешно двигаться вперёд, аккуратно дозирую нагрузку.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Короткие но непростые техничные участки. В этот раз сложные спуски запомнились не болючими камнями, а крутым градиентом и сыпухой. Чудом ни разу не упал: то пролетал участки вниз от дерева до дерева, то успевал с нужной скоростью перебирать ногами, удерживаясь в относительно вертикальном положении.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Дежурно за первую половину дистанции перегрузил квадрицепсы, стёр пятки и отбил мизинцы. В этот раз ещё и ягодичным досталось. Не стал дожидаться неотложной необходимости и начал помогать себе Нурофеном уже за 5-6 часов до ожидаемого финиша.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"ПП4 на 44-м километре перед «горкой-вызовом‎». Вода, кола, арбуз и ДВА стакана горячего чая по 5-6 кусков сахара в каждом. Это было похоже на оргазм – настолько ярко, круто, вкусно. Не ожидал, что обычный чай может так доставлять.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Второй раз в аду – снова проблемная горка, которая год назад была четвёртой, а сейчас – третьей. Упёрто шёл вверх, зная, что рано или поздно она закончится. Пот струёй стекал с козырька. Раз в пару минут приходилось останавливаться на 15-20 секунд, чтобы хоть немного успокоить сердце.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Обливание головы водой на каждом ПП и ледяной водой на финише. Так хорошо, так приятно, так свежо. Длительность эффекта, увы, никакая – только в процессе и пару секунд после.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Годный для горного трейла темп можно поддерживать и без бега по ровному и спускам. Быстрый и ритмичный шаг вполне позволяет проходить не экстремальные участки с темпом уверенно из 11 минут на километр.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Пара прикольно-неочевидных навигационных моментов: основная дорога идёт в одну сторону, менее привлекательная – в другую. Но обе ведут мимо трека и разметки: надо в овраг, в кусты, в заросли где-то между. Да, оба раза возвращались назад метров двести.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Спадение дневной жары и Нурофен – ожидаемо вернули к жизни. Бодро преодолел последнюю треть дистанции и традиционно накатил на финише. Запас на результат «из 15 часов‎» теперь уже две с половиной минуты против прошлогодних 20 секунд.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Рассказ Оксаны, которая бежала L120: «‎Перегрелась, получила тепловой удар, поспала час на тропинке» – а я думал, что это мне сильно досталось от солнца. Вот оно как бывает.","listType":"ol","listId":"list-2","level":0},{"kind":"h2","text":"Какие мысли по итогу"},{"kind":"p","text":"Ощущал себя очень слабым в процессе, когда еле-еле карабкался в горки и пешеходил в жару. Ощущал себя сильным, когда понимал, что несмотря на все сложности всё равно финиширую с запасом до лимита."},{"kind":"p","text":"66-е место из 91 стартовавших – нестыдный результат, доволен. Но хочу совершенно не этого. Хочу уверенно бегать такие гонки с запасом по силам. Хочу за счёт уменьшения интенсивности мочь превратить горный забег на выносливость в фанран на удовольствие. Хочу забегать в горки, хочу ловко и уверенно пролетать спуски. Хочу финишировать в первой четверти участников. Возможно ли это?"},{"kind":"p","text":"Ну, во-первых, к таким забегам нужно готовиться! И, пожалуй, это был мой последний сложный старт, на подготовку к которому я совсем забил. Во-вторых, не факт, что возможно, тренируясь только в Москве. В-третьих, а нужно ли?"}]},{"id":"2022-white-bride-ultra-trail-m70","title":"White Bride Ultra Trail. M70","docTitle":"2022 — White Bride Ultra Trail. M70","sourceUrl":"https://ddv-comrades.blogspot.com/2022/10/white-bride-ultra-trail-m70.html","categories":["Ультра","Трейлы","Приключения"],"date":"2022","place":"Геленджик","distance":"≈75–77 км","result":"14:59:40","elevation":"≈2800","format":"Горная ультра M70","summary":"Длинный горный старт White Bride с большим набором и почти пятнадцатью часами на ногах.","paragraphs":[{"kind":"p","text":"Летом в очередной раз я повзрослел, а на день рождения принято дарить подарки. Диалог в чате с бегунами-приятелями вышел примерно такой:"},{"kind":"p","text":"– Дим, а ты Белую Невесту бежишь?– Думал про это, но не поеду – в октябре плотно на работе.– А слот есть?– Нет, не покупал.– Теперь есть. Проверяй почту."},{"kind":"p","text":"Так в июле появился зародыш инфоповода для этой заметки. Сейчас, на первой неделе октября, мне больно садиться, вставать и двигаться по неровной поверхности. Сильно болят передние поверхности, чуть меньше – ягодицы. Ступеньки, табуретки, попытки зашагнуть в ванну – боль. Синяки на щиколотках, мозоли на стопах, царапины на руках. White Bride Ultra M70, господа!"},{"kind":"p","text":"Доволен ли? Как слон. Но обо всём по порядку."},{"kind":"h2","text":"Подготовка к старту"},{"kind":"p","text":"Это абзац не научит атлета-любителя подводке к горным ультра: до последнего не знал, поеду ли на гонку. И, соответственно, особо не готовился к ней."},{"kind":"p","text":"Были хорошие беговые объёмы в районе 300 километров в месяц и тренировки, заточенные под конфессиональные (плоские, до марафона длиной) асфальтовые старты. Вот и всё. Ни СФП, ни горок, ни даже подъёмов по лестнице в подъезде."},{"kind":"p","text":"Думал: «Бегал же раньше и покруче гонки. Значит, и с Невестой справлюсь». Так, конечно, не очень работает. К гонкам покруче я всё-таки готовился."},{"kind":"p","text":"Почему не был уверен, что поеду? Нагрузка на работе. Сложности, связанные с внешней политикой страны, где живу. Логистические нюансы. Кое-какие личные заботы. Наверное, у многих сейчас примерно так же – есть о чём побеспокоиться и горизонт планирования от недели до нескольких. Вот и у меня."},{"kind":"h2","text":"Коротко про логистику"},{"kind":"p","text":"Вариант по умолчанию: «до Новороссийска самолётом и полтора часа на такси» в этом году, увы, недоступен. Выбирал из альтернативных:"},{"kind":"li","text":"До Новороссийска поездом. Не фанат железной дороги – долго и некомфортно. И билетов вменяемых не осталось к моменту, когда я решил точно ехать.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"До Геленджика за рулём – дорожное приключение! В теории, неплохо. Но, во-первых, нужна компания. Во-вторых, после 40 часов за рулём, между которыми горная ультра, мне бы понадобилась ещё неделя отпуска. А даже эту одну позволил себе не без труда. Тоже мимо.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"До Сочи на самолёте и на катере до Геленджика. Не дешёвая опция со своими нюансами, но именно этот вариант победил. Главным образом потому, что позволял не думать: синхронизировался по билетам на самолёт с ребятами (Мишей и Олей) и возложил все другие логистические решения на их плечи.","listType":"ul","listId":"list-1","level":0},{"kind":"p","text":"Про Мишу внимательный читатель блога уже наслышан – мой бадди почти на всех беговых приключениях с 2019 года. А Оля – его подруга. Ещё она – человек-трейлраннер и девушка-триатлет. Познакомился с ней полтора года назад в Дагестане перед забегом по местным горкам. А на этом выезде Оля – уже полноценный член команды, планировали бежать втроём."},{"kind":"p","text":"Перелёт из Москвы в Сочи. Около часа подождал ребят в аэропорту, попивая кофе и доделывая догнавший меня кусок работы. На такси до Адлера. С небольшим приключением вселились в гостиницу. Утром пробежка, завтрак, кофе. Дождались у причала мастера чайных церемоний Марину – привет, Марина, если читаешь эти строки."},{"kind":"p","text":"Вчетвером на морской «Комете» отправились в пункт назначения. Был риск, что не повезёт с погодой – тогда бы катер заменили на аренду авто. Но повезло: поездка на катере – супер удобно. Было бы лучше, только если бы стоило дешевле 3000 рублей на человека. И если бы не приложился при посадке головой об дверной косяк – больно и шишка. Кино посмотрели в дороге, было хорошо."},{"kind":"h2","text":"Лаконично про Геленджик"},{"kind":"p","text":"Геленджик приятно удивил. Ожидал, что увижу деревню у моря. А увидел симпатичный город, с широкой тенистой набережной, огромным количеством приятных и уютных кафешек, аккуратными газончиками, городской мебелью и прочее, и прочее. Вау!"},{"kind":"p","text":"Ошибкой было снимать номер в 35 минутах езды от старта, Экспо и точек проживания всех других атлетов. Исправил после первой ночи на отшибе – спасибо тебе, Измайлонг, за море возможностей и классных людей рядом."},{"kind":"p","text":"Неприятные пунктики: такси нужно ждать, а интернет ловит не везде. А ещё гостиницы, что видел, не торт – крохотные неудобные ванные или совок. Или и то, и другое сразу. Марина с подругой Олей снимали квартиру через Авито – хорошая идея!"},{"kind":"h2","text":"Планы и мысли до старта"},{"kind":"p","text":"Вводные по гонке были такие:"},{"kind":"li","text":"Наша дистанция – 75 километров с набором 3500 метров. Не самый экстремальный вариант из представленных и не самая сложная из того, что приходилось бегать.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"На трассе четыре больших горки с набором около 500-600 метров. Первые три – на первой трети маршрута. Последняя – в начале второй половины. Кажется, что это удобно – упоролся в начале, а потом спокойно добегаешь. Опыт подсказывал, что три «небольших» горки на второй части дистанции тоже могут доставить хлопот. И что спусков с горок стоит опасаться не меньше, чем самих горок. Расслабляться после экватора не планировали.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Ещё из особенностей дистанции – большие расстояния между пунктами питания, начиная со второго: 31, 17 и 17,5 километров. Для гор – ну такое. Придумали взять каждому по третьей фляге для длинного автономного участка.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Погоду не учитывали как фактор риска – октябрь же, да и обещали облака почти с самого утра. Не будет сильной жары? Вот и отлично.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Лимит времени показался жёстким: 17 часов! Многократно повторив одну и ту же ошибку в арифметике, был уверен, что минимально приемлемый темп – 12 минут на километр. Придётся попахать.","listType":"ul","listId":"list-2","level":0},{"kind":"p","text":"Переварив всю эту информацию, мы с Мишей решили для нас троих, что цель номер один – пробежать вместе дистанцию и постараться получить удовольствие от гор, бега и общения. Формально вторая по приоритету, но не менее желанная цель – уложиться в лимит."},{"kind":"p","text":"Оля была слегка разочарована своим неучастием в целеполагании. И было уже начала «Не ждите меня, если что. Бросайте и бегите за медалью сами», но эти попытки мы быстро пресекли. И правильно – большую часть дистанции слабым звеном в нашем трио был я. К чёрту гендерные стереотипы. )"},{"kind":"h2","text":"Про сам забег"},{"kind":"h3","text":"Этап 1. «Вработаться»: от старта до ПП1"},{"kind":"p","text":"Пешком от гостиницы до места старта минут 8-10. Старт в пять утра от памятника белой невесте на набережной в самом центре города. Встретился с ребятами в 4:40. Чуть пошатались, несколько «привет-привет» со знакомыми и в кластер. Старт!"},{"kind":"p","text":"Первые 2,5 километра по городу – плоские, беговые и освещённые фонариками. Прогрелись от 6:30 до 5:30 минут на километр – можно было бы и чуть медленнее. Забавно изучали друг друга с ребятами, которые возвращались по домам после насыщенной ночной жизни – кто из нас более упоротый?"},{"kind":"p","text":"Подъём в первую горку начался с пятого километра. Ещё темно, но уже жарковато – рукава снял. До финиша они так и не понадобились, как и ветровка, перчатки и баф. Погода всё-таки стала одним из факторов, определивших ход гонки: почти без осадков – хорошо. Довольно жарко – плохо."},{"kind":"p","text":"В горку пришлось поработать, но сил она забрала немного. Спуск – умеренно техничный. Вниз, нельзя сказать, что прямо бежали, но и страшно не было – чередовали бег и ходьбу."},{"kind":"p","text":"Групповая динамика установилась такая: в подъём на палках я иду чуть быстрее Миши и Оли. На плоских участках и спусках – обратная тема. В целом, уговор держаться вместе никто не отменял ни здесь, ни далее: большее 100-150 метров зазора между нами не образовывалось."},{"kind":"p","text":"Пункт питания не запомнился: быстро долили воды во фляги, наполнили важную третью, полстакана колы внутрь и пошли дальше."},{"kind":"p","text":"Первый сегмент, итого:"},{"kind":"li","text":"Дистанция: 0 – 10,5 километры","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Набор: 644 метра, одна большая горка и спуск","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Время: 1 час 49 минут","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Темп: 10:21 на километр","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Что-как: пробежали плоский кусок по городу, встретили рассвет, вработались и сделали первую горку. Темп чуть выше целевого. Кажется, что всё нормально","listType":"ul","listId":"list-3","level":0},{"kind":"h3","text":"Этап 2. «Сложно, но можно»: от ПП1 до ПП2"},{"kind":"p","text":"Вторая горка далась тоже несложно. Привычно чуть убегал на палках вперёд. Пока пил и ел, подтягивались ребята. На спусках и ровных отрезках, по-прежнему, наоборот: с удовольствием бы шёл пешком, но, чуть пострадывая, держался перебежками за Мишей и Олей."},{"kind":"p","text":"Второй спуск преодолели довольно технично и быстро – красавцы. Таки не первый горный трейл у каждого. Но мне это вышло дорого: только двадцатый километр гонки, а я уже «убил» квадрицепсы: забиты, болят, ограничиваю амплитуду движений. Ух и рано же!"},{"kind":"p","text":"Третья горка – сложнее и круче. А ещё воздух прогрелся до грустных плюс двадцати пяти – для меня перебор. Сложно. К середине подъёма стало понятно, что на весь автономный участок даже трёх фляг воды при комфортном расходе не хватит: начинаем экономить. Горка забирает много сил, но за ней умеренно несложный спуск и довольно беговые относительно плоские участки до следующего ПП – какой же кайф был бы тут бежать, будь ноги свежие и лёгкие. Но таких уже нет. Бежим на том, что осталось. Ребятам проще, мне сложнее. Ну вот так. Твёрдо решаю, что на ПП предложу снизить средний темп и добавить организованные перекуры для еды и питья. Иначе не вывезу. Пульс высокий, сил мало. Что согласился на авантюру – уже не рад. Греет мысль, что с концом этапа закончится уверенно большая часть дистанции: 41 километр из 75, с тремя большими горками из четырёх."},{"kind":"p","text":"На ПП прибегаю очень уставшим, с пустыми флягами. Две порции колы, обильное умывание водой, очень заботливые волонтёры. Ещё и Юлю встретили – дежурно играючи убежала от нас вперёд, но дождалась тут: очень-очень ей не заходят техничные сыпучие спуски и бег по кустам – сил много, но реализовать на такой трассе не может. Хандрит. Решаем, что попробуем какое-то время, возможно, подвигаться вместе."},{"kind":"p","text":"Снова наполняем три фляги – опять остаться без воды не хочется. Следующий перегон короче, но что-то подсказало, что литра воды на такие семнадцать километров нам не хватит. Спасибо этому чему-то."},{"kind":"p","text":"Второй сегмент, итого:Дистанция: 10,5 – 41,8 километрыНабор: 1563 метра, две горки, два спуска и длинный относительно ровный участокВремя: 5 часов 58 минутТемп: 11:24 на километрЧто-как: закрыли больше половины дистанции, средний темп из 12 минут на километр – идём уверенно в лимит. Ноги убил ещё до середины этапа, воды не хватает, пульс высокий. Не успеваю восстанавливаться на прямых и спусках. Жарко и сложно"},{"kind":"h3","text":"Этап 3. «Пыточная»: от ПП2 до ПП3"},{"kind":"p","text":"Приподнятое настроение после пункта питания «большая часть дистанции позади, последняя большая горка и можно чилить» быстро ушло. Всё из-за самой последней большой горки: очень крутой градиент, очень жарко, очень узкая сыпучая тропа среди зарослей и колючек. Сложно!"},{"kind":"p","text":"Средний темп отсекаю сегментами от ПП до ПП. Темп на горке: 34 минуты на километр. Останавливались на вынужденный отдых 3-4 раза за подъём. Переживал за тепловую выносливость, ресурс сердечной мышцы и думал о сходе."},{"kind":"p","text":"Мозгами понимал – вот заберусь, и будет легче, не надо будет сходить. Но тяжело. Юля сначала убежала вперёд, но на середине подъёма снова примкнула к нам – заросли не её тема: обсудили её планы сойти, но промежуточно таки договорились идти на финиш."},{"kind":"p","text":"Конец подъёма – праздник. Передохнув, вернулись к перебежкам по ровным участкам и участкам сброса высоты. Кажется, это второй раз, когда относительно надолго вышли из леса на хребет: горы – это красиво. Юля положительно переоценила свои шансы выбежать из 15 часов и устремилась вперёд – есть возможность хорошо финишировать и успеть на вечерний поезд."},{"kind":"p","text":"Где-то на этом отрезке я сообразил, что долго и упорно ошибался в математике. Темп 12 минут на километр – это финиш из 15 часов. На лимит достаточно бежать чуть быстрее четырёх километров в час. То есть у нас почти нет шансов не уложиться, если дальше всё будет примерно окей. Но сильно сбавлять не хочется – чем быстрее финишируем, тем радостнее. И меньше бежать по темноте. Оба фактора – достойная мотивация."},{"kind":"p","text":"Каждому крутому подъёму – крутой спуск в подарок. Этот был ооооочень длинным. Сброс больше 600 метров. Почти весь по размерам с кулак сыпучим и острым камням. Бежать вниз получалось, но с огромным нежеланием и болью. Пульсировали болью квадрицепсы. Болели пальцы, ударяясь о кроссовки. Больно били по щиколоткам, переворачивающиеся под ногами камни. А иногда и «пробивали» стопы острыми углами."},{"kind":"p","text":"Вначале спуска догнали и обогнали Юлю – медленно и осторожно она шла вниз по тропе. Тогда ещё не знал, что спуск будет таким глубоким и весь целиком «не в её вкусе» – думал, что догонит нас позже. Но нет, на следующем ПП Юля сошла: наверное, основной фактор – демотивация этим бесконечным спуском, по которому бежать страшно, а идти пешком не менее сложно, чем бежать. Ещё, конечно, желание успеть на поезд и, вероятно, отсутствие хорошей компании – испытывал лёгкое чувство вины, что не получилось зацепиться и поддержать."},{"kind":"p","text":"Трёх фляг воды не хватило даже на этот «короткий» сегмент. Хорошо, что нас дозаправили спасатели, которые дежурили на маршруте – невероятно удачное стечение обстоятельств. А самым большим разочарованием этапа стала его вторая горка – самая крупная из «маленьких, которые не в счёт». У неё должно было быть две близких друг к другу вершины, а потом спуск к желанному ПП. Но после второй вершины из двух (!) был сначала ровный участок, потом приличный набор высоты, затем снова ровный участок и… снова горка! В смысле?! Такой прикол мы как-то совсем не оценили. Ну а что делать? Уже стало чуть прохладней, и было ощущение, что справимся – значит не сдаваться и бежать к цели."},{"kind":"p","text":"На спуске, в паре километров до ПП, поддался уговорам и съел первую таблетку Нурофена с целью заглушить боль в ушибленных ногтях, которая мешала преодолевать и без того непростые и болючие спуски. Таблетка сработала хорошо – проще стало и пальцам, и бёдрам, и голове! На этой ноте мы дошли до шоссе, перешли его по надземному переходу и оказались на последнем ПП! Ура!"},{"kind":"p","text":"На пункте питания – Маша: обещала на Экспо, что дождётся и дождалась. Приятно! А ещё невероятно вкусный сладкий чай! Два стакана чая, стакан колы, ещё стакан чая! С пункта питания мы выкатывались наполненные жидкостями как шарики. Впереди заключительный отрезок: формально несложные 17-18 километров, на которые есть от 4 до 6 часов: четыре, чтобы красиво и мало по темноте. Шесть – если просто уложиться в лимит."},{"kind":"p","text":"Хох! В путь!"},{"kind":"p","text":"Третий сегмент, итого:Дистанция: 41,8 – 58,8 километрыНабор: 1000 метров, полторы больших горки со спускамиВремя: 4 часа 3 минутыТемп: 14:21 на километрЧто-как: мысли о сходе на сложном подъёме, падение среднего темпа, болезненные спуски, выравнивание состояния ближе к концу отрезка и мысли «да, мы это сделали, осталось только оформить»"},{"kind":"h3","text":"Этап 4. «Развязка»: от ПП3 до финиша"},{"kind":"p","text":"После четвёртого и последнего ПП до темноты оставался час. Судя по схеме трассы, впереди две горки и после спуска с последней – плоский финиш по окрестностям города и самому Геленджику. Решили как можно больше закрыть до темноты – вгрызлись в гору."},{"kind":"p","text":"Стало заметно прохладней, а горка – одна из двух самых маленьких на трассе. Пришлось поднапрячься, но подъём дался легче любого из предыдущих. Уже темнеет, бежим плоскую крышку горки и спуск. Бежим! Вот серьёзно, прямо бегом! Догоняем и обгоняем ребят, у которых не получается."},{"kind":"p","text":"Небольшой дождь делает камни скользкими – это замедляет нас на последних этапах сброса высоты. Но настроение всё равно приподнятое – «пахнет» скорым финишем."},{"kind":"p","text":"В середине отрезка – самый красивый на мой взгляд участок дистанции: рыже-красный хвойный лес с переменным беговым рельефом! Как же вкусно! Если есть рай для трейлраннера, то он выглядит как бесконечный бег на свежих ногах по такому лесу. Наши не вполне свежи, но то ли финиш манит, то ли эта красота, то ли бодрит остаточное действие Нурофена. А, скорее всего, всё вместе – очень задорные и приятные километры. Удовольствие в чистом виде от картинки, от ощущения упругой силы в ногах и от того, что спустя 13,5 часов после старта мы всё ещё способны бегать!"},{"kind":"p","text":"Чуть позже стемнело совсем. До финиша около 10-12 километров, лес стал гуще. Сначала радостно выхватывали фонарями светоотражающие элементы разметки и бежали на них. Затем они исчезли – видимо, посрывали местные жители. Бежим, часть решений принимая наугад, часть по подсказкам навигатора на Мишиных часах. Средний темп упал, идём пешком – в темноте по лесу, не видя направления, бежать сложно. Несколько десятков эмоционально напряжённых минут и, неожиданно, асфальт!"},{"kind":"p","text":"Дорога ведёт в город и, кажется, нужно всего лишь пробежать 6-7 километров по прямой. Но предфинальные четыре километра дистанции уводят нас на крюк вокруг пустыря. Плоский, но скучный. Терпим, чередуя бег и ходьбу. И вот уже после него оказываемся на набережной – три километра и финиш!"},{"kind":"p","text":"Баланс сил изменился. Оле тяжелее, чем Мише и мне. Равняемся на её темп. Я больше иду пешком, чем ребята, так как не получается бежать с их темпом – только быстрее. Наверное, из-за того, что не могу ставить ноги на пятки – мозоли. А с носка – тянет вперёд. Догоню, отпущу. Догоню снова и снова отпущу."},{"kind":"p","text":"За четыре километра до финиша веду счёт на «успеть уложиться в 15 часов» – если и успеваем, то без запаса. За два километра – если двигаться с тем же темпом, то шансов очень мало. За километр отпрашиваюсь у ребят вперёд под самый финиш – они не против, но отправляют ускоряться сразу же. Говорят, что иначе не успею. Логично."},{"kind":"p","text":"Бегу километр прогрессивно в темпе от шести до четырёх с небольшим. Центр города, людно, подбадривают уже финишировавшие бегуны и прохожие. На скорости сложно искать направления движения: люди, знаки, забор, указатели, бег! Финиш вот-вот, но его не видно: подбадривают активнее, чаще и громче. Вижу арку, болельщики почти стеной, орут и поддерживают. Кричат, что я успеваю! Ускоряюсь ещё сильнее, кажется, что лечу. В толпе вижу Марину и Олю, и слышу их голоса. На часах без скольких-то там секунд 15 часов гонки, спурт и влетаю в арку! Да! Сделал! Сделал! Добежал! Медаль на шею и опускаюсь на ковёр за аркой."},{"kind":"p","text":"Ребята добегают через полторы минуты. Пью воду и прихожу в себя. Через забор меня расспрашивают про гонку, дистанцию и время. А ещё девушка просит об экспресс-интервью в микрофон на камеру, разрешает не вставать, цепляет петличку – вопросы про гонку и эмоции. А мне хорошо! Я думал, что буду орать на финише от ощущения яростной победы, истощения и преодоления, но орать не хочется. Финишировал увереннее, чем ожидал в середине гонки. Очень устал, но как же хорошо."},{"kind":"p","text":"Четвёртый сегмент, итого:Дистанция: 58,8 – 77 километрыНабор: 494 метра, две небольшие горки, много бегаВремя: 3 часа 8 минутТемп: 10:29 на километрЧто-как: суперкрасивый беговой красно-хвойный лес, снова темно, сложности с ориентированием, неинтересный пустырь, яркий финиш на набережной"},{"kind":"h2","text":"Впечатления и мысли по итогам"},{"kind":"p","text":"Самая главное, пожалуй, впечатление – в середине дистанции думал, что мне запредельно плохо и тяжело, а финишировал вполне позитивно."},{"kind":"p","text":"Помню, как было плохо. Помню, как пытался оценить «вменяем ли я или иду под тепловым ударом на автопилоте». Помню, как представлял себе падение и отключку после финишной черты. А в итоге чувствовал запас сил почти весь завершающий сегмент гонки, финишировал бодро и, приняв душ, своим ходом в приятной компании прихрамывая на обе ноги добрался до храма пищи – Макдональдса."},{"kind":"p","text":"Странно, что на ультре есть такой сильный потенциал восстановления. И странно, что для меня это странно – тоже самое уже было со мной как минимум раз: на Комрадсе в 2019-м, а возможно и чаще."},{"kind":"p","text":"Что ещё:"},{"kind":"li","text":"Из 15 часов гонки мы бежали шесть! Очень беговая трасса. Почти не было грязи и рыхлой земляной сыпучки. И помог уже кое-какой накопленный горно-трейловый опыт. Кажется, что за три предыдущие горные ультры у меня было меньше настоящего бега, чем за эту одну.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Мало видов на горы. И славу богу – 90% процентов дневного участка трассы прошли в лесной тени – спасибо! Да, не так много горных пейзажей, зато без тепловых ударов. Самым вкусным визуальным впечатлением оказался хвойный лес – очень, очень красивый.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Хороший результат: 2 часа до лимита, 107 место из 145 финишировавших, первый горный ультра с темпом выше, чем у пешехода в метро – из 12 минут на километр.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Организаторы молодцы, спасибо! Понравилось всё и почти без вопросов. Хотя не могу сказать, что есть какая-то особая разница и доминирование у RHR по сравнению с Wild Family или FinisheRR – всё примерно одинаково. Из недостатков: слишком редкие для гор ПП, снятая разметка на непростом участке и не очень удобная логистика стартов на дистанциях 15 и 50 километров. Всё остальное – прямо хорошо.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Отдельная порция восхищения моим компаньонам: Мише и Оле, которые пережили всё тоже самое с, кажется, куда меньшим ощущением внутренней драмы. И это после того, как всего три недели назад ещё жёстче побегали в Сочинских горах: 80 километров, 6000 набора и яркие впечатления от нападения собак, зависаний над пропастями и редкими удовольствиями от крутых градиентов. Я после такого, если бы поехал в Геленджик, то только попить кофе и забрать стартовый пакет, а не бегать.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Есть вопросы к себе: про сон, тренировки, винишко, отношение к стартам и степень контроля над внутренними диалогами. Но я доволен! И собой, и гонкой и выездом в целом – хорошо, когда в беговом году есть что-то такое. Да и в жизни в целом.","listType":"ul","listId":"list-4","level":0},{"kind":"p","text":"Бывает, что сильные воспоминания быстро улетучиваются, уступая место быту и рутине. Тут будет по-другому. Об этом приключении в ближайшие 3-4 дня мне точно не дадут забыть яркие ощущения в теле: каждая лестница будет напоминать о коротком, но бурном романе с Белой Невестой. Миша, спасибо за подарок!"}]},{"id":"2022-сз-60","title":"СЗ 60","docTitle":"2022 — СЗ 60","sourceUrl":"https://ddv-comrades.blogspot.com/2022/12/60.html","categories":["Ультра"],"date":"2022","place":"Москва","distance":"60 км","result":"6:43:00","elevation":"","format":"День рождения; групповой пробег","summary":"Шестидесятикилометровый праздничный пробег по Москве с друзьями.","paragraphs":[{"kind":"h2","text":"Что за пробежка"},{"kind":"p","text":"Автор идеи – Сергей Зухер. Он на полгода раньше меня за один раз пробежал полный круг ЗКМ – так и познакомились заочно. Очно, чуть позже, на эстафете по тому же маршруту. Там я узнал, что Сергей организует старты Близко-Трейл и вообще хороший дядька. Единственная у нас с ним нестыковка мнений: я уверен, что эстафету ЗКМ надо делать в конце мая, а Сергей – за ноябрь. Ну ок, каждый имеет право на ошибку. :-)"},{"kind":"p","text":"Сергею вот-вот исполнится 60 лет. В честь грядущего юбилея он решил пробежать 60 километров по Москве через памятные для себя места. Ожидаемый средний темп бега – 6 минут на километр. Написал в пространство, что будет рад компании. Я вызвался, люблю авантюры!"},{"kind":"p","text":"Маршрут в основном асфальтовый, по улицам города. От метро Новокосино через Радугу, Кусково и Измайловский парк в сторону Бауманской, оттуда через Покровку до набережной Москвы Реки, после подъём к Косыгина у пешеходного моста и бегом к точке старта через Тульскую и вдоль Рязанского проспекта. Я даже не изучал особо трассу – залил трек в часы и рад, что можно просто бежать хвостом, не думаю о навигации."},{"kind":"h2","text":"Раскладка до старта"},{"kind":"p","text":"Пробежать 60 километров мне казалось, в целом, окей. Должен смочь. Переживал за темп: 6:00 высоковато для зимы и такой дистанции – я так кроссы по 13 километров бегал весь ноябрь и не могу сказать, что было совсем уж легко."},{"kind":"p","text":"Ещё напрягала погода: холодно же, около минус десяти. Замёрзнуть могут вода в нагрудных флягах, гели в жилете и пальцы в перчатках. Всё это довольно неприятно, когда бежишь ультру. Но у меня были планы на каждый из этих «‎ могут » . Какие-то даже сработали."},{"kind":"p","text":"А ещё минус десять – пограничная погода на такой дистанции. Два слоя одежды или три? Зимние кроссовки с мембраной или летние? Брать ли с собой мембранную куртку «на всякий случай»?"},{"kind":"h2","text":"Впечатления от пробежки"},{"kind":"li","text":"На старт в Новокосино «на всю дистанцию‎» приехало пять атлетов. И побежали. Почувствовал себя частью элитной беговой группировки: из пяти человек, как я понял, четверо имеют в анамнезе 100 миль ЗКМ, сделанных за один раз. Ого компания!","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Со слоями угадал – 2,5 слоя верха было идеально: не холодно, не жарко. С кроссовками – скорее промахнулся: не думаю, что замёрз бы в летних, а в зимних ужасно скользил на ледяных участках. Хорошо хоть их не так много было. Идея со стельками-грелками для фляг и гелей провалилась – ноль эффекта. Но об этом абзацем ниже.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Гели! Уже первый густой (Gu) гель через час бега было непросто переправить из упаковки в рот, а второй ещё через час – прямо проблема. Ничего, перешёл на жиденькие (Nutrend) – лучше, но тоже сложно. Я придумал решение! За десять минут до еды перекладывал гель из жилета внутрь перчатки – он согревался и окей! До 45 километра вполне мог питаться. Почему не мог позже? Ниже!","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Вода! Первые глотки на пятом километре – окей. С 10-го по 20-й уже приходилось зубами растрескивать лёд и губами согревать соску. После двадцать пятого – всё, приём больше не работал, промёрзло сильнее. Не беда – и тут есть способ: достать флягу из жилета, открутить крышку и пить из горла. Временно работало, но на 45-м километре я не смог раскрутить флягу, замёрзла намертво. Ни воды тебе, а значит и ни гелей. Последние 18 километров ультры пришлось бежать без питания. И, что обидно, «‎лишнюю» теперь воду не вылить – просто бегу с небольшой бесполезной гантелькой.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"С промерзанием пальцев на руках значимых проблем не было, супер-мощные варежки доставать из жилета не пришлось. Когда замерзали руки, собирал пальцы в кулак и грел внутри перчатки. Когда согревались, обратно распределял каждого из десятерых в индивидуальные апартаменты.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Бежалось уверенно, хотя и не сказать, что легко. Средний темп бега – около 06:08 на километр. Средний темп вообще – около 6:25. К последнему километру уже сильно устал и ждал «когда уже всё‎». До финиша добежали только вдвоём: скорый именинник и я. Остальная часть гвардии рассыпалась по дороге между 40-м и 54-м километрами. У Феди заболел недолеченный голеностоп, Лёша и второй Серёжа, как я понял, устали.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Супер-интересно было после финиша из-за, видимо, гликогенового истощения в мышцах – сказалось отсутствие питания на последней четверти с небольшим. В машине: умеренной силы дрожь, похожая на озноб, и сильная сонливость. Когда оказался дома: настоящий колотун, когда стучат зубы, трясутся руки и не получается стоять не дёргаясь. Уже бывало такое, знакомо. Закинул внутрь макароны, сыр и чашку горячая чая с молоком – полегчало. Остаток расколбаса снял получасовым отмоканием в горячем душе.","listType":"ul","listId":"list-1","level":0},{"kind":"p","text":"Букв поменьше обычного, но и пробежка не приключение мечты. Хотел написать про замёрзшие фляги и классную ознобовую дрожь. Но получился опять целый текст."},{"kind":"p","text":"Сёреже спасибо за приглашение и компанию. Хорошо получилось. С наступающим!"}]},{"id":"2021-снежный-трейл-марафон-в-никола-ленивце","title":"Снежный трейл-марафон в Никола-Ленивце","docTitle":"2021 — Снежный трейл-марафон в Никола-Ленивце","sourceUrl":"https://ddv-comrades.blogspot.com/2021/03/blog-post_2.html","categories":["Марафоны","Трейлы"],"date":"2021","place":"Никола-Ленивец","distance":"42 км","result":"6:30:15","elevation":"","format":"Два круга по 21 км; зимний трейл","summary":"Снежный марафон по двум трейловым кругам в Никола-Ленивце.","paragraphs":[{"kind":"p","text":"Полное название забега: Nikola-Lenivets Winter Wild Trail 2021, дистанция “Снежное безумие” – 42 километра. Красиво, но слишком пафосно для лампового уютного заголовка в блоге про бег, который никто не читает, любителя, который почти не бегает :-)"},{"kind":"h2","text":"Почему снежный трейл?"},{"kind":"p","text":"Мой план подготовки к апрельским горным ультра сейчас примерно такой: два кросса по 15-18 километров в будни. В воскресенье прогрессирующая длинная: январь – 20-25 километров, февраль 25-30, март 30-35. Есть вероятность, что так получится привести себя в состояние за одну неделю пробежать пару длинных забегов без целей по времени и месту в протоколах."},{"kind":"p","text":"Бежать 104 километра между Геленджиком и Новороссийском буду с товарищем. С ним же обсудили идею: пробежать тренировочную длинную – постоять на ногах 5+ часов в условиях, похожих на будущий забег. Похожих хотя бы тем, что не асфальт. Так появилась идея про зимний марафон в Никола-Ленивце."},{"kind":"p","text":"Снег, рельеф, сложная поверхность – хорошо для тренировки. Пункты питания, компания, медальки – удобнее, чем что-то похожее делать одному в парке или по шоссе. Вот и договорились."},{"kind":"h2","text":"Предстартовая драма."},{"kind":"p","text":"За пару недель до забега в Калужской области выпало 80 сантиметров снега. А за несколько дней до старта температура воздуха на несколько суток перебросилась наверх через ноль. В чатике участников началась лёгкая предстартовая истерия: всё затопило, берите сапоги, машины застрянут на парковке, нужны мембранные носки и так далее."},{"kind":"p","text":"Вовлёкся в это общее настроение – представил, как промочу ноги до пояса, отморожу пальцы, как это всё будет сложно, небезопасно и героически безумно. Ух! Мыслей не ехать не было, но вариант сойти после половины дистанции рассматривал как реалистичный. Вспоминал знаменитый Mad Fox, где сошло ¾ участников… А мне же тут тренировка, а не страдать. Было ли из-за чего переживать? Нет :-)."},{"kind":"h2","text":"Про сам забег."},{"kind":"li","text":"Сапоги в стартовом городке не пригодились: не было никакой воды по колено. Местами грязь, местами лужи – ну и ок. Сама трасса тоже, в целом, сухая: одна большая неизбежная лужа, через которую на дистанции 42 километра нужно было пробежать дважды. Ещё 7-8 луж поменьше, куда было сложно не макнуться. Ну и всё. При температуре около нуля градусов мокрые кроссовки, как выяснилось, не приводят к обморожению пальцев или другим заслуживающим внимания неприятностям.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Напрасно городил сэндвич: носок, пакет, носок. Он не работает: пакет быстро порвался, верхние носки изящно съехали на стопу – просто потеря времени. Мембранные носки товарища тоже больше мешали чем помогали – и воду пропускали, и ноги натирали. Правильное решение для, видимо, любых мокрых забегов: трейловые кроссовки без мембраны и обычные синтетические беговые носки.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Трасса: два круга восьмёркой по 21 километр. Первыми стартовали ребята на 42 и 11. Через тридцать минут – половинка. Забег получился формата “одной тропы”. Т.е. на 90% дистанции ширина трассы позволяла комфортно бежать участникам только за спинами друг друга. Шаг влево/вправо – либо сугроб по колено выше уровня тропы, либо проваливаешься на туже глубину вниз. На зимних такое, вроде бы, классика. И на летних бывает. Не моё, не понравилось: и бежать неудобно, и обгонять тяжко, и когда тебя догоняют более быстрые – тоже не здорово. Да и поболтать на бегу тяжелее, но это не главное, конечно.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Начало гонки удивило: было ОЧЕНЬ жарко, пот ручьём. Третий слой одежды с внутренней аргументацией “бежим же медленно – будет прохладно, а если что, снимем на 21 километре” оказался решительно лишним. Выяснилось, что “медленно” не равно “с низкой интенсивностью”. Через пять километров сошли с тропы разутеплиться. Сразу после остановки накрыло – яркие специфические ощущения в голове, слабость. Гадал, упаду ли сейчас в обморок или нет. Постояли пять минут, закусил солью, выпил воды – полегчало. Больше таких приходов не было.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"После возвращения в строй, бежалось глаже. Первый поезд, видимо, был быстроват для нас. В новом ехалось легче, но начались обгоны – не самое удобная штука по такой трассе. Хотя один из них в стиле “я шерстяной волчара”, доставил удовольствие и вошёл в ТОП ярких впечатлений от забега: группой из 5-6 человек по сугробам с высоким подниманием бедра на ускорении за раз обогнали человек 20-25, пульс в потолок, радость и адреналин – мощный получился перфоманс.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"На первом пункте питания, 11 километр, провели минут десять: исправляли ошибки с носками и прочим. А после него нас раз в 5-10 минут догоняли быстрые атлеты, бегущие половинку: доброжелательно пропускали их, отступая с тропы в сугробы. Неприятный участок: мешать не хотели, оглядывались, останавливались… Не торт.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Это странно, но дистанция давалась мне легче, чем товарищу. На плоском марафоне Миша меня уверенно обгонит минут на 10-15. А тут, на удивление, наш тандем регулировал темп по его самочувствию, а не моему. Впрочем, это не важно: целью была длинная совместная тренировка: поработать долго, потусоваться вместе. Результат нас не волновал, цель достигли.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Лучшее время дня на марафоне: 4 часа 14 минут. Десятый марафонец финишировал за 5 часов. Наше время 6 часов 30 минут – успели за пару минут до темноты. Минут сорок в общей сложности провели на пунктах питания и той первой технической остановке. В горки ходили пешком, ещё иногда переходили на шаг, если у нас поднимался пульс – опять, как в старые добрые, мерили один пульс на двоих, умеренно серьёзно полагая его общим.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"На трассе были аттракционы: “Панда-парк” – участок со спуском в овраг по верёвке, виляющей между деревьев утопленной в снег тропой и крутым верёвочным подъёмом. “ПолиШортс” – крутая горка по широкой дороге метров 300-400 длинной за километр до финиша. “Бассейн чайка” – лужа после пункта питания на 11/32 километре, которая неизбежно тонизировала ноги резким охлаждением.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Второй круг понравился больше первого: уже не было драмы – всё понятно, всё путём. И на всей дистанции осталась всего сотня бегунов, растянутая и не перемежающаяся стартовавшими на 11 и 21. Стало свободно, спокойно, получилось насладиться видами и ощущениями от слаженно работающего тела. Да и сама трасса стала покомфортнее – утоптали. Хотя, конечно, смешные случайные ныряния в сугробы при потере равновесия тоже случались.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Отдельно отмечу социальный аспект: адски весело заточили пасту в Калуге с IzMyLong-товарищами накануне старта, приятно было встречать знакомых ребят-бегунов на дистанции, беговое приключение с проверенным в ЮАР и Италии товарищем по хобби – чего можно ещё пожелать на последние зимние выходные сезона? Я бы пожелал себе похожих ощущений от будней, но это уже совсем другая история – не пробег.","listType":"ol","listId":"list-1","level":0},{"kind":"p","text":"“Краткость – с.т.” – люблю этот афоризм, но он не про меня. Как ни стараюсь, меньше двух-трёх листов текста про стоящее чего-то для меня события написать не получается. Может быть хватит уже стараться? – если читаешь, дай обратную связь."}]},{"id":"2021-dwt-52-и-маркотх-104","title":"DWT-52 и Маркотх-104","docTitle":"2021 — DWT-52 и Маркотх-104","sourceUrl":"https://ddv-comrades.blogspot.com/2021/04/dwt-52-104.html","categories":["Ультра","Трейлы","Приключения"],"date":"2021","place":"Дагестан + Новороссийск","distance":"52 + 104 км","result":"10:37:38 / 23:19:29","elevation":"≈5600 м на Маркотх и ≈3100 на Дагестан","format":"Две горные ультры в одной заметке","summary":"Две горные ультры с интервалом в шесть дней: Дагестан 50 км и 104 км на Маркотхе.","paragraphs":[{"kind":"p","text":"Двойную горную ультра, пожалуйста. Да-да, на одной неделе, всё верно. Нет, не очень готов. Да, уверен, подтверждаю."},{"kind":"h2","text":"Контекст"},{"kind":"p","text":"В конце 2019 года я был в хорошей физической форме, активно тренировался и планировал пробежать свои первые в жизни 100+ километров – горный ультрамарафон Маркотх, 104 километра. А за три недели до него поставил промежуточный старт, тоже горный и длинный – 52 километра в Дагестане."},{"kind":"p","text":"План казался очень разумным, но случился коронавирус. Оба старта после чехарды промежуточных решений перенесли на апрель 2021 года, и, в этот раз, на соседние выходные. Теперь бежать оба перестало выглядеть здравым решением, особенно учитывая такой пикантный момент: с октября 2020 года я перестал тренироваться – бегал, но без СФП, без темповых и скоростных работ и, конечно, без горок и лесенок в подъезде."},{"kind":"p","text":"А пробежать старты всё равно решил. Оба. Шесть дней между горными ультра. Получилась модная в любительской среде тактика «Слабоумие и отвага» с поправкой на
