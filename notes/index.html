рашиваю у Ромы, одна ли она такая крутая гора на дистанции. Говорит, что ещё штуки четыре будут точно. Ох."},{"kind":"h2","text":"22-23 км. Вниз."},{"kind":"p","text":"Бежать с горы проще, чем в гору? Не в этот раз. Не в этот день. Упираюсь как могу палками перед собой и пытаюсь идти боком, но ноги всё равно то и дело норовят сорваться, сцепления нет. Сначала спускаемся между деревьев и кустов, которые цепляют палки и мешают выбрасывать их перед собой. Опасно и скользко. У Ромы техника отличается – свободными руками придерживается за деревья. Движемся еле-еле и, кажется, даже медленнее, чем в подъём. В гору – тяжело. С горы – сложно и страшно."},{"kind":"p","text":"Лесок заканчивается и спуск продолжается по крутому травянисто-земляному склону. Стало чуть удобней, но не проще. В самом низу видим второй пункт питания. Темп упал. Теперь уже речь точно не про 16-17 часов. Если будут такие подъёмы и спуски, то на финише буду никак не раньше полуночи. Впрочем, это тоже ок."},{"kind":"p","text":"23 – 30 км. Вторая отсечка. На пункте питания догоняем неизвестного (сильно позже узнаю, что его зовут Игорь) и Серёжу (позже Игорь подскажет, что это Илья). Пью колу, заливаю воду во фляги. До следующего пункта питания 19 километров – самый длинный автономный участок на дистанции. Я пока ещё психологически не перестроился и считаю, что это немного – типа на пару часов вопрос. Но это, разумеется, не так."},{"kind":"p","text":"Узнаём у волонтёров, что всего стартовало 88 человек. Шутим: \"Ура! Мы точно будем в первой сотне, если финишируем\". Один уже сошёл. Мы, примерно, 82-83. Один из отстающих – знакомый нам Слава. Снова отмечаю, что непривычно быть настолько замыкающим, но понимаю – всё нормально, это не моя лига. На такой дистанции не бывает случайных любителей... ну, кроме меня. Неизвестный мне ещё Игорь и пока ещё Серёжа, который Илья, уходят с пункта питания в крутую гору на несколько минут раньше нас. Мы с Ромой их быстро догоняем и обгоняем. Ребятам горки даются тяжелее. Вижу, что Серёжа-Илья присаживается на склоне отдохнуть. Он тоже шёл без палок. На следующем пункте питания узнаю, что он сошёл."},{"kind":"p","text":"С Ромой уходим от Игоря вперёд. Я иногда отрываюсь от него на 200-1500 метров, потом Рома меня догоняет, и мы какое-то время снова идём вместе. Потом я опять отрываюсь. Такой паттерн у нас продержится до 41 километра. Но это ещё не скоро."},{"kind":"h2","text":"30 км. Принцип."},{"kind":"p","text":"Иду один, Рома прилично сзади. Забираюсь в подъём, вижу впереди ребят, которые мою траекторию пересекают под острым углом.. и разметка тоже. Чёрт! Отклонился от маршрута и, получается, срезал. Торгуюсь с собой – никто же не узнает… Разворачиваюсь. Спускаюсь вниз, теряю время и силы, ищу петлю, которую случайно пропустил. Обидно, но так правильно. Сделал кармический взнос. Засчитали?"},{"kind":"p","text":"30-32 км. Спуск-испытание. Рома где-то недалеко позади. Выхожу на спуск, крутой. Впечатляет, но не пугает – зря. Через несколько минут я пойму: это не спуск, это – БЕСКОНЕЧНЫЙ СКОЛЬЗКИЙ ОПАСНЫЙ крутой склон, ведущий в ад!"},{"kind":"p","text":"Мешают сильный уклон, ненадёжная поверхность, кусты и ветки. Каждый шаг – борьба за не упасть. Упираюсь, как могу. Ноги скользят, твёрдой опоры нет, чертыхаюсь. Сверху доносятся маты – меня догоняют Рома и Игорь, им тоже спуск не по душе. Падаю на задницу, больно ударяюсь локтём."},{"kind":"p","text":"Через несколько минут со мной ровняются ребята. Игорь идёт вниз очень шустро, но падает чаще. До того, как догнал – трижды. Обогнав, падает ещё раз – снимаю его валяния на камеру – минутка общего веселья. Игорю спуск даётся легче, чем мне и Роме – уходит вперёд и мы на долго теряем его из виду. Карабканье вниз длится вечность, и для меня это самые сложные и напряжённые километры за всю дистанцию. Зато внизу – новый мир и новый этап – горное ущелье с поваленными деревьями, камнями, ручьями и, позже, грязью."},{"kind":"h2","text":"32 – 41 км. Ущелье."},{"kind":"p","text":"С предыдущего пункта питания прошло, кажется, полдня. А до следующего ещё идти и идти. В ущелье особо не разбежишься, идём. Перепрыгиваем по камням через ручьи, перешагиваем через деревья и продвигаемся вперёд. За общий тайминг становится ещё переживательнее, чем раньше."},{"kind":"p","text":"Встречаю первый ручей, который по камням с сухими ногами не перейти – крещение бродом! Вода холодная и это приятно – освежает, бодрит. Через 10-12 шагов после ручья ноги почти полностью отжимают носки и кроссовки. Не так страшен чёрт, как я о нём думал до старта."},{"kind":"p","text":"Бродов много. После пятого, прохлада перестаёт радовать. Затем испытания водой сменяется испытаниями грязью – то ещё удовольствие. Где можно, карабкаемся вокруг грязевых бассейнов по краю дороги. Где нельзя – идём прямо по ней, собирая на ногах вязкие комья. Вспоминаю дождь, который время от времени включался в течение дня – ему спасибо за грязевое обилие здесь и далее."},{"kind":"p","text":"У Ромы заканчивается вода – делюсь. Пункта питания на сорок первом километре всё нет и нет, и выйдем мы к нему оба практически совсем пустые."},{"kind":"h2","text":"41-64 км. Вторая половина."},{"kind":"p","text":"Пит-стоп на сорок первом километре поделил забег на две половины. До: неуверенное знакомство с дистанцией, Рома, видовые горы, первый напряг в подъём, два сложнейших спуска, ущелье с бродами, более-менее комфортный тайминг и вот она какая грязь. После: второе дыхание, уверенность в собственных силах, Игорь, механическое преодоление горок и спусков, лес, ночная часть дистанции, вой шакалов, туман, дождь, борьба за лимит и уверенное перемещение уже по любым типам поверхностей. Но по порядку."},{"kind":"p","text":"Сам пункт питания: Смекта, кола, изотоник и отсутствие возможности набрать запас воды во фляги – закончилась. Решение преодолеть следующие 13 километров на том, что есть, и самое длинное за всё время гонки расставание с Ромой – решил зарядить, так зарядить – оставил Рому на пункте питания с товарищем, которого мы там нагнали."},{"kind":"p","text":"Ощущение лёгкости, свежести и второго дыхания. С азартом и энтузиазмом прибавил в темпе, догнал атлета-интроверта (ни разу не обернулся на меня, когда я полчаса преследовал его на расстоянии от пятидесяти метров до двух). Догнал Игоря – он чинил рюкзак в деревне, после не случившегося но близкого боя с собаками, который я едва не застал. Теперь мы наконец-то познакомились – Игорю 28 лет, разведён, двое детей, живёт под Краснодаром, бежит второй трейл в жизни, а первый был тоже недавно – около пятидесяти километров в Анапе. Словоохотливый, добрый, приятный, весёлый."},{"kind":"p","text":"Двигаемся дальше вместе, заболтались, пропустили поворот. По треку на часах Игоря вернулись на трассу напрямик через бурелом – эти 5-7 минут мне почему-то было беспокойно. Горки, спуски, горки. Возвращаемся с дальней петли на марафонскую часть трассы. В нашем тандеме я сильнее и свежее, на горках жду Игоря и равняюсь на его темп. Пока норм и явно веселее, чем топтаться по маршруту одному. А ещё у Игоря часы ведут трек: это и регулярная сводка по набору высоты и гарантия того, что сильно не разминёмся с правильным направлением движения. Один раз, когда нас запутали ребята на джипе, это было очень кстати."},{"kind":"p","text":"Смотрю заряд своих часов – 41%. Батарейка садится быстрее, чем я прохожу километры – не доживут до финиша. Шнурок к внешнему аккумулятору есть только для телефона, для часов буду безрезультатно спрашивать кабель на каждом следующем пункте питания."},{"kind":"p","text":"Первый из них – 54 километр. Быстрая заправка. Узнаём, что сошедших за нами стало ещё больше. Тороплю Игоря, он наспех набивает рот сухофруктами, и мы спешно двигаем к пункту питания на 64 километре – надо успеть до темноты, иначе снимут. Волонтёры говорят, что мы точно уложимся в отведённый на гонку лимит. Похоже на то, но уверенности нет – всё зависит от сложности оставшейся части трассы, а неё длинны."},{"kind":"p","text":"«Марафонская петля» (общая часть дистанции для стартовавших и 42, и 86 километров) поначалу нам казалась приятней и проще, чем участок трассы до неё. Думаем: «Ну и курорт же был у парней на классической дистанции». Долго эти мысли в голове не крутились: спуски скользкие, в низинах – грязь, в горки не разгонишься – всё по-взрослому, всё как у людей."},{"kind":"p","text":"В районе шестьдесят первого километра нас очень уверенно догоняет и обгоняет Рома. Играючи легко бегом взбирается в подъём, перекидывается с нами парой слов и скрывается из вида. Начинается длинный спуск, где-то в его конце должен быть заветный пункт питания «64». Спуск начинаем бегом, заканчиваем в осторожных попытках не навернуться на скользких камнях и сгустках грязи – спасибо пасмурной погоде и дождю ещё раз."},{"kind":"h2","text":"64-72 км. Главный пит-стоп."},{"kind":"p","text":"Остановка на 64-м – важная большая пауза перед заключительным отрезком. Тем, который будет после заката и всё решит."},{"kind":"p","text":"Заправляемся питьём. Снимаю и вытряхиваю кроссовки, оттираю ноги, клею пластырь, меняю носки. Ребята-волонтёры говорят, что успеем, если продолжим в таком же темпе, но темп у нас упадёт из-за темноты. Эээ.. не очень обнадёживает. В пункт пришли в 18:56. Уходим в 19:15. У нас примерно 5,5 часов на 22 километра: 13 до следующего пункта питания и 9 самых-самых после него."},{"kind":"p","text":"Узнаём у волонтёров, что за нами всего один или два человека, а предыдущая партия убежала минут двадцать назад – может быть, сможем кого-то нагнать. Пока готовимся двигаться дальше сильно замерзаю."},{"kind":"p","text":"Следующий подъём начинается сразу после лагеря – горка быстро согревает. Забираемся на хребет, резко темнеет, туман. Становится понятно, что средние 5 километров в час нам не удержать. Есть реальный риски не успеть. НЕ УСПЕТЬ! Блиин, ну как так-то. В голове появляются разные мысли вида «В целом, и 77 километров – тоже хорошая тренировка. Ну не уложусь, ну бывает». Но, боже, как же сильно хочется медаль и в протокол."},{"kind":"p","text":"ТУМАН усиливается. Видимость с фонарём – не более трёх метров. Не видно разметки. Не видно вообще ничего кроме места, куда ставишь ногу. Точно ли не закроют трассу из-за погодных условий? – было бы «хоп и закончилась гонка». А дали бы тогда медаль или нет? Игорь всё ещё отстаёт от меня в подъёмах и уже не поспевает на спусках. Не бросаю, жду. Есть чувство товарищества, солидарности, ценности и что-то про командый дух – хочется идти плечом к плечу, вместе терпеть и вместе успеть. Но это чувство соседствует с другим – усталым эгоизмом – Игорь меня задерживает, хочу быстрее, хочу активнее, хочу успеть. Внутреннего торга как такого нет – по умолчанию есть решение: до последнего пункта питания идём вместе. Подгоняю, но не выматываю."},{"kind":"p","text":"Телефон почти нигде не ловит. Сообщение от Ани (тренера): «Будь аккуратнее на последней горке. Там пипец» – беру во внимание, но стараюсь не думать о чём это."},{"kind":"h2","text":"72-77 км. Предпоследняя гора."},{"kind":"p","text":"Грязь, кусты, повороты. Еле-еле. Усталость. А ещё казалось, что гора уже давно и мы прошли половину, «А нет» – говорят часы – «только начинается». Километры тянутся очень медленно. Зарядил дождь – подъёмы точно не станут проще, а спуски безопасней.. и темп не вырастет."},{"kind":"p","text":"Часы разрядились, сохранили пройденную часть трека и погасли. Питаюсь теперь по таймеру на телефоне – каждый час вместо каждых шести километров. Чуть чаще, чем в начале. Прилично чаще."},{"kind":"p","text":"Игоря приходится ждать, он отстаёт. Ему непросто – одному неуютно и досадно, просить подождать – тоже неловко. Иду впереди, тяну за собой. Далеко не убегаю. На мой манер он начинает время от времени писать видео про происходящее вокруг и иногда говорить по телефону. Чуть раздражаюсь – тормозит же. Но понимаю, у Игоря тоже приключение и тоже особенный день. Эти задержки стоят нам единицы минут, а ценность их больше – раз, и, два, паузы силы ему возвращают."},{"kind":"p","text":"Ближе к концу подъёма у Игоря судорогой свело ногу. Советую выпить соли, он пьёт и сам догадывается ещё про магнезию. Длинная пауза, но боец снова в строю. Идём дальше."},{"kind":"p","text":"Чуть отрываюсь вперёд – метров пятьдесят. За нами раздаются истошные звериные вопли. Не по себе. Жду Игоря, даже иду назад, ему на встречу – резко неуютно стало идти друг от друга на удалении. Игорь говорит – шакалы. Брр. Становится страшно за идущего за нами последнего не сошедшего с трассы атлета."},{"kind":"p","text":"Когда не гора – силы есть. Когда гора – тяжело. Добротный спуск к пункту питания на 77-м километре. Скоро развязка."},{"kind":"h2","text":"77-86 км. Финал."},{"kind":"p","text":"Последний пункт питания. Нас радостно и весело встречают. Пью колу. Впереди всего девять километров, но заливаю оба бака воды – всё ещё непривычно, что можно за такую короткую дистанцию в такую прохладную погоду столько уработать, но это так. Нам говорят, что мы выглядим свежее предыдущих ребят и должны успеть. У нас есть 2,5 часа на девять километров."},{"kind":"p","text":"Хотел выкинуть накопившиеся упаковки от съеденных гелей, но не нашёл в заднем кармане пакет с мусором. Обидно. Раскаялся в содеянном волонтёрам – на финише обещали не штрафовать."},{"kind":"p","text":"Волонтёры рассказывают о том, что нас ждёт впереди: четыре километра спуска, а потом гора – набор 500 метров за два километра! Это невозможно! После невозможно – ещё несколько километров спуска к лагерю."},{"kind":"p","text":"Четыре километра до горы идём быстрым шагом по петляющей автомобильной дороге с твёрдым (!) покрытием – успели отвыкнуть от такой роскоши. Палки металлическими наконечниками неприятно звенят об бетон, копим моральные силы на немыслимый подвиг. И вот ГОРА. Штурмуем!"},{"kind":"p","text":"Первую треть условно вместе – убежал чуть вперёд, но подождал. Передышка, разгрызли бодрящие мега-витаминки, что покупал к Комрадсу год назад. Пара фоток на фоне ночного города, выдохнули, двигаем дальше. Ушёл вперёд, сказал, что ждать не буду – сорри, тут уже не потеряться и развязка вот-вот."},{"kind":"p","text":"Плато со спуском после горы – бегу. Снова подъём – неожиданно, а где финиш-то?! Он оказался дальше, чем я рассчитывал и ощущал. Снова плато, с вершины горы видно лагерь, оттуда приветственно сигналят – подбадривают и ждут. Теряюсь, куда бежать? – не видно разметки! Спуск идёт параллельно лагерю, а не к нему. Спуск непростой – сначала еле-еле боком и с упором на палки. Потом бегом и вприпрыжку по сыпучим камням вниз."},{"kind":"p","text":"Тропа наконец-то делает зигзаг и теперь уже ведёт в сторону лагеря. Бегу! Было уже проскочил поворот на мост (я не знал, что надо на мост!) – волонтёр помогает сориентироваться и направляет в нужную сторону. Последние сотни метров: убираю палки, снимаю фонарь. Финиш близко, выдыхаю и бегу последние сто метров как сумасшедший – традиция, есть традиция. Арка, приветствие, крики и аплодисменты. Я сделал это! 19:41! Успел! Уложился! Есть медаль! Есть строчка в протоколе!"},{"kind":"p","text":"Классные фото с медалью на финише – это волонтёры. Вижу девушку и детей Игоря, ждут. Холодно, обнаружил, что потерял по дороге ветровку. Пью рекавери. Ждём Игоря. Он появляется из-за поворота – болеем, орём – Игорь вбегает в арку за шесть минут до закрытия финиша. Да! Это победа. Обнимаю его и делаем несколько фото вместе. Как же я рад, что и он успел."},{"kind":"h2","text":"Что ещё:"},{"kind":"li","text":"Я смог. В это сложно было поверить в январе, когда я оформлял регистрацию на забег. В это в принципе сложно поверить, но я это сделал – за почти двадцать часов преодолел горный трейловый ультрамарафон с огромным перепадом высот и кучей других увлекательных препятствий.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Ощутил совершенно другой непривычный уровень понимания слова \"нормально\" с точки зрения безопасности и комфорта. Дико другой: скользкие камни, крутые спуски по грязи, неустойчивая поверхность вблизи отвесных обрывов, пять часов в темноте, почти полное отсутствие связи на большей части дистанции... И всё без смертей и увечий. Это было \"нормально\" и для участников, и для организаторов. Просто другая шкала измерения. Что это? Надлежащим образом подготовленные люди? Или естественная норма для человека вне современных рафинированно-сглаженных условий городской жизни? Как-то странно после такого вспоминать, что мне вообще-то ночью неуютно бегать по асфальтовым дорожкам Измайловского парка.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Трейл – это ещё и ориентирование по разметке. У меня недостаточно опыта для сравнения с чем-либо, но субъективно кажется, что организаторы в этом были огромные молодцы – часто, много, заметно (туман не в счёт). И тем не менее, почти десяток раз я мимо разметки промахивался. Один раз срезал и вернулся назад, один раз прорвался к правильному маршруту через бурелом и, не считал сколько раз, Игорь по часам или Рома на опыте окриками поворачивали зазевавшегося меня в нужную сторону. Не надо отвлекаться.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"С трудом избавляюсь от внутренней как будто потребности оправдаться за среднюю скорость прохождения дистанции – около 4,5 километров в час. Математически и со стороны – это очень медленно для «спорта». Но глупость же. Нельзя сравнивать Маркотх с коротким и гладким. Во-первых, время грязное – со всеми этими остановками и т.п. Во-вторых, это ультра – пешеходы не гуляют по двадцать часов к ряду. Ну и основное, третье-четвёртое – перепады высоты и тип поверхности под ногами. За приличное для любителя время я бегал с десяток асфальтовых марафонов, поверьте мне на слово: темп 5-6 минут на километр – это не про горный ультратрейл. Или проверьте сами в Новороссийске через год ).","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Виды! Горные склоны и хребты, извилистые каменистые дороги и тропы, ручьи, лесные дорожки, море, ночной город с высоты птичьего полёта. Как же хороши эти картинки. Не в обиду Комрадсу, но его пейзажи маркотхским не конкуренты. Вот бы я мог в любой момент закрыть глаза и снова увидеть то, что видел в этот длинный и насыщенный день.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Мой второй в жизни протокольный ультрабег и второй раз очень повезло с погодой. Пасмурно большую часть дня, мало солнца и не жарко. Дождь, конечно, внёс свои коррективы (это про обилие грязи, скользкой травы и скользких камней), но жара бы меня томила точно больше.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Организаторы – зайки. Образцово профессионально и чётко – как будто бы чемпионат мира или типа того. Очень уютно, душевно, по-доброму и свойски – как будто бы домашний местечковый старт для своих. Девушки-волонтёры приветливы, веселы и доброжелательны. Парни на пунктах питания – образцы спокойствия и заразительной размеренной уверенности. Артём – ведущий брифинга – один из лучших спикеров, которых я слышал за последнее время. Я не знаю, что могло бы быть в организации забега лучше.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Про социализацию на забеге – про Рому и Игоря. Ребята стали для меня частью маркотхского приключения и даже, в какой-то степени, родными – неделю назад ещё не были знакомы, а сегодня и чаем бы дома напоил, и переночевать бы пустил. Помню свою давнишнюю мысль про то, что, наверное, не умею уверенно наслаждаться сочными моментами жизни в одиночестве. Благодаря парням, в этот раз мне этого делать и не пришлось. Спасибо.","listType":"ol","listId":"list-1","level":0}]},{"id":"2019-comrades-2019-up-run","title":"Comrades 2019. Up Run","docTitle":"2019 — Comrades 2019. Up Run","sourceUrl":"https://ddv-comrades.blogspot.com/2019/06/comrades-2019-up-run.html","categories":["Ультра","Приключения"],"date":"2019","place":"ЮАР","distance":"≈87 км","result":"9:25:24","elevation":"≈1200","format":"Up Run; второй Comrades; Back-to-Back","summary":"Возвращение на Comrades ради Up Run. Сбылась мечта: медаль Back-to-Back.","paragraphs":[{"kind":"p","text":"Насыщенный в этот раз дурбанский околобег закончился в субботу вечером подготовкой экипировки к старту и совместным паста-ужином российской группы участников в ресторане при отеле."},{"kind":"p","text":"(За рамками повествования оставлю рассказ о том, как добирался до Дурбана с группой других атлетов из России. Как бегали по набережным брендированной клубной толпой Comrades Team Russia. Как общались в общем чате и прочее. А главное, не буду ещё раз пересказывать весь тот треш, которым обернулось получение стартового пакета – про это всё есть короткая заметка в Facebook и, если очень надо, лично расскажу за кофе)."},{"kind":"p","text":"Вечером после ужина выключил телефон и передал его на сохранение и транспортировку, чтобы получить обратно в целости и сохранности в Питермарицбурге после финиша. Проснулся бесповоротно за час до будильника, вот и начался этот чудный день."},{"kind":"h2","text":"Из интересного до старта:"},{"kind":"li","text":"Ночью в Дурбане было сильно теплее, чем в прошлом году в Питермарицбурге. На входе в зону старта у меня отобрали дождевик, но за следующий почти полный час ожидания даже чуть-чуть не подмёрз. С одной стороны повезло, с другой – внушило некие опасения относительно старта гонки.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"В кластере сбились в русскую кучку и сели на специально заготовленное полотенце-коврик. Хорошая идея, т.к. стоять 30-40 минут на ногах перед тем, как ими же бежать следующие десять часов – ну такое.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Гимн ЮАР, Шошолоза, крик петуха и выстрел – удовольствие! В этот раз и ощутил, и провибрировал. И даже обменялся через нежные «high five» впечатлениями с короткостриженой симпатичной бразильянкой. Было бы интересно её потом увидеть на дистанции, но нет.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Большую часть своих дурбанских приключений и старт самого забега в этому году разделил с Мишей – товарищем и соседом по номеру, с которым познакомились здесь же год назад. В прошлый раз Миша был быстрее меня на 35 минут. В этот раз в силу обстоятельств он готовился хуже и, вероятно, наши беговые кондиции подравнялись. Есть шанс проверить. Побежали.","listType":"ul","listId":"list-1","level":0},{"kind":"h2","text":"Про гонку:"},{"kind":"li","text":"0-5 км. Подобно тому, как это было и в прошлый раз, люди вокруг бегут ощутимо быстрее. Но причина другая: в прошлом году я откровенно придерживал себя и берёг силы всю первую половину дистанции. Сейчас на этом первом отрезке бежать в темпе быстрее семи минут на километр было просто тяжело. Никакого желания прибавить, а это только начало гонки! Амбиции про выбежать из девяти и даже из девяти тридцати сразу же отложил в сторону. Тут ещё и Мишу завалили, случайно ударив сзади по ногам – немного ободрал руки, и порвал футболку. Остальное обошлось.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"6 км. Решили, что ориентироваться по дистанции будем по моим часам, т.к. они показывают на 50-100 метров пройденного пути больше, чем у Миши – значит и до финиша по ним доберёмся быстрее. А вот пульсометр только у Миши, поэтому «наш пульс» договорились контролировать по его часам. Бессмысленно, но весело.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"7-35 км. После первых трудных километров маятник отклонения хода гонки от плана качнулся в другую сторону: сначала было ещё слишком рано, а затем плотные облака – солнца нет! Свежо! Тело проснулось, вработалось. Бежится. Решили искусственно себя не сдерживать и побежали на тридцать секунд быстрее целевого темпа. «Давай бежать, пока бежится» – показалось привлекательнее страха наесться и устать раньше времени. Каждый раз, пробегая контрольные отсечки, кричим «Hello Moscow», передавая привет болельщикам, следящим за нами через трекеры на сайте и в приложении. Они, скорее всего, не слышат, но нас самих бодрит.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"35-45 км. Первая половина Comrades Up Run – это марафон с почти непрерывным набором высоты. И мы пробегаем его без переходов на шаг и остановок за достойные четыре часа двадцать семь минут. Горки бежим, гели и питьё на ходу, санитарные остановки откладываем до лучших времён. Но солнце уже вышло. Бежать стало тяжело. Особенно горки – на сорок пятом километре «наш пульс» в подъём переваливает за 160 ударов в минуту, первый раз переходим на шаг.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"45-62 км. Километры, которые до этого момента пролетали незаметно, начинают тянуться ужасно долго. На пятидесятом я понимаю, что провалил гонку: бежать вверх совсем не могу, тяжело. И пульс высокий, и задние поверхности болят. Начинает побаливать спина. Мне сложно. Все горки пешком почти целиком. Страдаю уже сейчас, а впереди ещё целый марафон. Ни о каком «пробежать быстрее, чем в прошлом году» или хотя бы «выбежать из десяти часов» речи не идёт. Выживаю. Чувствую, что Миша скоро меня справедливо бросит и мучаться дальше я буду один. Ругать некого, всё логично: тренировочные объёмы на 70 километров в месяц меньше прошлогодних, длинных тренировок в горки у меня почти не было, начали забег явно быстрее, чем следовало. Это провал. Жаль.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"62 км. В середине очередной горки расположился русский пост поддержки. Большая машина, флаг, команда в футболках цвета национального флага. У них всё: заморозки, губки, вкусный регидрон, еда, энергия и энтузиазм. Останавливаемся, обмениваемся приветствиями, переводим дух, пьём, фотографируемся на фоне флага. Они молодцы, но называют героями нас. Как так?","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"62-75 км. На 64 километре осознаю, что мы поймали ритм. В горки, как только пульс поднимается до 158-160 ударов, переходим на шаг и, опуская пульс до 140, отдыхаем, потом снова бежим. На спусках лупим в районе пяти минут на километр – бешеная скорость для ультра в моём исполнении – а так можно было? Средний темп получается вполне приличный. Осознаю, что двумя часами ранее попал в кризис, а сейчас его уже пережил. Всего лишь кризис! А паники-то было. По времени, если ничего не изменится, мы вполне выбегаем из десяти часов! Мы в графике. Мы бежим!","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"75-80 км. На отметке 22 километра до финиша прикидываю, что если бежать в среднем темпе 8 минут на километр – весьма комфортном, то гарантировано обгоним меня прошлогоднего: пробежать на минуту быстрее чем 09:54 – мой план на гонку от тренера. Каждую километровую отсечку вычитаю от условного нуля единицу, если бежим быстрее 7 мин/км. И прибавляю единицу, если бежим медленнее 9 мин/км – рассчитываю так актуальный запас. За десять километров до финиша счёт «минус двенадцать». А реальный запас ещё больше: последний значимый подъём Polly Shortts даже не пытаемся бежать – спокойно прогуливаемся и болтаем с местными.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"80-86 км. За несколько километром до Polly Shortts на 30-40 минут Миша убегал от меня в отрыв, казалось, что уже навсегда. Но нет, отыграл. Сейчас уже я бегу быстрее и притормаживаю для Миши – от экспериментов с гелями у него колит бок. Тем временем придумал себе новую цель: если выбегать километры из семи минут, мы успеем финишировать из девяти тридцати! 9:30 – это моя программа объективно возможного максимума. И мы, да, успеваем!","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"87 км. Вбегая на стадион, снимаю кепку и расслабляю жилет – делаю работу над ошибками к прошлому году с целью получить посимпатичнее фотографии с финиша. В коридоре заряжаюсь энергией зрителей: машу руками, ускоряюсь, пою «Шололозу», затем фирменный спурт на 50-70 метров. Арка, лента, финиш - 09:25. Позируем фотографам, подставляем головы для первых медалей и ищем, где нам следом повесят столько желанные «Back to back» а иначе за чем это всё?","listType":"ul","listId":"list-2","level":0},{"kind":"h2","text":"Что ещё:"},{"kind":"li","text":"Очень клубной получилась гонка. Я и в прошлый раз встречал много соотечественников на трассе, но в этот с большей частью из них был уже знаком лично и иногда больше года. Почувствовал себя не чужим и на трассе, и в зоне после финиша. В Новороссийске, например, было совсем иначе.","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Из трёх моих официальных ультра-гонок я две с половиной (оба Комрадса и половину Маркотха) бежал в паре – мне везёт. Особенность Comrades 2019: в этот раз тянули меня, а не я. Без Миши я бы, вероятно, не додумался так упорото бегать спуски, и не было бы никаких «из девяти тридцати».","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Все три пейсмейкера на девять часов стартовали из нашего же кластера и со своими автобусами по очереди обогнали нас ещё на первой четверти дистанции. А дальше пошло что-то не так: кажется, я видел поломку всех трёх автобусов, притом первого, уже в районе пятидесятого километра. Ну это как-то не серьёзно. Как такое быть может? Надо ребятам в следующий раз звать Лёшу Бордакова и Гришу Ленина: их автобусы на полпути не разваливаются.","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Я живчик после бега. И скакал по лестницам финишной зоны в поисках своего телефона. И козлом прыгал по набережной Дурбана в погоне за сдутой ветром кепкой. Кто-то из парней говорит, что я схалтурил. Сам поддерживаю идею о том, что бег вверх тяжелее ложится на душу, но проще на ноги – вот и не болят особо.","listType":"ul","listId":"list-3","level":0},{"kind":"h2","text":"Вместо вывода."},{"kind":"p","text":"Из-за того что в горки много ходил пешком, есть ощущение, что старт не получился. Но это, разумеется, не так."},{"kind":"p","text":"Тактика «мало терять вверх, много отыгрывать вниз» себя полностью оправдала – результатом очень доволен. Дима молодец. И Аня (тренер) молодец – страдал при подготовке существенно меньше, а пробежал год к году на полчаса быстрее."},{"kind":"p","text":"Вероятность, что приеду в ЮАР в июне 2020 мала. Есть азарт и потенциал скинуть за год ещё тридцать минут, но эта идея не возбуждает: лететь далеко и дорого, готовиться муторно и сложно, само участие в гонке опять причинит ментальные страдания. А тут ещё и эти проблемы с допуском, которые с каждым годом прогрессируют. До сентября вагон времени, чтобы под настроение пару раз поменять решение на обратное, но пока так."},{"kind":"h2","text":"А что тогда бегать? И зачем?"}]},{"id":"2019-valencia-marathon-2019","title":"Valencia Marathon 2019","docTitle":"2019 — Valencia Marathon 2019","sourceUrl":"https://ddv-comrades.blogspot.com/2019/12/blog-post.html","categories":["Марафоны"],"date":"2019","place":"Валенсия, Испания","distance":"42,195 км","result":"3:27:16","elevation":"","format":"Первый марафон в Европе; личный рекорд","summary":"Первый европейский марафон и новый личный рекорд после пяти месяцев подготовки.","paragraphs":[{"kind":"p","text":"Последние пару лет я не пишу в этом блоге про марафоны. А про этот заметку сочиню – он немного особенный:"},{"kind":"li","text":"Мой первый марафон в Европе.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Юбилей: десятый официальный финиш на дистанции 42,195.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Второй по значимости старт года – продлил ради него сезон и пять месяцев целенаправленно готовился.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"3:27:16 – теперь и, как минимум, до сентября это мой лучший марафонский результат.","listType":"ol","listId":"list-1","level":0},{"kind":"p","text":"Про «типовой» бег по асфальту не так просто писать интересно после всех этих Comrades, ICON, Маркотх. Попробую тезисами и лаконично."},{"kind":"h2","text":"Почему Валенсия?"},{"kind":"p","text":"После возвращения из ЮАР поделился с Андреем Гребенко кризисом цели: «Не знаю, чего в 2019-м ещё хотеть от бега». Андрей не растерялся и рассказал про старт в Валенсии – плоский и быстрый декабрьский марафон. Прислушался, посмотрел декабрьскую погоду на месте: обычно в районе плюс пятнадцати – это хорошо."},{"kind":"p","text":"Чтобы окончательно решиться на выезд в Испанию, к коктейлю из по-берлински плоской трассы и относительно прохладной погоды необходимо было добавить дерзкую и амбициозную цель: написал Ане-тренеру, что хочу Валенсию пробежать из трёх двадцати. Аня ответила – «давай». Так и выбрал."},{"kind":"h2","text":"Как готовился?"},{"kind":"p","text":"Первая половина года была насыщена длинными стартами и подготовкой к ним – справедливо решили, что базовые объёмы у меня уже есть: до Валенсии лишь раз 5-6 бегал больше 60 километров в неделю."},{"kind":"p","text":"Длительные в 25+ километров делал примерно через воскресенье. Одной из таких длительных был Московский Марафон, что явно не упрощало задачу тренеру. Я всё понимал, но жалко было слот, купленный ещё в начале года – постарались, как могли, вписать ММ в тренировочный процесс."},{"kind":"p","text":"Первые три месяца делал две скоростные работы в неделю. Прогресс Аню не очень впечатлял, и с октября работ на неделе стало уже три. А с ноября мы объединили третью скоростную с воскресной длинной. Работы были в основном: 500 через 500, 1000 через 500 и лесенки по пульсу/темпу с длинной ступени 2-4 километра."},{"kind":"p","text":"Уже после старта, во время предварительного разбора полётов, пришли к выводу, что я поздно начал бегать длинные темповые отрезки, – выносливости хватило, а крепости ног держать высокий темп нет. Ну и ок – есть над чем работать."},{"kind":"h2","text":"Какой был план?"},{"kind":"p","text":"В качестве результата рассматривал три возможных позитивных варианта:"},{"kind":"li","text":"Задача максимум: выбежать из 3:20.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Реалистичный позитив: 3:20 – 3:25.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Минимально положительный: уложиться в 3:30 ­– красивая цифра и обновление личника.","listType":"ul","listId":"list-2","level":0},{"kind":"p","text":"Какой из них реализуется зависело от погоды, того, как высплюсь на неделе до и, собственно, моей подготовки."},{"kind":"p","text":"План на гонку от тренера – страдать. На пульс не смотреть, бежать отрезки лесенкой по темпу: 5:10 – 5:15 , 4:45 – 4:50 , 4:50 – 4:55 , 4:45 – 4:50 , 4:50 – 5:00 , 4:40 – 4:45 , 4:35 – 4:40 . Т.е. вработаться, а затем чередовать интервалы условно быстрого бега с интервалами условно восстановительного, последнюю десятку – на все деньги."},{"kind":"h2","text":"А как вышло?"},{"kind":"p","text":"С задачей вдоволь выспаться я справился. С погодой в день старта похуже: плюс двадцать и безоблачно. Про главный вывод относительно подготовки я уже заспойлерил чуть выше – слегка не хватило."},{"kind":"p","text":"Стартовал бодро и уверенно бежал по быстрой границе плановых интервалов до 32 километра – конца второго восстановительного отрезка. Бежалось хорошо, с запасом, продуктивно. Но после 32-ого надо было прибавить, а я не мог. И даже держать темп из пяти минут стало тяжело."},{"kind":"p","text":"Ноги наелись – чувствовал болезненное напряжение в задних и передних поверхностях. Остаток дистанции терпел, планируя лишь то, как пробегу очередные 2-3 километра: «Вот их постараюсь пробежать по пять минус, а дальше посмотрим»."},{"kind":"p","text":"Метафорически стиснув зубы, так и бежал почти до самого финиша, не зная продержусь ли в выбранном компромиссном темпе до конца каждой следующей тысячи метров. Ускорился только под самый финиш: последние 500 метров по 4:32. Последние 200 метров – что-то похожее на спурт."},{"kind":"p","text":"Фотографий с марафона жду без нетерпения. Уверен, они будут в том замечательном марафонском стиле, когда утомлённый дистанцией атлет выглядит на 15-20 лет старше своего возраста и очень несчастным. Ну да, не прогулка."},{"kind":"h2","text":"Впечатления от гонки?"},{"kind":"p","text":"Центральная часть Валенсии живописна, а финиш марафона проходит в буквальном смысле слова по воде – визуально яркой, насыщенной и зрелищной могла бы получиться гонка, если бы я видел что-то кроме синей линии под ногами, спин впереди бегущих атлетов, собственных часов и иногда болельщиков.. ох уж этот пресловутый туннельный эффект забега на пределе возможностей."},{"kind":"p","text":"Марафонская дистанция прошла очень быстро: до 32 километра, как один длинный вдох – сложно что-то конкретное вспомнить или выделить. После 32-ого – единый почти одинаково сложный отрезок, на котором тоже было не до красот."},{"kind":"p","text":"Помню только, что болельщиков было много, а на последних двух километрах и вовсе сплошная стена с двух сторон. Ещё помню, по ощущениям, половина дистанции проходила в спасительной городской тени. А иногда, выбегая на солнце, я щурился от пота и яркого света так сильно, что фокуса зрения хватало только на то, чтобы во что-то не врезаться."},{"kind":"p","text":"Ещё запомнил, что плоская трасса – это очень удобно. И что иногда было скользко на брусчатке у поздних пунктов питания. И что гели ел по расписанию от тренера, которое не всегда совпадало с доступностью воды – бежал тогда и думал: «Километра через 2-3 запью и будет всё ещё немного лучше»."},{"kind":"p","text":"Как уже поделился в комментариях на Фейсбуке: «C удовольствием бы под гипнозом посмотрел запись гонки от первого лица» – если бы не приехал в город за несколько дней до старта, то едва ли по итогам марафона смог бы что-то интересное о Валенсии рассказать."},{"kind":"h2","text":"Что-как с организацией?"},{"kind":"p","text":"Без вопросов – всё здорово. Ещё приятно отметить, что между Валенсийским и Московским марафонами нет пропасти в уровне организации. На обоих стартах полный порядок с перекрытием улиц, соблюдением таймингов, навигацией, пунктами питания по трассе и доброжелательностью волонтёров."},{"kind":"p","text":"Есть даже моменты, в которых Москва уверенно впереди:"},{"kind":"li","text":"Богаче и наряднее Экспо. В Валенсии, например, беда со спортивным питанием: гели, рекавери и прочее на старт лучше везти свои из дома.","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Доступнее информация о расписании, логистике и схеме стартового городка: ММ её направляет на почту и загодя вывешивает на сайте. В Валенсии такие детали впервые можно увидеть только на щитах в зоне Экспо и далее в журнале из стартового пакета.","listType":"ul","listId":"list-3","level":0},{"kind":"p","text":"Плюсы Валенсийского перед Московским:"},{"kind":"li","text":"Нет тягучих очередей (в туалет перед стартом не в счёт) и толкотни. Яркий пример – гравировка медалей: не более пары минут на мини-очередь, поздороваться, отдать и получить назад медаль, сказать \"спасибо\".","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Значительно больше зрителей и болельщиков вдоль трассы. И общее ощущение, что марафону в городе рады.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Нет вот этой неприятной национальной традиции про рамки металлоискателей, досмотр личных вещей и требование предъявить медицинскую справку. Из-за этого марафон кажется в целом добрее.","listType":"ul","listId":"list-4","level":0},{"kind":"p","text":"Но этой всё на мой обывательский взгляд. Интересно было бы послушать на тему организационных моментов того, кто в этом действительно шарит. Дмитрий Тарасов, я читал в интервью, планировал приехать в Валенсию на десятку – вот бы поделился впечатлениями."},{"kind":"h2","text":"Какие мысли в итоге?"},{"kind":"p","text":"Ну вот несколько:"},{"kind":"li","text":"3:27:16 – есть внутри от этих цифр приятное ощущение «Да, получилось». Доволен и рад. По общим меркам среднее время, понимаю, но для меня – минус пять минут с личного рекорда. Это что-то значит.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Результат, конечно, вполне мог бы быть и лучше: трасса как блюдце, готовился почти полгода, выспался. Сегодня я скорость на тренировках в районе 5:20 называю темповым бегом. Но это всё из-за игр в ультрабег – по факту, ещё в 2016 я бегал половинку по 4:47. Мои текущие кондиции больше про «вернул прежний», чем про «вышел на новый уровень». Вот она разница между моим новым личником и оптимистично целевыми 3:19:59.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Я захотел быстрый марафон в том числе для того, чтобы потерпеть и пострадать. Хотел вспомнить, как это, и приобщиться к психически тяжёлой культуре быстрого стаерского бега. Ну и как-то не очень получилось. Во-первых, удовольствие от страдания – явно не про меня, ничего приятного найти в боли и с наслаждением ощутить не удалось. Во-вторых, не разобрался, как именно и что терпеть. Я мог, например, волевым усилием 33 и 34 километры пробежать быстрее, но при этом, наверняка, не выдержал бы следующих восьми до финиша – вот и оно мне надо тогда было бы? Не понятно.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Хожу сейчас «интересно». А ещё несколько раз в день прикольно спазмирует передняя поверхность бедра, и я забавно пытаюсь не упасть. А самое запоминающееся послемарафонское – с двумя чемоданами в руках спускаться по лестнице вниз. Люблю тебя жизнь ).","listType":"ol","listId":"list-5","level":0}]},{"id":"2018-comrades-2018-down-run","title":"Comrades 2018. Down Run","docTitle":"2018 — Comrades 2018. Down Run","sourceUrl":"https://ddv-comrades.blogspot.com/2018/06/blog-post_12.html","categories":["Ультра","Приключения"],"date":"2018","place":"ЮАР","distance":"≈90 км","result":"9:54:45","elevation":"≈800","format":"Первая ультра; Down Run","summary":"Первый Comrades и первая ультра: около 90 км по ЮАР с финишем на стадионе.","paragraphs":[{"kind":"p","text":"Друзья, простите, букв будет много. Ультратекст про ультрабег."},{"kind":"h2","text":"PRE-COMRADES 2018"},{"kind":"h3","text":"Статус до отлёта , 5 июня"},{"kind":"p","text":"Прежде чем окончательно утвердить план «купить четыре разных пачки обезболивающего и вперёд» решили с тренером отправить меня на УЗИ паха: связки целы, мышечных проблем нет. Увеличен лимфоузел, но это не опасно – можно и после старта разобраться, если будет актуально."},{"kind":"p","text":"Во вторник пробежал с тейпом на проблемной области семь километров – всё ок, не болит. Последнюю пробежку перед стартом запланировали на четверг уже в Дурбане – там будет понятно, стоит ли тейпировать пах на старт. Собираю чемодан."},{"kind":"p","text":"От IAAF и ASA новостей нет. ВФЛА выписало нам всем официальную справку о том, что мы любители до мозга костей – надо, мол, нас допускать. Решили, на всякий случай, эту справку иметь при себе на получении номера. В путь."},{"kind":"h3","text":"Дорога , 6-7 июня"},{"kind":"p","text":"Москва-Дубай-Дурбан. Такси, аэропорт, самолёт, аэропорт, самолёт, такси – приехали. От двери до двери без малого сутки. Не тоже самое, что бегать двенадцать часов, но попе неприятно. Подустал, и хорошо, что три дня есть прийти в себя на месте."},{"kind":"p","text":"В дороге ел, спал, читал, смотрел кино. Самое яркое впечатление: рассказывал как-то об удовольствии наблюдать как к Лужникам стекаются струйки «своих» в день проведения Московского Марафона и образуют ручьи, реки и наконец море по мере приближения к месту старта? Тут примерно такая же история, но в планетарном масштабе. Поток комрадов начал формироваться еще при посадке в Домодедово (5-10 человек в самолёте) и набирал силу с каждым следующим этапом пути. Во втором самолёте, кажется, кроме ультра-бегунов и длинных триатлетов с семьями не было никого. Та же история в отеле."},{"kind":"p","text":"Своих в общем потоке выдают часы, рюкзаки, телосложение, футболки со стартов – не нужно быть экстрасенсом, чтобы понять, что тебя и этих ребят через несколько дней ждет одно и тоже приключение. Эта фишка – один из тех приятных ништяков в беге, которые не дают каждому следующему старту стать последним."},{"kind":"h3","text":"Дурбан, четверг , 7 июня"},{"kind":"p","text":"Во время регистрации в Blue Waters встретил Лешу Бордакова и компанию – ребята тоже только подъехали. Договорились через час вместе пробежаться. Стайкой из семи человек восемь километров по набережной – единственному относительно безопасному месту в городе. Тепло, по-доброму."},{"kind":"p","text":"Во время пробежки сразу две хороших новости: не болит ничего в паху и первые ребята-соотечественники днём уже получили номера – никаких проблем с допуском."},{"kind":"p","text":"Бежим по набережной. Из компании в пятнадцать человек, идущей нам на встречу: «Леша, привет!». «Паша, привет!» – летит обратно. Ну вот, другой край света, а как будто бы юбилейный паркран в Кузьминках – все знают друг друга и привет-привет."},{"kind":"p","text":"Хорошо, в общем побегали."},{"kind":"h3","text":"Дурбан, пятница, 8 июня"},{"kind":"p","text":"Проснулся, смотрю с балкона на окрестности, набережную и океан. По дорожке вдоль берега бегают сотни ребят и девчат в цветастых футболках. Впечатляет."},{"kind":"p","text":"Завтракаю вместе с соседями по номеру: подругой Леной и железным человеком из Питера – Мишей. После маленького праздника гедонизма с отличным видом на океан выдвигаемся в сторону экспо. Быстро и без приключений забрал стартовый пакет: два номера, чип на кроссовку, бирка на вещи, проходка для поддержки в зону финиша, ваучеры на еду, футболка."},{"kind":"p","text":"Набор подарочного барахла от спонсоров: алкогольное пиво, две бутылки энергетического напитка, питательный батончик, энергетические мармеладки, спортивная фляга на 0,7 литра, пробник дезодоранта, средство от синусита, супер мощный пакетик кофеина, какие-то печеньки и ворох макулатуры со скидками."},{"kind":"p","text":"Планово закупился гелями и соляными таблетками – теперь готов."},{"kind":"p","text":"Бегать в пятницу мне было не велено – сделал лёгкое СФП и первый раз в жизни попробовал помассировать сам себя с помощью специального валика. Получилось не очень, есть чему учиться."},{"kind":"h3","text":"Суббота, день до , 9 июня"},{"kind":"p","text":"В Дурбане на местный паркран собралось несколько тысяч бегунов. Бегали без меня – волнительно и не до лишних телодвижений. Чуть-чуть СФП и хватит. Погуляли, пофоткались, встретились с ребятами – Лёшей Ивановым и Настей. Встретились с группой поддержки – Сашей и Наташей. Все вместе пообедали и обсудили логистику на завтрашний день, обменялись контактами."},{"kind":"p","text":"С Лёшей и Настей поехали на прокатной машине в Питермарицбург – ребята там сняли дом в пяти километрах от города: переночевать поближе к старту, чтобы выспаться и не тратить силы в дороге. Приехали, пообщались с хозяевами. Прикрепили номера, распихали гели. Проверили экипировку – порядок."},{"kind":"p","text":"Решили с Лёшей бежать вместе и скрепили уговор вечерней пастой. Настя – лидер нашей команды поддержки из четырех человек, а еще основной водитель экипажа. Кажется, всё у нас по плану. Ложимся спать около девяти вечера, вставать завтра в три."},{"kind":"h2","text":"COMRADES 2018"},{"kind":"h3","text":"Перед стартом."},{"kind":"p","text":"Проснулся, умылся, поел остатки вчерашней пасты. В четыре выехали. Без пробок нам ехать 10 минут. По плану заложили полчаса – должны доехать к 4:30 (за час до старта), размяться, намазаться кремом от загара, не торопясь войти в кластер, чуть-чуть замерзнуть и привет Шошолаза!"},{"kind":"p","text":"Довольно быстро план превратился в труху. Плотность трафика превзошла ожидания. Навигатор двадцать минут подряд показывает, что ехать полчаса. Если успеваем, то впритык. ЕСЛИ! Дорога одна, дёргаться без толку, стараемся не нервничать в меру своих способностей к дзену. Минуты летят быстрее километров. Есть вариант пробежаться, но разминка в 7-10 километров перед забегом на 90 не кажется хорошей идеей."},{"kind":"p","text":"Время 05:05 въезжаем в город. До зоны старта около трех километров. В 5:15 вход в кластеры закроют. Впереди всё еще пробка. Ищем варианты. Сворачиваем в сторону, объезжаем длинным путём километр пробки. Бросаем машину, бросаем вещи в багажник, время 5:10, бежим! Еще метров 200 или 300. Успеем? Вокруг темно, машины, люди, бегуны, полицейские. 5:12 – входим в зону перед кластерами. Чудо – свободные синие кабинки, нельзя упускать. 5:13 видим кластер C, нам в соседний. 5:14 – давка на входе, у Леши наполовину срывают номер со спины. 5:15 мы в кластере! Воу! Первый мини-оргазм от мероприятия. Успели."},{"kind":"p","text":"Креплю Леше номер булавками как было. Играет гимн Южной Африки, а затем Шошолаза. Двадцать тысяч человек подпевают динамикам гимн Комрадс! Про этот момент я читал столько восторженных отзывов и ожидания от него настолько высоки, что эмоционально всё происходящие воспринимается как должное. Особенно на фоне предыдущего приключения. Но всё равно кайфово."},{"kind":"h3","text":"Бег, начало."},{"kind":"p","text":"На Комрадс время считается from gun to gun . И вот звучит он – пушечный выстрел. Кластер неторопливо движется вперёд. Стартовую отсечку мы пересекаем спустя шесть минут после начала гонки."},{"kind":"p","text":"Еще темно. Бежим по городу, потом выбегаем на старое шоссе. По новому вдоль трассы будет перемещаться наша support crew . Целевой средний темп в районе 06:30 на километр. Это план на первую половину дистанции – дальше по обстоятельствам. Не в той мы ситуации, чтобы строить прогнозы на километры с шестидесятого и далее."},{"kind":"p","text":"Мои личные ожидания – пробежать быстрее одиннадцати часов и получить симпатичную бронзовую медаль. Если получится в районе десяти часов – я герой и счастлив, но убиваться ради этого не планирую. У Лёши ожидания еще скромнее – финишировать до cut off . Он триатлет, и бегового объёма у него существенно меньше. Соответственно и амбиций. Бежим вместе."},{"kind":"p","text":"Шутим, болтаем. Продвигаемся, кажется, чуть медленнее окружающих нас ребят – это странно. Высокомерно полагаю, что дистанция рассудит, кто прав: торопыги вокруг или мы. На пятом километре попадаем в пробку – почему-то все идут пешком. Оббегать толпу в темноте по полю кажется дурацкой идеей. Поругиваясь, тоже переходим на шаг. Через несколько минут снова бежим."},{"kind":"p","text":"К десятому километру согрелись. Выбросил после санитарной остановки садовые перчатки. Первая двадцатка идёт легко. Пью по несколько глотков воды на каждом пункте питания, раз в шесть километров ем гель. Каждые двадцать планирую есть солевую таблетку. У Лёши план питания от ребят из SIS – отличаются отсечки, но общий принцип тот же. Воду на Комрадс дают в удобнейших полиэтиленовых саше – откусываешь угол, сплевываешь полиэтилен, пьешь."},{"kind":"p","text":"Горки особо не впечатляют. На самую страшную (судя по схеме трассы) взбираемся без существенных усилий. На большом вело круге в Крылатском рельеф злее. А вот спуски коварны – на каждом максимально сосредоточен на технике: бедро и пресс напрягать, голень не выносить, не гнать."},{"kind":"h3","text":"С тридцатого по шестидесятый."},{"kind":"p","text":"На тридцатом Лёша уже наелся – в горки время от времени переходим на шаг. Решили, что до тех пор пока выбегам из одиннадцати часов, бежим вместе. Это что-то про дружбу, поддержку и «вместе веселее» против довольно бессмысленных в этот раз амбиций."},{"kind":"p","text":"Опыт длинных подсказывает, что рано или поздно наши состояния выровняются. Хуже «локального дна» у Лёши не будет, а я его определенно еще успею нагнать. Просто буду страдать не так долго."},{"kind":"p","text":"По очереди друг друга притормаживаем на спусках. Каждый раз, когда Леша говорит мне «не разгоняйся» или «притормози», добавляю себе сам «и следи за техникой». Активно общаемся с попутчиками: соотечественниками, местными, австралийцами, и так далее. С кем-то бежим вместе по паре километров, пока пункт питания, переход на шаг, разница в комфортном темпе или что-то еще не разлучат нас."},{"kind":"p","text":"На тридцатом километре впервые встречаемся с группой поддержки: Саша, Наташа, Лена и Настя. Здороваемся, обнимаемся. Всё почти на бегу. Следующая встреча по плану уже через 12-13 километров."},{"kind":"p","text":"Бегу легко, подъёмы всё еще не требует от меня проявить должного к ним уважения, в любой момент могу прибавить. Уверенно обгоняем разный народец. Ощущения в теле высокомерно-самоуверенные в духе “easy катка”. Но я уже бегал семьдесят! Я точно знаю, что «жопа» обязательно будет и мозгом остужаю расхрабрившееся эго."},{"kind":"p","text":"На второй оговоренной точке не встречаем ребят из поддержки: либо не увидели друг друга, либо они не успели. Риск прогнозируемый, все гели у нас при себе, ничего страшного. Двигаемся дальше. Первые разы заходит разговор на тему «зачем это всё надо» – Леша устал."},{"kind":"p","text":"Зато догоняем и обгоняем пейсеров на десять часов! Как-то они не торопятся. Сначала съели одну стайку человек из сорока. Еще через несколько минут вторую. Ребята бегут красиво. По свистку все вместе переходят на шаг в начале подъёмов, по свистку начинают бежать снова. Какое-то время им подражаем, потом снова ориентируемся на себя."},{"kind":"p","text":"Километре на пятидесятом в кроссовок попал камень. Или так показалось. Отпускаю Лёшу вперед. Сажусь вытряхивать. Получается долго. А потом сразу надо еще раз – первый не сработал. В этот раз снимаю кроссовку уже вместе с носком – еще дольше. Леши не видно. Спуртую, чтобы догнать. Справляюсь за полкилометра, но наелся. С нетерпением жду, когда снова перейдем на шаг, чтобы восстановиться. В этот раз прощено, больше так твердо решаю не делать."},{"kind":"p","text":"После шестидесяти километров, в третьей согласованной точке, встречаем своих."},{"kind":"h3","text":"Самый сок."},{"kind":"p","text":"В этот раз с ребятами общаемся дольше. Что-то в стёбной манере наговариваю на камеру, изображаю повышенную бодрость духа. На самом же деле уже какое-то время тоже «грущу». Пока стоим нас обгоняют обе группы на десять часов. Зато заряд эмоций."},{"kind":"p","text":"Пейсеров с наскоку обогнать не получается. Они бегут быстрее нас. Точно из шести минут на километр. Приближаемся к ним только, когда они целой группой по свистку переходят на шаг. Потом они снова уходят вперёд. Плевать. Мы устали. Гонятся с ними нет ни желания, ни сил."},{"kind":"p","text":"На будничные вопросы товарищей по несчастью “How are you feeling” честно отвечаю, что не так здорово, как несколько часов назад. Воду уже не только пью, но и поливаю на голову, шею, спину. Пункты питания расположены не идеально кратно двум километрам – пару раз было нечем запить гель. Быстро сделали работу над ошибками: теперь одно саше всегда есть у каждого прозапас. Кайфую на этом фоне от адской удобности саламоновской жилетки – гели, таблетки, крем от загара и теперь уже запасная вода – всё под рукой, ничего не мешает."},{"kind":"p","text":"На шаг переходим чаще, но средний темп всё еще неплохой. Из одиннадцати точно выбегаем с запасом, если не встанем намертво. Прилично забились ягодицы, но не мешают. Побаливает поясница и на спусках колени – не критично. Пах не беспокоит совсем, обезболивающие таблетки с завистью смотрят на солевые – обхожусь совсем без первых. У Лёши чуть хуже – крутит живот и при каждом шаге с горки адской болью отзывается мозоль в передней части стопы. Принимает волшебную пилюлю – становится не сильно, но проще."},{"kind":"p","text":"Не смотря на угнетенное состояние в районе 65-67 километров, понимаю, что к старту готов хорошо. На моно-тренировках кризис наступал раньше и давил сильнее. Хотя и сравнивать не совсем корректно – тут всё-таки старт, и тут есть Лёша – это совсем не тоже самое, что одному бегать десятикилометровые круги в парке."},{"kind":"h3","text":"Гонка за десятку."},{"kind":"p","text":"Как будто бы последний значимый подъём позади. Впереди спуск в 22 километра до финиша. Мы вновь догоняем десятичасовые стайки и, если верить расчетам, вполне имеем шансы выбежать из десяти часов сами. Есть только один нюанс: для этого нужно потерпеть. И терпеть долго – два с лишним часа. Уровень бодрости у обоих давно одинаков – остатки плещутся на дне баков. Обсуждаем аргументы за и против терпилова. Решаем, что попробуем."},{"kind":"p","text":"Бежим. То пейсеры мешают нам, то мы им. Попеременно обгоняем друг друга с интервалом в 2-3 километра. За двадцать километров до финиша случается невозможное: в Южной Африке на девяностокилометровом ультрамарафоне встречаем общего (!) знакомого из Москвы, с которым ни как не координировались до старта и понятия не имели о его участии в гонке! Бежим какое-то время вместе, потом теряемся. За оставшиеся двадцать километров парень отстанет от нас почти на полчаса."},{"kind":"p","text":"Лёша бежит по шесть минут, потому что рядом бегу я и это не даёт ему сбавить и слиться. Я бегу по шесть минут, потому что Лёша притормаживал меня после тридцатки и, тем самым, оставил мне силы переставлять ноги сейчас. Симбиоз."},{"kind":"p","text":"Тем временем на трассе появляется новое развлечение – крутые спуски с дополнительным боковым градиентом. Тело перекашивается, колени психуют, ааа! Хорошо, что таких немного, иначе бы."},{"kind":"p","text":"Вроде бы успеваем, но запас мал. Бодримся колой. До финиша остаётся десять километров и 63 минуты. Решаем бежать строго по шесть минут и терпеть. Обгоняем пейсеров, топим по 5:25. Спуски слетаем, горки (а они еще есть и кусачие) штурмуем."},{"kind":"p","text":"- Как себя чувствуешь? - Фигово - Пойдёт"},{"kind":"p","text":"Уже в городе, но стадиона не видно. За шесть километров до финиша не надолго переходим на шаг – съедаю последний гель, снова бежим по пять с чем-то там. Можно было бы и медленнее, но пусть лучше будет запас на самый финиш. Бежим по мосту, бежим по автомобильной развязке. Из-за зданий выплывает стадион. Бежать трудно, но неизбежность происходящего очевидна: мы так и пробежим последние 4 километра. И нет такой штуки, которая бы нас смогла уже остановить."},{"kind":"p","text":"Километр до финиша. Вдоль трассы появляется брендированное красным сплошное ограждение, за ним люди. Несемся мимо и просим поддержки. Получаем. Прибавляем. Вбегаем через арку на стадион."},{"kind":"p","text":"Лёша говорит «Ну всё, давай» и как будто бы толкает вперёд. Давлю на газ, выбегаю на дорожку стадиона с настоящими зрителями на трибунах и диктором, эпично! Топлю, съедаю перед финишем всех, кого вижу до арки, и, изображая самолёт, игриво пересекаю финишную черту – 9:54:45 ! Показушно пританцовываю перед фотографами – это ошибка, камера трансляции стоит сильно правее… ну ок, будет шанс повторить трюк через год."},{"kind":"h2","text":"Summary."},{"kind":"li","text":"Абсолютный фарт с погодой. Вместо обычных для Комрадс солнца и плюс тридцати, десятого июня были умеренно облачные плюс 22-24.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Потрясающий уровень организации забега. Он в каждой детали от экспо, автобусов и чумовых пунктов питания до онлайн трекера участников, медицинского сопровождения и комфортной финишной зоны был хорош. Простой пример: в течение 12 часов гонки на протяжении всех 90 километров было в изобилии холодной (!) воды и изотоника. Холодной! В Африке!","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"С Лёшей мы познакомились, потусили и практически перестали общаться еще до того, как каждый из нас увлекся циклическими видами. За последние четыре года виделись только раз – на встрече комрадов в RunLab пару недель назад. Невероятно, что оба мы решили бежать Комрадс в этом году, скооперировались и, помогая друг другу, вместе преодолели все 90 километров дистанции. Это сильно.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Я был готов к старту. Среднемесячный объём около 300 километров, длинные в 50, 60 и 70 километров. Горки, море СФП и лесенок. Этот забег, по факту, не был для меня прыжком выше головы. Это был finish strong, который мне и не на каждом марафоне удавался раньше. Ради этого стоило упахаться в апреле и мае. Наглядная иллюстрация к теме «тяжело в учении, легко в бою».","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Очень сильным вышел отрицательный сплит и в целом – вторая половина на 10 минут быстрее первой. И еще сильнее – относительно среднего атлета: за гонку мы обогнали около шести тысяч бегунов, продвинувшись из второй половины пелотона до попадания в первые 5500 атлетов.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Время от времени на трассе вспоминал, что за моими успехами через трекер следят Влада, родители и друзья. Не думал раньше, что эти мысли действительно могут быть настолько сильной поддержкой.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Как-то странно после такого пробега говорить себе, что я чего-то не могу. Могу. Почти всегда это только вопрос выбора, настроя, цены вопроса и внутреннего согласия с этой ценой.","listType":"ol","listId":"list-1","level":0},{"kind":"p","text":"Не оправдались, по большому счету, ожидания лишь от красоты видов и непрерывности стены болельщиков на все девяносто километров. Почему-то представлял себе зелёные Альпы и сплошной бразильский карнавал. Всё остальное – конфеты и любовь. Успею, конечно, еще передумать туда и обратно несколько раз, но пока определенно планирую вернуться в ЮАР через год за back to back ."},{"kind":"p","text":"__"},{"kind":"p","text":"Ну вот, рассказал про себя и свою гонку. Про историческую справку, виды медалей, зеленые номера, детский дом, контрольные отсечки и разное другое относительно общее для всех участников можно дочитать в культовом Комрадс-отчете Евгения Бирина – лучше бы я всё равно не написал. Кстати, именно этот текст сделал Комрадс моей следующей беговой мечтой после БЛМ. Мечтой, которая пару дней назад исполнилась."},{"kind":"p","text":"Спасибо тебе терпеливый читатель. Сегодня ставлю блог на долгую паузу. Маловероятно, что новые заметки появятся до октября. Не факт, что после. В случае чего, общеизвестны простые способы меня найти и расспросить о чем угодно – не надо стесняться )."},{"kind":"p","text":"Было весело!"}]},{"id":"2017-белые-ночи-2017","title":"Белые Ночи 2017","docTitle":"2017 — Белые Ночи 2017","sourceUrl":"https://ddv-comrades.blogspot.com/2017/07/336-2017.html","categories":["Марафоны"],"date":"2017","place":"Санкт-Петербург","distance":"42,2 км","result":"3:50:12","elevation":"","format":"Шоссейный марафон","summary":"Третий заход на «Белые Ночи»: спокойный марафон из четырёх часов.","paragraphs":[{"kind":"p","text":"Ну вот, случилось. Третий раз закинул старик невод в море я сел на Сапсан и поехал в Питер выбегать местный марафон из четырёх часов. Все мои лучшие чаяния относительного этого приключения на этот раз сбылись: гулял хорошо, ел вкусно, общался душевно и бегом своим ничего не испортил."},{"kind":"h2","text":"Про забег."},{"kind":"p","text":"Предстартовая разминка от Рубинштейна до Дворцовой сложилась в канонические два километра. А вот потянуться мог бы и лучше, но увидел ребят с шариками на четыре часа и не хотел от них далеко отбиваться – поспешил следом в стартовый коридор."},{"kind":"p","text":"Старт дан. Вслед за шариками с цифрами «четыре» и «ноль» я устремился сквозь неторопливое уплотнение товарищей по хобби. На втором километре догнал шарики. Далее планировал выключить мозг и просто переставлять ноги за ребятами, которые в силу своей особой роли будут исправно отмерять темп в 5:41 на километр – мой целевой. Не случилось. Пейсеры приняли решение до 15 километра наверстать отставание в две минуты (видимо, потеряли в стартовой толкучке) и штамповали из 5:30. После пятнадцатого тайминг нагнали и притормозили."},{"kind":"p","text":"Воздух – плюс восемнадцать, небо затянуто могучими серыми облаками. Не погода, а подарок – не смог больше пары километров держаться за спинами сбавивших ход ориентиров, обогнал и почти до самого финиша бежал по ~5:25. Последний километр слегка побыстрее, а последние 200 метров – быстро. Всё вместе вышло в 03:50:13 – доволен собой, тренером и погодой. Сил осталось прилично, а ноги побаливают слегка. Получил медаль, встретил друзей, потянулся, пошли за пышками."},{"kind":"h2","text":"Наблюдения:"},{"kind":"li","text":"Трамвайный рельс. Неприятно споткнулся о него в районе десятого километра, упал и ссаданул ладони.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Аква Минерале вместо обычного на Белых Ночах Шишкиного Леса. Разницы почти никакой, но расточительно: 600 миллилитров – это много: бутылки летели на обочину полными на половину.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Питался только гелями: с 11 по 36 километр через каждые пять. Последний – с кофеином. Зашло хорошо. Оставляю такой расклад и на следующий старт.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Новый титульный спонсор сумел прогнуть организаторов – буквосочетание «Триколортв» появилось на медалях. Фи.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Впервые бежал марафон в моно-режиме. Слушал себя. Тональность мыслей/настроения чередовалась каждые 5-6 километров. Порадовался, что на последний отрезок дистанции выпал мажор – «смысл есть, бегать нравится, всё хорошо». Как будто бы и не хандрил, получается, вовсе.","listType":"ul","listId":"list-1","level":0},{"kind":"h2","text":"Неделя целиком:"},{"kind":"li","text":"Пн: Отдых, растяжка","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Вт: Легкое СФП","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Ср: 12 км, темп 5:57, пульс 142","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Чт: 10 км, темп 5:41, пульс 148","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Пт: Отдых, растяжка","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Сб: 4 км легко, темп и пульс не мерил","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Вс: 2 км + 42,2 км, темп 5:26, пульc не мерил","listType":"ul","listId":"list-2","level":0},{"kind":"p","text":"Upd. Я не совсем прав. Посмотрел прошлогоднюю медаль – на ней тоже есть титульный спонсор (Ergo). Просто в глаза бросается меньше. Личное. Не знаю, имею ли право такое писать.. Посвящаю этот финиш на Белых Ночах своей бабушке – Коробковой Анне Ивановне. Она была лучшей бабушкой, чем я внуком. Её не стало в среду 05.07.17."}]},{"id":"2017-московский-марафон-2017","title":"Московский Марафон 2017","docTitle":"2017 — Московский Марафон 2017","sourceUrl":"https://ddv-comrades.blogspot.com/2017/09/258-2017.html","categories":["Марафоны"],"date":"2017","place":"Москва","distance":"42,2 км","result":"3:32:06","elevation":"","format":"Личный рекорд; квалификация на Comrades","summary":"Новый марафонский личник и нужная квалификация перед Comrades.","paragraphs":[{"kind":"p","text":"В воскресенье пробежал главный старт года – Московский Марафон. Результат: 03:32:06. Доволен, удовлетворен и рад. Снял с ЛР больше десяти минут, отобрался в C-кластер на Комрадс. Сейчас расскажу что/как."},{"kind":"h2","text":"Про скорость."},{"kind":"p","text":"Думал, что смогу бежать марафон «быстро». Что ветер будет свистеть в ушах от скорости. На самом деле, нет. Бежал по ощущениям средненько и на КАЖДОМ километре мог прибавить и бежать быстрее, но это бы только помешало показать хорошее время на дистанции вцелом. Марафон – это не адреналиновая гонка, а шахматы. Бежишь и оцениваешь, насколько быстро/медленно стоит бежать сейчас, чтобы сохранить приемлемый темп до финиша – не сломаться, не сойти, не перейти на шаг, не провалиться по скорости."},{"kind":"p","text":"Свою партию я сыграл достойно: да, мне было очень тоскливо и трудно бежать с 32 по 40 километр. И думал уже: «Да пофиг на время, дотерпеть бы». Но, по факту, средний темп по пятикилометровым отрезкам почти не колебался: 4:57, 5:00, 5:00, 5:00, 5:01, 5:01, 5:02, 5:03, 5:02. В горки сбавлял и смотрел на пульс, с горок накатывал по ощущениям. Самый медленный километр – 24-й за 5:22. Самый быстрый отрезок – последние 500 метров по 4:18."},{"kind":"h2","text":"Про погоду."},{"kind":"p","text":"В прошлом году было пасмурно и почти без солнца: после марафона по улице шёл в шапке, зато для бега на результат – самое то. В этот раз заранее было известно: «Ни единого облачка, друзья, вам на небе не встретить, а днём ждите +18». Печалился этому прогнозу целую неделю до старта."},{"kind":"p","text":"Непросто. Иногда был хороший ветер, иногда тень от высоток. Но в среднем по трассе – жарко. Перед стартом выбирал: надевать на забег кепку или нет. С одной стороны – неплохо бы защитить лысую голову от прямого солнца и возможных последствий, с другой – рассчитывал на хороший результат, а кепка ему не помощник, т.к. снижает теплоотвод. «Сентябрь – это не июль« – решил бежать без головного убора. Слегка напекло до характерного орозовения кожных покровов, но о решении не пожалел."},{"kind":"h2","text":"Про ощущения."},{"kind":"p","text":"Круто быть готовым, например, на 3:43, а бежать на 3:50 – отрицательный сплит, лёгкость в ногах, хороший уверенный накат на последних километрах, весь забег и финиш с улыбкой. Я так бежал Питер в этом году. И примерно так же Байкал."},{"kind":"p","text":"Бежать близко к пределу текущей формы – совсем другой коленкор. Особенно, на второй половине дистанции. Тут и трудно, и тяжело, и преодоление и мысли «зачем это всё?» – то ещё удовольствие."},{"kind":"p","text":"Приятные ощущения, конечно, тоже есть. Но они точно не про лёгкость. Разве что после такого, как пересёк финишную черту вдруг подумал: «Так вроде нормально же всё. Устал не смертельно, болит не сильно – чего переживал-то?». И ходил вполне ок после, и лестниц не боялся. И сегодня прошелся пешком по эскалатору и вверх, и вниз, ни разу не сказав ничего матом – раньше было по-другому. Росту."},{"kind":"h2","text":"Что дальше."},{"kind":"p","text":"Пару дней на восстановление. Месяц бега по настроению и в охотку, без планов, заданий и целей. А с ноября – активная подготовка, сами знаете, к чему – помним же, как блог называется? )"},{"kind":"p","text":"Пока ожидаю, что это будет продолжение работы над техникой, силовые тренировки и объёмы по горкам. Как будет на самом деле, решит тренер."},{"kind":"h2","text":"Прошедшая неделя:"},{"kind":"p","text":"Пн: Отдых Вт: 12,5 км, темп 5:43, пульс 147 Ср: СФП + растяжка Чт: 11 км, темп 5:52, пульс 145 Пт: 9 км, темп 5:56, пульс 141 Сб: Отдых Вс: 2 км разминка + марафон: 42,2 км, темп 5:01, пульс 164."}]},{"id":"2015-2016-московские-марафоны-2015-2016","title":"Московские Марафоны 2015/2016","docTitle":"2015–2016 — Московские Марафоны 2015/2016","sourceUrl":"https://ddv-comrades.blogspot.com/2017/09/263-20152016.html","categories":["Марафоны"],"date":"2015 / 2016","place":"Москва","distance":"42,2 км × 2","result":"4:22:04 / 3:42:30","elevation":"","format":"Два старта в одной ретроспективе","summary":"От тяжёлого марафона 2015 года к первому уверенно пройденному марафону в 2016-м.","paragraphs":[{"kind":"p","text":"По аналогии с ретроспективной заметкой про Белые Ночи делаю историческую справку о своём участии в двух предыдущих московских марафонах."},{"kind":"h2","text":"ММ 2015."},{"kind":"p","text":"В 2015 году после эпизодических зимних пробежек я регулярно начал бегать с апреля. В августе уже думал, что в хорошей форме, и повторил личный рекорд на половинке – час сорок три. На Московском Марафоне планировал зажечь – пробежать от и до по 5:12 и финишировать из трёх сорока. Как же сильно я ошибся."},{"kind":"p","text":"Бодро начал забег по 5:10, не обращая внимания на самочувствие, рельеф и прочие нюансы. Был уверен, что после темпа 4:53 на половинке для меня не будет проблемой побегать чуть дольше, но на целых 20 секунд с километра медленнее. На пятнадцатом километре у меня совершенно неожиданно закончились силы – сбавил темп. А после 20 километра я уже не мог бежать. Как так?! Болит почти всё тело, а больше всего спина над поясницей. Перешёл на шаг, попробовал бежать, снова на шаг.."},{"kind":"p","text":"Мозг был в шоке от произошедшего, но довольно быстро переключился на решение новых актуальных вопросов: когда и как сойти с дистанции? Что сказать друзьям? Есть ли шанс дотерпеть до финиша и уложиться в лимит? Что вообще случилось?"},{"kind":"p","text":"По ходу дистанции ответы нашел такие: моя беда – это внезапный таинственный вирус. А разница для внешнего мира между 4:30 и 3:40 не так велика как моё нежелание рассказывать, почему я не смог - решил терпеть. Еле-бег, шаг, еле-бег, шаг. Все меня обгоняют – мужчины, женщины, дети, толстяки. Но я терплю и продвигаюсь кое-как по трассе."},{"kind":"p","text":"За пять километров до финиша поболтал немного с таким же бедолагой, но последние полтора километра всё же бежал. Результат отстал от плана на сорок с лишним минут – 4:22. Пару лет назад на одной ноге в Питере и то пробежал быстрее. Всё болит и самочувствие так себе."},{"kind":"p","text":"Таинственного вируса, конечно же, никакого не было. Всё куда прозаичнее:"},{"kind":"li","text":"Плохо был готов и бегал мало длинных.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"После последней длинной не успел нормально восстановиться.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Зря ориентировался на темп половинки. Она была в пасмурные +14, марафон в солнечные +20. Выбрал неправильный темп со старта и со всеми вытекающими закислился уже к пятнадцатому километру.","listType":"ul","listId":"list-1","level":0},{"kind":"p","text":"После финиша в сердцах пообещал себе никогда больше не бегать марафоны. А через неделю снова начал тренироваться – надо закрыть гештальт и пробежать уже по-человечески."},{"kind":"h2","text":"ММ 2016."},{"kind":"p","text":"Предыдущая неудача подстегнула меня тренироваться серьезнее. Впервые бегал всю зиму - набирал объёмы. С весны начал занятия в группе и тренировки по персональному плану от тренера (Дмитрия Сергеева). В июле добрался до финиша на марафоне в Питере в +31, а в августе снял две минуты с ЛР на музыкальном полумарафоне. К старту готов."},{"kind":"p","text":"Прошлых ошибок удалось избежать: отбегал чуть больше длинных, выделил время восстановиться, события на дистанции не форсировал. Более того, умерил пыл и поставил более скромную цель – выбежать из трёх сорока пяти. Погода в этот раз тоже была на моей стороне: облачные плюс двенадцать."},{"kind":"p","text":"Забег получился моим первым марафоном без драмы. До пятнадцатого километра дисциплинированно придерживал себя, справедливо полагая, что силы понадобятся позже. До тридцатого километра сохранялось ощущение, что могу в любой момент прибавить. После, конечно, уже начала накатывать усталость. Но это была усталость подготовленного атлета – её можно было терпеть на ногах, не снижая темпа. Первой и единственной неприятностью на дистанции стал подарок от ФСО: часы взбесились при втором пробеге мимо кремлёвских стен, и в районе 35 километра я остался без телеметрии."},{"kind":"p","text":"Терпеть на финишных километрах всё же пришлось. Но впервые за три марафона я терпел не вообще, а только для того, чтобы не сбавлять темп. Вопрос \"добегу или нет\" не стоял. По доброй традиции накатил 100 метров на финише, а вечером получил СМС от организаторов про достойные 3:42:30 – на две с половиной минуты быстрее плана."},{"kind":"p","text":"Московский Марафон 2016 стал моим первым настоящим: из четырех часов, без страданий, без перехода на шаг."},{"kind":"p","text":"С нетерпением жду третьего старта на \"домашней трассе\". Переживаю за погоду, говорят, что будет не по-осеннему тепло – не лучший расклад для рекордов."}]},{"id":"2013-2016-белые-ночи-2013-2016","title":"Белые Ночи 2013/2016","docTitle":"2013–2016 — Белые Ночи 2013/2016","sourceUrl":"https://ddv-comrades.blogspot.com/2017/07/341-20132016.html","categories":["Марафоны"],"date":"2013 / 2016","place":"Санкт-Петербург","distance":"42,2 км × 2","result":"4:10:39 / 4:22:19","elevation":"","format":"Два старта в одной заметке; первый марафон","summary":"Первый марафон и возвращение на «Белые Ночи» три года спустя.","paragraphs":[{"kind":"p","text":"А вот и обещанная заметка. Санкт-Петербург – город очень уютный в своих помещениях и суровый на улицах. В первые юношеские визиты в этот край я неизбежно промерзал и промокал, независимо от сезона – зимой, летом и осенью. А последние два выезда, уже в зрелой жизни, вместо потенциальных простуд радовали реальными солнечными ожогами – эй Питер, ты чего? )"},{"kind":"p","text":"Тем не менее, люблю этот город и частенько в него возвращаюсь. И именно в Питере я официально примкнул к марафонскому движению, отметившись в финишном протоколе: Белые Ночи 2013 – мои первые сорок два километра."},{"kind":"h2","text":"Белые Ночи, заход один."},{"kind":"p","text":"Гонка не случилась особо удачной, а текст подбадривающей утренней СМС от I Love Running'а стал для меня негласным девизом мероприятия. Харуки Мураками с экрана телефона по просьбе Максима Журилы информировал: «Боль неизбежна, страдания – личный выбор каждого»."},{"kind":"p","text":"С точностью до деталей, ожидающие меня трудности можно было предсказать: от неуверенной десятки к марафону я готовился всего четырнадцать недель. В первой марафонской группе ILR (привет, Спарта) под руководством Саши Чебуркина я научился терпеть, пахать и любить жизнь. А правильно бегать и не делать глупостей – нет. За две недели до забега сильно заболело колено: уменьшил объёмы последних тренировок, перешёл с Трейни на Кайаны, а бежать марафон не передумал."},{"kind":"p","text":"Забег начался бодро. Бежал с товарищем, и вместе с ним на третьем километре пристроились за прекрасными спинами милых девушек, штамповавших километры по 5:15 – наш плановый темп. Всё в кайф. На девятом километре заболело травмированное колено. На тринадцатом его стрельнуло так, что чуть не упал. На 20-м нога заболела адски, бежать по пять с четвертью больше не мог. Отпустил товарища и спутниц вперёд, а сам приступил к чередованию бега в темпе по 6-7 минут с эпизодической ходьбой и проклятьями. В успех мероприятия уже не верил и сошёл бы после 25-ого километра, если бы не друзья, ожидающие на тридцатом. Решил, что до группы поддержки дотерплю и сойду там. На 29-м был пункт питания, который взбодрил колой на пару километров – пробежав на глюкозном подъеме мимо своих собственных «Дима давай!», решил, что шанс сойти упущен и теперь мне предстоит протерпеть до конца."},{"kind":"p","text":"Нога почти не сгибалась. Про «выбор каждого» уже не помнил и от всей души страдал, как только умею. Страдал, но терпел. В районе 35-37 километра несколько раз падал, понимая, что случится беда, если напрягу больную ногу, позволив ей принять вес тела. Вставал, осторожно шёл, потихоньку начинал снова бежать. Ну, в общем, блин.. не знал, что у меня есть такой запас воли."},{"kind":"p","text":"Финишная прямая на Белых Ночах – любимее мной, чем любая другая. Ни живой, ни мёртвый выбежал из-за поворота и увидел широкий двухсотметровый коридор к финишной арке. Услышал своё имя и крики поддержки. С одной негнущейся ногой на адреналине дал финишный спринт, влетел в арку, получил медаль, растерялся отсутствию какой бы то ни было эйфории и вот так люто впервые преодолел марафонскую дистанция – 4 часа 10 минут. Далеко не самый медленный из пятёрки сделанных мною к настоящему моменту марафонов."},{"kind":"p","text":"Следующим утром в своей постели в Москве проснулся от боли в ноге, которая мешала перевернуться с бока на бок. Встать с кровати тоже не получилось с первой попытки. В квартире один, страшно. Кое-как, опираясь на стул как на ходунки, добрался до кухни и приложил лёд к колену. Дальше был визит в травмпункт, пожизненный запрет бегать и рекомендация ходить до глубокой старости исключительно в коленном супорте, МРТ, полгода нерегулярных пробежек с болью после седьмого километра, осознание того, что не смогу не бегать, ортопед по рекомендации и, наконец, деятельное желание озаботиться техникой бега – всё это уже совсем другая история )"},{"kind":"h2","text":"Белые Ночи, заход два."},{"kind":"p","text":"Прошло три года. К Белым Ночам 2016 я был готов значительно лучше. За спиной почти полтора года непрерывных занятий, личные рекорды на половинках, финиш марафона в Москве. Благодаря Филиппу Носову и Дмитрию Серегееву, я уже умел бегать, не втыкаясь ногой в асфальт на каждом шаге. Марафон за четыре часа (целевое время) рассматривал не как вызов, а как особый вид награждаемой медалью сверх-длинной тренировки в доброй компании нескольких тысяч бегунов."},{"kind":"p","text":"Не тут-то было. Оказывается в Санкт-Петербурге бывает солнечно и жарко. Этот единственный день в 2016 году совпал с датой проведения марафона. Солнце грело Питерские камни и воздух: плюс тридцать один, безоблачно, безветренно, пекло. Бежать тяжело. Половинку преодолел, слегка не уложившись в 120 минут. После двадцать пятого километра начал чередовать бег и ходьбу, подзабив на изначальный план. В попытках охладиться сумел перепить воды и, по ощущениям, превратился в человека-медузу, у которого лишние литры жидкости плескаются в полостях под кожей. Добежал. Результат не из тех, которыми хочется хвастаться – 4:22. «Ну и ладно» – решил я, проявив не свойственную себе мудрость. На шаг переходили даже ребята, которые обычно бегают в районе трёх. А добрую сотню атлетов с трассы увезли на скорой – можно сказать, легко отделался."},{"kind":"p","text":"Как уже сказал, люблю этот город и этот старт. Футболка с 2013 года – моя фартовая, одеваю её на все забеги, где цвет официальной одежды не синий. В этом году рассчитываю таки пробежать за четыре часа и привезти из Питера еще одну медаль, но уже без драматичной истории в комплекте. Разумеется, поделюсь впечатлениями и чего как."}]}]</script>
