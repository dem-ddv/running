 то, что Дагестан я, разумеется, планировал бежать вполсилы, чтобы не устать и не потратить форму перед основным стартом. Вот и расскажу, что из этого получилось."},{"kind":"h2","text":"Dagestan Wild Trail"},{"kind":"p","text":"(50 км, 3100 набора) Сама поездка – потрясающая. Благодаря удачному стечению обстоятельств и людей, выезд в Махачкалу получился эмоциональным, ярким и насыщенным. Ура! Всё кроме гонки прошло в исключительно позитивном ключе."},{"kind":"p","text":"И сама гонка тоже, один только нюанс – половины моих сил оказалось недостаточно, чтобы справиться с дистанцией. До финиша добрался, но и силушку потратил, и притомился, и ноги подзабил."},{"kind":"p","text":"Что рассказать о старте?"},{"kind":"li","text":"Бежал в компании товарищей – Лёши и Юли, и, тем самым, реализовал важную для себя составляющую любых доступных удовольствий – социальную. Здорово, когда есть, с кем разделить эмоции, обменяться впечатлениями, о ком проявить заботу и от кого получить поддержку. И так гораздо проще не застревать в собственных мыслях, которые, в моём случае, обычно не помогают преодолевать трудности.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Наивно было ожидать хорошей формы к горному трейлу за счёт одних лишь плоских кроссов. Первая же горка – набор 1500 метров на 6 километров дистанции показала, насколько глуп был план – взбираясь на неё, я уже мысленно продавал билеты в Новороссийск.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Кавказские горы прекрасны! Виды - потрясающи! Рад, что удавалось выныривать из дум про сложность и тяжесть забега, видеть это всё и восхищаться.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Стал увереннее чувствовать себя на сложных спусках. Даже вторая в моей жизни реинкарнация «спуска в ад» – длинного, крутого, через лес по сыпучей поверхности сброса высоты не вызвала очень уж сильных негативных эмоций. А в прошлый раз… думаю, понятно по взятому в кавычки прозвищу для такого типа участков трассы.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Сильный, почти шквальный, ветер сопровождал нас большую часть дистанции – переставлял с тропы, мешал говорить, швырял песок в глаза, похитил пару головных уборов и набегающим потоком вдувал сопли обратно вглубь головы. Но особо не холодил – и на том спасибо.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Пожалел, что не взял на гонку гамаши. Почти на каждом пункте питания приходилось тратить дополнительные 2-3 минуты на вытряхивание камней из кроссовок – хорошей урок к следующему старту.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Несмотря на все сложности, к финишу осталось прилично энергии – эффектно вбежал под арку на скорости в районе 4:20 на километр. Итоговое время – 10 часов 38 минут, вместо плановых 12-13 часов. Возможно, именно этих дополнительных полутора часов на дистанции не хватило для того, чтобы после неё не болели ноги. Но это трейл – тут непривычно и сложно дозировать нагрузку. Имеем, что имеем.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Фото с забега от Sport-Images – лучшие за все 8 лет моего участия в беговых любительских стартах! Если бы я бегал до первого удачного фото-сета, то закончил бы в день оплаты пакета фотографий на сайте – этот гештальт теперь закрыт.","listType":"ol","listId":"list-1","level":0},{"kind":"p","text":"По факту, это мой третий трейловый забег в жизни и второй горный – особо не с чем сравнивать. Но на субъективную оценку имею же право: я в восторге от проделанной организаторами работы, трассы и всего мероприятия в целом. Highly recommend."},{"kind":"p","text":"Единственное «но» – Махачкала. В городе можно очень вкусно поесть и, на мой вкус, особо больше нечем заняться. Местная культура для травоядного меня кажется агрессивной: нас не обижали, но автоматчики на улицах, импульсивная манера вождения и серьёзные лица местных жителей не добавляли уюта. Товарищи перед стартом на день-два ездили на экскурсии по окрестным горам и остались очень довольны – возможно, это хорошее решение."},{"kind":"h2","text":"Между горами и горами"},{"kind":"p","text":"За два с половиной дня в Москве успел разобрать и собрать заново почти точно такой же чемодан, купить кепку вместо унесённой ветром, позаниматься бытовухой и попробовать восстановиться."},{"kind":"p","text":"В понедельник вечером ходил по лестнице как после первого марафона – еле-еле. Во вторник сделал первую восстановительную пробежку через боль в квадрицепсах. Весь вторник и среду катал ролл, пил разную реабилитационную химию и гадал, отпустит ли ноги до субботы."},{"kind":"p","text":"Во время пятничной пробежки-разминки по набережной в Новороссийске бёдра ещё побаливали, но ноги слушались и двигались вполне себе."},{"kind":"p","text":"Организаторы Маркотха три дня подряд рапортовали о дождях и каждый вечер обновляли трек трассы, придумывая обходы совсем уж непроходимых грязевых ванн. Было волнительно."},{"kind":"p","text":"Но пока пил кофе перед походом на экспо почувствовал – всё получится. Просто не будет, но получится. И цель моя – не добраться до финиша в лимит из последних сил, а получить удовольствие от приключения, которое я сам для себя выбрал. И хорошо стало внутри – фиг с ней, с грязью."},{"kind":"h2","text":"Маркоткх"},{"kind":"p","text":"(104 километра, 5600 набора) Этот забег я ждал и предвкушал полтора года. А самое важное решение о нём принял буквально накануне – держать фокус на «получать удовольствие» как первый приоритет на всю дистанцию. Два следующих: уложиться в лимит и «жив/здоров» на финише."},{"kind":"p","text":"Справился: даже в самые трудные моменты гонки гундёж уставшего мозга существовал лишь в дополнении к удовольствию от процесса, а не вместо него – это ли не прорыв? Всякие пикантные мелочи про то, как проходил забег ниже."},{"kind":"h3","text":"Про гонку:"},{"kind":"li","text":"Первая фишка забега: старт гонки в середине дня – впервые выспался перед чем-то длинно-беговым и собрался без утренней спешки.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Buddy на весь выезд в Новороссийск и саму гонку – Миша Крючкин. Мы отличная команда: успели на двоих сообразить Comrades, ICON и недавний зимний трейл в Никола-Ленивце. У нас близкая беговая форма, можем долго чувствовать себя комфортно в обществе друг друга, есть ощущения взаимной надёжности и поддержки. А ещё удачно дополняем друг друга в групповой страховке от косяков, которые по одному, допускали бы с избытком. Например, за гонку каждый из нас успел по 2-3 раза вернуть наш тандем на трассу – Миша по треку на часах, я – глазасто выхватывая в пространстве разметочные ленты.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"С первых километров дистанции отметил, что очень красивые горы Дагестана в моей личной иерархии прекрасного сильно уступают очень красивым горам Краснодарского края. Да, Маркотх ниже. Но он живой! Земляные тропы, трава, деревья, лес! Всё это даёт более добрую, что ли, и ценную для меня горную энергию, чем могучие вековые и породистые, но сухие скалы Дагестана.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"ГРЯЗЬ. Очень много грязи. Субъективно: более половины всей дистанции – небеговые для меня отрезки из-за грязи и плохо подобранной обуви. Ноги тонули, скользили, разъезжались или просто прилипали к поверхности, рискуя то и дело оставить меня без кроссовки.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Первая половина дистанции: четыре подъёма по 700 метров набора и три с половиной таких же спуска. Перед каждой новой горкой – пункт питания: отметиться, что живой, долить воды во фляги и пропустить полстакана колы. В горки – бодрым шагом, спуски, если не очень грязно – бегом.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"До темноты, за первые пять часов, мы справились с четвертью дистанции – два подъёма, два спуска. Средний темп чуть из 12 минут на километр – как будто бы даже успеем финишировать за 21 час, прилично обогнав лимит. Аппроксимировать, конечно, суточную гонку таким образом было рановато.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Бег ночью. Застать несколько послезакатных часов перед скорым финишем и полноценная ночь на ногах – разные штуки. Десять часов в темноте, перед которыми уже что-то было и после которых ещё бежать и бежать – новый для меня опыт. Первые ночные часы зашли так себе – долгий подъём по утопленной в склоне и лесу грязевой тропе. Темнота заметно усложнила жизнь и чувствовалось, насколько быстрее приходит утомление и тяжелее даются шаги.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Когда ночью оказывались под открытом небом, уровень психологического дискомфорта и напряжения ослабевал. Становилось «ну ок». А вид с вершин на огни городов по другую сторону залива – отдельное визуальное наслаждение. Но крутые спуски в темноте особо не побегаешь – в узком пучке света от фонаря нервная система выхватывала намного меньше информации о том, куда и как ставить ноги, если «план А» для каждого конкретного шага по какой-то причине не состоится.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Средний темп ночью упал, а после 50 километра трасса перестала быть предсказуемой и понятной: сколько и каких горок осталось, когда они будут, как быстро будут набираться километры – всё сюрприз, всё «как будет, так будет». Шли уверенно, время от времени догоняли кого-то из участников. Один раз даже вернули ультра-коллег на разметку.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Отдельная песня – броды! Их было прямо вдоволь – бросили считать после восьмого, а это была точно даже не треть. Никаких негативных эмоций, связанных с ними. Напротив, приятно было остудить и сполоснуть ноги в чистой проточной воде и хотя бы временно подсмыть с них комья налипшей грязи. Небольшие мозоли на ногах есть, но точно меньше, чем можно было бы ожидать после 20 часов бега в мокрых носках и обуви.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"После 65 километра трасса уходила на тридцати пяти километровый круг – побегать в районе двух Лысых гор и Неберджаевского водохранилища, чтобы вернуться в эту же точку и бежать к финишу. Этот круг – приключение внутри приключения, про которое можно написать отдельную заметку не меньше этой всей. Я настолько подробно этого делать не буду, но большая часть следующих тезисов – примерно про этот участок трассы.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"У Миши с сорокового километра после ночных спусков начало по нарастающей болеть колено. Не помню, когда я впервые почувствовал дискомфорт, перерастающий в боль при сбросе высоты, в правой надкостнице, но общий результат этих двух травм такой: после 75 километра мы оба не могли бегать спуски с крутым градиентом или по нестабильной (камни и/или грязь) поверхности. А проходить их пешком стало большим преодолением, чем подъёмы в горку любой крутости.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Тяжело психологически далась последняя четверть дистанции. После рассвета часы показали, что осталось совсем ничего – 25-30 километров. И мы точно в лимите, с запасом. И вроде бы ничего не остановит уже. Но таааааак медленно менялись цифры пробега на часах. Кажется, что идёшь вечность, а к счётчику добавляются всего несколько сотен метров. И всё как мы не любим – либо грязь, либо теперь небеговые для нас мучительные спуски. Были и приятные относительно несложные карабканья в горку, пункт питания с весёлыми ребятами из МЧС и даже 4-5 километров для побегать – но запомнились на этом отрезке не они.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"На последнем пункте питания волонтёр нас подбодрил и уверенно пообещал: «впереди всего один небольшой подъём и всё – финиш». Мы с радостью двинулись на этот пупырь, ожидая после него плотно-грунтовый серпантинный спуск, по которому красиво сможем сбежать 15 километров к финишу. Всё было не так: пупков, горок и гор было ещё полтора десятка. А хуже всего – какой-то бесконечный зигзаг между ними: долгая дорога вдоль обрыва. Сама дорога – сплошная глубокая грязевая канава, между ней и обрывом – грязевой борт шириной 20-40 сантиметров, по которому и надо было идти – так себе уют. Казалось, что мы идём по кругу. Километры дистанции мучительно медленно, но прирастали, а развилки к финишу всё не было. Где же наш набег? Казалось, что так по этой грязи мы и попадём на финиш в Парк имени Ленинского Комсомола вылезя у финишной арки из канализационного коллектора.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"«Последний подъём» – стало нашим третьим главным мемом дистанции. За последние три часа перед финишем, мы видели «Последний подъём (2)», «Последний подъём upd», «Последний подъём финал», «Самый последний подъём» и «Вот этот точно последний, за ним честно финиш». Ох уж этот волонтёр оптимист. Но больше всего эмоций доставила самая последняя горочка – вообще вау. Сейчас расскажу.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"За ожидаемые 4-5 километров до конца дистанции грязь наконец-то закончилась. Закончились горки. К финишу вёл равнонелюбимый нами затяжной каменистый спуск, который мы медленно страдали, пока мимо нас озорно проносились участники забега на 23 километра. Часы показывали 104 километра и 22 часа 58 минут с начала дистанции. Спуск почти подошёл к нулевой отметке у моря – вот-вот финиш… но нет. Вместо него – вертикальная стена подъёма! Как?! Это было очень похоже на плохую шутку. Мы не поверили. Сначала думали, что нам не туда – но на стене была разметка. Потом думали, что туда не нам – но другой дороги не было. Сил мало, ног – нет. Успеем ли мы за час до лимита подняться на ещё одну гору и спуститься с неё? Торговаться не стали – без вариантов. Включили режим спортивной ярости и залетели в подъём минут за семь – да выглядит страшно, но фактический набор оказался всего в сотню метров – тьфу, а не горка. Спуск, правда, нам опять не понравился, и я даже успел на нём заземлиться в грязь.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"После предфинишного сюрприза от организаторов мы оказались наконец-то на нормальной дороге в 700 метрах от заветной арки. Сложили палки и пробежали по 5:30 эти самые метры за исключением последней сотни – перед ленточкой, как обычно, блеснули остатками сноровки и жизнерадостности.","listType":"ol","listId":"list-2","level":0},{"kind":"h3","text":"Главные мемы Марктотха:"},{"kind":"li","text":"«Зато грязь не липнет». Организаторы, с отсылкой на дожди, советовали использовать трейловые кроссовки с высоким протектором, которых у меня нет. На пятничной разминке наш новый знакомый Максим Поляков (второе место на дистанции 104, финиш за 14 часов 40 минут) снисходительно посмотрев на мои Gel-FujiTrabuco, не стал нагнетать волнения и добродушно прокомментировал именно этой фразой. Много раз мы вспоминали её по ходу дистанции – бежалось как-то не очень, зато грязи действительно налипало немного.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"«Северный склон». С предстартового брифинга Миша запомнил следующее: «Южные склоны более-менее подсохли, а северные нет – будет грязно». Каждый раз выходя на очередной грязный участок, мы моментально нарекали его северным, независимо от реального географического положения дел.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"«Последняя горка». Про этот феномен уже написал выше. В отличие от предыдущих, он, кажется, был популярным не только в нашей мини-команде.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"Куртка! Я почти уверен, что нашёл ветровку, которую оставил на Маркотхских склонах в 2019. Точно такая же была на очень чудесном волонтёрском лидере Ане и, с её слов, была когда-то подарена бывшим парнем. Очень смешно. Впрочем, мало ли в жизни совпадений. И даже если это не одно из них – Ане она идёт больше :-).","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"«Общий пульс». Да-да, у нас снова, третий раз, был один пульсометр на двоих. Ну и что? В этот раз мы этой шуткой почти не пользовались.","listType":"ol","listId":"list-3","level":0},{"kind":"h3","text":"Основное про первые 100+:"},{"kind":"li","text":"Справились с запасом. 23 часа 19 минут бега – ну да. И это, как ни странно, не предел возможного и не бег из последних сил – мы не закончились на финише, не вырубились от усталости в раздевалке. Думаю, что если бы удачнее подобрали обувь или не настучали ноги на спусках, то даже в текущей форме смогли бы пробежать дистанцию на час-полтора быстрее.","listType":"ol","listId":"list-4","level":0},{"kind":"li","text":"Основные местоимения в заметке – первое лицо, множественное число: «мы», «нам», «нас». Несмотря на то, что каждый бежал своими ногами, это была командная работа и, кажется, во многом общие впечатления. Думаю, поэтому Миша и делится с удовольствием ссылками на этот бложе – почти ж своё.","listType":"ol","listId":"list-4","level":0},{"kind":"li","text":"Для меня в ультра беге сложны не подъёмы, спуски, броды или грязь. Самый большой дискомфорт – когда мысленно уже справился с задачей, и из-за накопленной усталости и/или технических проблем перестаёт быть интересно то, что происходит прямо сейчас. Вот с чем надо уметь работать.","listType":"ol","listId":"list-4","level":0},{"kind":"li","text":"Экипировка – решает. Хорошо подобранная форма, удобные жилет и пояс, палки, гамаши – всё очень сильно облегчило прохождение дистанции. Единственный продолб – кроссовки с низким протектором «зато грязь не липнет». Но странно было бы при максимум десятке трейловых пробежек за жизнь иметь для таких дистанций больше одной пары обуви. Теперь, кстати, ноль пар обуви – ровно по Дагестан с Маркотхом кроссовок и хватило – в Москву обратно они не полетели.","listType":"ol","listId":"list-4","level":0},{"kind":"li","text":"Благодарность от Маркотхского выезда поездке в Дагестан за управление ожиданиями относительно моих способностей забегать в горы и напоминание о гамашах. Из-за DWT я, конечно, немного потерял в физической свежести, зато подготовился психологически и экипировочно. Та самая мысль «получай удовольствие» – вывод из пост-дагестанской рефлексии.","listType":"ol","listId":"list-4","level":0},{"kind":"li","text":"Очень ценю вклад друзей и комьюнити в то, как прошла эта неделя. Поддерживали, поздравляли, советовали, переживали, слушали, следили за гонкой и приятно восхищались. Не говорю уже про доставку «гуманитарной химической помощи», благодаря которой я бежал Маркотх как отдельное соревнование, а не второй этап многодневки на деревянных ногах.","listType":"ol","listId":"list-4","level":0},{"kind":"li","text":"Артём Долгополов, Аня Юрина, Лёша Попов и вся команда организиторов/волонтёров – супер ТОП. Ребята в сложных условиях подготовили и провели классный, душевный и красивый старт. Судя по всему, они не только позволили нам с удовольствием упороться на дистанции, но и сами занимались примерно тем же самым не в меньшей степени, но с большей ответственностью. Спасибо им за это!","listType":"ol","listId":"list-4","level":0},{"kind":"li","text":"На утро вторника ноги чувствуют себя более-менее. Немного угрожающе опухли стопы и лодыжки, особенно правый комплект, но каких-либо острых болевых сигналов нет. После Дагестана ноги-боги выглядели лучше, но болели. Любопытно. Понаблюдаю.","listType":"ol","listId":"list-4","level":0},{"kind":"h2","text":"Вместо заключения"},{"kind":"p","text":"На протяжении полугода планы на эту апрельскую неделю казались мне чем-то грандиозным и эпичным. А сегодня, спустя пару дней после их воплощения – «новости прошлой недели». Ну сделал, и сделал."},{"kind":"p","text":"Хочется верить, что после небольшого отдыха это приключение всё же займёт уютное и почётное место на психологической полочке с личными достижениями и значимыми поводами для обоснованной и полной скромного достоинства гордости."},{"kind":"p","text":"Спасибо всем, кто участвовал, следил или просто дочитал эту заметку до конца – тоже своеобразный ультрамарафон в мире инстраграма и твитера 🙂."}]},{"id":"2021-100-миль-зеленое-кольцо-москвы","title":"100 миль: Зелёное Кольцо Москвы","docTitle":"2021 — 100 миль: Зелёное Кольцо Москвы","sourceUrl":"https://ddv-comrades.blogspot.com/2021/06/100.html","categories":["Ультра","Приключения"],"date":"2021","place":"Москва","distance":"162 км","result":"21:56:09","elevation":"","format":"100 миль; городской маршрут","summary":"Первые 100 миль — длинное приключение по Зелёному кольцу Москвы.","paragraphs":[{"kind":"p","text":"Пробежал Зелёное Кольцо Москвы: круг в 162 километра через парки и набережные Москвы. Планировал уложиться в сутки, справился за 22 часа."},{"kind":"h2","text":"Четыре ответа на вопрос «Почему?»"},{"kind":"li","text":"Это красиво. Имею в виду то, как выглядит трек на карте в Гармине или Страве. Есть и ещё две красоты: круглая цифра «100 миль» и сами беговые виды на культурные отреставрированные парки, почти дикие городские леса и извилистые набережные.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Потому, что могу. Апрельский Маркотх показал, что сейчас мне по силам бегать сутки. Да, тут расстояние побольше и темп должен быть повыше, но и набора высоты в 6000 метров нет, и грязевые ванны не ожидались. Если не сейчас, то когда? И как проверю «а могу ли?», если не попробую?","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Перфоманс. Иногда хочется быть молодцом, героем, интересным человеком и ассоциироваться с чем-то выдающимся. Звучит как будто бы несерьёзно и по-детски. Но так устроен человек – каждому иногда хочется быть объектом заслуженного внимания и чувствовать себя особенным. Я не могу пробежать марафон за 2:20. Но кое-что другое могу – почему бы скромно и экологично не почесать себе ЧСВ и эго.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Ачивка/гештальт. Сначала был марафон, потом марафон по льду Байкала, потом back to back из ЮАР, потом марафон в Европе, потом горная ультра 100+. Зелёное Кольцо Москвы – оставалось последним нереализованным беговым приключением среди манивших меня квадратиков в воображаемом списке чекбоксов. Теперь готово, все галочки на месте.","listType":"ol","listId":"list-1","level":0},{"kind":"h2","text":"Что есть рассказать про пробежку"},{"kind":"h3","text":"План"},{"kind":"p","text":"Для старта выбрал начало июня: длинный световой день и не очень жарко. Цель – пробежать стомильный круг, уложившись в 24 часа."},{"kind":"p","text":"Бежать планировал от места сбора Измайлонга против часовой стрелки: чтобы без такси к старту/финишу, чтобы завершающий этап по знакомому и родному Измайловскому парку, чтобы встретить на финише своих ребят и, вероятно, пробежать вместе с ними последние километры дистанции."},{"kind":"h3","text":"Погода"},{"kind":"p","text":"На первой четверти дистанции показалось, что с погодой не повезло. На весь день обещали солнечные плюс двадцать три. К двум часам дня жара сильно поубавила оптимизма и осложнила жизнь – грустил и таял. Но в небесной канцелярии сжалились: во второй половине дня небо заволокло спасительными облаками – взгляд на ближайшее собственное будущее снова стал более жизнерадостным и позитивным."},{"kind":"h3","text":"Команда"},{"kind":"p","text":"Собрать компанию на весь сто шестидесяти километровый круг в разгар бегового сезона – не самая простая задача. Я и не пытался. Зато мне очень помогли ребята на разных участках:"},{"kind":"li","text":"Стартовали вчетвером: мотивирующая и энергичная Оля составила компанию на первые четыре с небольшим часа, неудержимый и невероятный Саша вместе с обучаемой им езде на новом велосипеде Алёной – на первые 52 километра. Бежали бодро, общались. Километры в компании пролетали незаметно. Саша ещё и навигировал – не без микро-косяков но уверенно вёл по маршруту и позволил моей голове не включаться в забег почти треть дистанции.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"С 66 по 84 километр меня на самокате сопровождал Тимур. Передал заброску с гелями и водой, забрал крем от солнца и очки, развлекал беседой и помог преодолеть первый кризис, который пришёлся как раз на шестидесятые. И поддержал будь здоров, и поделился субботними новостями сообщества.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"В очень нужный момент после, пожалуй, самых сложных участков трассы на 106 километре пункт освежения организовал Айрат. Там было всё: несколько вариантов еды, место поспать, вода, кола, морс, перкуссионный пистолет и сам Айрат – заряженный и готовый помочь вообще любыми существующими способами. Спать и массироваться я не стал – а побежал бы после? Вода и кола были очень в тему. Да и само ощущение участия и поддержки добавило сил и деятельного намерения добраться до финиша.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Серёжа встретил меня на 135 километре и сопроводил бегом до 156. Во многом благодаря ему у меня получилось вместо предфинишной хандры в режиме еле-бега прилично поднять средний темп и даже вполне себе бодро побегать роскошный трейловый кросс по дикой части Кузьминского парка. Кажется, что без такого эскорта я бы финишировал позже на час. Если бы финишировал, конечно – не так-то много вариантов добыть себе воды в четыре утра в Котельниках.","listType":"ul","listId":"list-2","level":0},{"kind":"p","text":"Итого, мне было с кем поговорить и пошерить ощущения на протяжении 90 из 162 километров дистанции – больше половины. Спасибо! И на будущее: лучший вариант сопровождения – беговой. Часть участков почти не проходимы для роликов, самокатов и велосипедов. Хотя проезжают же кольцо как-то на велосипеде целиком…"},{"kind":"h3","text":"Темп"},{"kind":"p","text":"Средний целевой – девять минут на километр. Думал, что буду бежать примерно по семь минут и раз в 5-7 километров на пару минут переходить на шаг. А там ещё и остановки на покупки, и прочее – так девять минут и получится."},{"kind":"p","text":"Получилось близко, но не так. Засекал средний темп марафонами. Раскладка по темпу получилась такая:"},{"kind":"li","text":"Первые 42,2 километра. Средний темп 7:22 мин/км. На шаг переходил в конце каждого часа на 3-5 минут и в середине часа на минуту. Остановка была только одна минут на 7-8. Когда бежал, то бежал слегка из семи. Значительно быстрее плана получилось, хоть и по жаре. Видимо, на свежести.","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Второй марафон – средний темп 7:59. Было уже 2-3 остановки, одна из – минут на 10-12. Было прилично горок, в которые заходил пешком. Регулярные переходы на шаг примерно в том же ритме, что и раньше.","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Третий марафон – средний темп 8:53. Много сложностей с ночной навигацией, много пешеходных горок в Битцевском парке, очень трейловый в целом отрезок, покупки во Вкусвилле, усталость и длинный качественный пит-стоп с Айратом. Одна радость – самый прохладный этап их всех, хоть с погодой не надо бороться.","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Последние 35 километров – средний темп 8:07. Почти все участки этапа, по сравнению с предыдущим, вполне беговые. Пешком только несколько горок, мосты/переходы и когда надо было передохнуть. Плюс беговое сопровождение помогло раскрутить моторчик – километров 5-6 в дикой части Кузьминского парка бежали даже в районе шести минут – неплохо, да?","listType":"ul","listId":"list-3","level":0},{"kind":"p","text":"На последних 15-20 километрах было и тяжело, и неожиданно началась битва за результат: захотелось не просто с каким-то там точно существующим запасом уложиться в сутки, а уверенно успеть к финишу именно до 08:25, чтобы поздороваться с товарищами и попасть на групповое фото Измайлонга. После нескольких сложным километров на выходе из Кузьминского парка мы с Серёжей поймали ритм, в котором не быстро могли бежать не останавливаясь и не переходя на шаг. Это очень сильно помогло переместиться в пространстве между 20 и 5 километрами до финиша. А дальше, всё понятно, успевал хоть пешком – отпустило."},{"kind":"h3","text":"Про маршрут"},{"kind":"li","text":"Много уютно и красиво оформленных культурных парковых зон, набережных и бульваров – приятное глазу сочетание природы, скамеек, мостиков, беседок, навесов, декоративного освещения, деревянных дорожек и прочих чудес заботливой урбанистики. Когда бежал, не фиксировал в голове конкретные места и названия: ну Черкизовский, ну Филёвский… мест, которые приятно удивили и куда бы с удовольствием пришёл погулять – не меньше десятка.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Диких зелёных пятен, оказывается, в черте города тоже хватает. Узкие тропки, живые не каменные берега речушек и озёр. Есть где погулять и любителю как будто бы нетронутой природы.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Много надземных и подземных переходов через шоссе и железные дороги. Светофоров тоже хватает. Есть не очень эстетичные участки – промзоны. Не то, чтобы прямо сильно мешает, но было бы здорово сделать этот маршрут что-то типа «почти официальным», сократить количество препятствий, а вместо них добавить навигацию и фонтанчики с питьевой водой.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"В Тропарёво ночью бегать опасненько из-за того, что пару лет назад делало парк уютным днём. Очень много провалов и дырок в деревянных надземных дорожках, по которым проходит маршрут. Чувствовал, что играю в Subway Surfer за главного героя: влево, влево, вправо, прыжок.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"В парке на Тёплом Стане и Битцевском ночью тоже не торт. Классная для бега и, наверняка, живописная при дневном свете часть маршрута, ночью доставляет хлопот. Десятки раз спотыкался о корни или проваливался стопой в небольшие ямы. Ноги уцелели чудом. Да и в целом, ночью в лесу темно и не слишком комфортно одному.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"В какую-то неприглядную жесть завели меня часы около улицы Подольских Курсантов: едва заметная среди неприятно высокой травы тропа провела меня через заброшенный лагерь беглых цыган (машины, туалетные кабинки, какие-то фургоны) и вывела в полу-тупик строительного мусора. Ну такое. Особенно ночью и когда уже считаешь часы. Не сильно отклоняясь от трека, всё это чудо я мог бы спокойно оббежать по самой улице, названной в честь курсантов. Вот если бы знал.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Ожидаемая история: помойная обочина напополам со стройкой вдоль улицы Верхние Поля. А дальше ещё и вход в дикую часть Кузьминского парка через дырку в заборе – тоже не самый любимый участок кольца. А вот сама дикая часть Кузьминок, после того как ушли чуть вглубь от разлившегося озера – очень окей.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Из ярких городских достопримечательностей на маршруте: Поклонная гора и набережная напротив Лужников. Хотя из-за стройки и ограждений подъём к улице Косыгина с последней получился довольно экстремальным. А ещё главное здание МГУ – тоже обращает на себя внимание.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Встречал треки ЗКМ, где предупреждают про ограничения по времени для прохождения Ботанического Сада – закрывают его на ночь. Так вот, не его одного: меня запертая на висячий замок калитка встретила при попытке попасть в Царицынский.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Значительную часть маршрута можно назвать трейловой. Т.е. не асфальт и не утоптанные широкие дорожки, а тропы, с кочками, корнями, травой и иногда грязью. При такой погоде в асфальтовых кроссовках было ок, но можно было бы и рассмотреть варианты.","listType":"ul","listId":"list-4","level":0},{"kind":"h3","text":"Навигация"},{"kind":"p","text":"Версию трека, которую я взял себе за основу, мне скинул кто-то из друзей. Альтернативный способ – скачать с официальной страницы ЗКМ в Фейсбуке . Трек подгонял для себя: перенёс старт в Измайлово, развернул против часовой, подвигал слегка несколько маршрутных точек, как считал для себя более удобным."},{"kind":"p","text":"Для редактирования трека мне подошла gpxstudio.github.io, сделать тоже самое с помощью nakarte.me, ttrails.ru и редактора дистанций в Garmin Connect у меня не получилось."},{"kind":"p","text":"На первой части дистанции моим способом ориентироваться по маршруту был Саша, о котором писал выше. После 52 километра пришлось с навигацией справляться самостоятельно. Два инструмента в подспорье:"},{"kind":"li","text":"Основной – режим прохождения дистанции в часах – на экране среди нигде была нарисована линия маршрута и две стрелки – одна показывала направления будущих манёвров, вторая – моё текущее местоположение.","listType":"ul","listId":"list-5","level":0},{"kind":"li","text":"Второй способ понять, куда двигаться – Гугл-карты на телефоне, тоже с заранее загруженным треком. По сравнению с часами намного удобнее работать с масштабом и привязкой к местности, но не удобно использовать на бегу.","listType":"ul","listId":"list-5","level":0},{"kind":"p","text":"Телефоном пользовался, когда часы были на зарядке в жилете и когда не получалось быстро сориентироваться только по маленькому круглому экрану на запястье. А лучше бы доставал его чаще – навигировался я так себе:"},{"kind":"li","text":"Не меньше пары десятков раз уходил не туда на развилках. Иногда возвращался на десять-двадцать-сто метров назад, иногда пытался скорректировать маршрут будущими поворотами. Неудобно. Порой до раздражения, особенно в Парке 50-летия Октября с его десятками микро-развилок и ночью, когда подустал и не получал удовольствие от попыток найти верную тропу методом тыка.","listType":"ul","listId":"list-6","level":0},{"kind":"li","text":"А ещё крупный масштаб навигатора на часах не позволял оценить целесообразность точного следованию треку в местах, где параллельно с выбранными участками были намного более удобные: широкие, чистые, освещённые или просто не упирающиеся в заброшенные кучи мусора.","listType":"ul","listId":"list-6","level":0},{"kind":"p","text":"В такие моменты на телефоне в тактическом масштабе можно было бы оценить «а что сейчас вообще на карте происходит» и не делать лишних неудобных мини корректировок. Или, наоборот, обходить, что не нравится, стороной."},{"kind":"h3","text":"Питание"},{"kind":"p","text":"На тренировках ем гели SIS – их можно запивать меньшим количеством воды. На стартах, обычно, с водой нет проблем, и я предпочитаю GU – при чуть большей калорийности, они вдвое легче и вдвое меньше по объёму. Удобно, когда их на дистанции нужно полтора-два десятка."},{"kind":"p","text":"ЗКМ – компромиссная история. Гелей на себе нужно много, но и вода не на каждом углу по расписанию. Выбрал GU. Половину гелей нёс с собой со старта, вторую мне передал Тимур в конце совместного участка на 84 километре."},{"kind":"p","text":"И так, питание:"},{"kind":"li","text":"21 гель и 2 белковых батончика. Первые 50-60 километров ел раз в час, после – раз в пятьдесят минут. Батончики съел на четвёртом и четырнадцатом часах гонки, чтобы хоть немного твёрдой пищи досталось ЖКТ за сутки.","listType":"ul","listId":"list-7","level":0},{"kind":"li","text":"Полтора бутерброда с сыром на 106 километре. Ещё была попытка съесть бутерброд с колбасой на 135 километре, но не смог.","listType":"ul","listId":"list-7","level":0},{"kind":"li","text":"За 22 часа гонки выпил примерно 8-9 литров воды и около литра колы. Была возможность взять кофе на вынос, но не стал эксперементировать ).","listType":"ul","listId":"list-7","level":0},{"kind":"li","text":"Два сливочных мороженых из парковых ларьков-морозильников приятно разнообразили классические источники углеводов – мням.","listType":"ul","listId":"list-7","level":0},{"kind":"p","text":"С водой, кстати, были почти сложности. Если бы не внезапная помощь Айрта посреди ночи, мне бы могло не хватить запаса до встречи с Серёжей перед последней тридцаткой. И в дневное время палатки в парках не на каждом углу, а ночью и ранним утром – совсем беда. Это стоит учитывать, при планировании маршрута."},{"kind":"h3","text":"Приключения"},{"kind":"p","text":"Облаком тегов про впечатления, не охваченные текстом выше:"},{"kind":"li","text":"Неожиданная и приятная встреча с товарищами по Измайловскому паркрану в Парке 50-летия Октября. Сильно раньше, в районе Черкизовского парка, встретил «группу в красных платьях» Александра Советова – главного идеолога маршрута.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Экипажи полиции и приветствие фонарями в лицо в районе двух часов ночи на Ореховском кладбище.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Шумный ажиотаж перед возможно не состоявшейся массовой уличной дракой где-то в Бирюлёвских дворах.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Много парково-шашлычной алкотни, за единственным исключением абсолютно безразличной к пробегающей мимо фигуре с налобным фонариком.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Несколько встреч с агрессивно настроенными собаками в темени Битцевского парка. Хорошо, что хозяева быстры, внимательны и адекватны.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Комары! А было ли их столько в прошлом году? Когда бежишь не особо мешают, но если в парке притормозить или остановиться.. Ух!","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Перед тем как пробежать со мной решающие 20 километров дистанции, мой однооклассник Серёжа выкурил подряд две сигареты – видимо, ему так было проще перестроиться для занятия физкультурой после десятичасовой вечеринки накануне. Плохой пример детям, но ведь приехал! Возможно, у атлетов из Mikkeller Running Club так принято.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Раскатистое утреннее кваканье, аккомпанируемое стрекотанием сверчков и пением птиц – кайф! Даже записал немного.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Очень здорово, что получилось выбежать из 22 часов и успеть полчаса потусоваться на стартовой площадке Измайлонга. Забег не был официальным, но на финише всё равно оказались приятные знакомые люди в ярких футболках, восхищение и вопросы «Ну как ты?», «Живой?». Просто закончить такой пробег, открыв ключом дверь в подъезд, было бы менее уместным финальным аккордом приключения.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Уже после забега узнал, что оказался всего лишь 16 человеком, который преодолел маршрут зелёного кольца за один заход.","listType":"ul","listId":"list-8","level":0},{"kind":"h3","text":"Как перенёс физически"},{"kind":"p","text":"Очень достойно. Первый ОДА-дискомфорт появился только в районе 40-50 километра – почувствовал, что у меня есть левый ахилл и что-то с ним происходит. И дальше этот дискомфорт очень долго никак не развивался."},{"kind":"p","text":"Забитость мышц ощутил после шестидесятого – уронил гель на землю и не без труда смог присесть, чтобы его подобрать. Но эта забитость не мешала бежать и двигаться."},{"kind":"p","text":"После сотого километра заметил, что правой нагрудной флягой надавил синяк где-то над рёбрами. Болело, но тоже не особо мешало."},{"kind":"p","text":"Ощущения, что вообще не могу бежать и надо идти, не было ни разу. Да уставал, да переходил на шаг для отдыха и восстановления. Но это всегда был выбор, а не необходимость."},{"kind":"p","text":"Мозолей почти нет, потёртости минимальны – опыт, вазелин и хорошая экипировка решают. Уже вечером мог ходить не хромая и на следующий день тоже – всё цело, живой. Крутой? Крутой! :-)"},{"kind":"h3","text":"Как перенёс психологически"},{"kind":"p","text":"Комфортно. Был только один небольшой кризис в районе шестидесятого километра, когда на полчаса пропало настроение. А ещё там же, на Поклонной, залпом выпил бутылку колы, газы которой на несколько минут добавили к общему ощущению тяжести и локальному нежеланию бежать. Потом встретил Тимура, отвлёкся и всё прошло."},{"kind":"p","text":"Вероятно, помогла компания по ходу дистанции. Помогла постоянная смена картинки, разнообразие и видов, и выпадающих трудностей. Помогли поддержка и участие товарищей из Измайлонга, которые время от времени через третьи руки долетали до меня."},{"kind":"p","text":"Всё получилось, очень доволен приключением. Пожалуй, счастлив."}]},{"id":"2019-icon-2019-когда-герой-не-ты","title":"ICON 2019. Когда герой не ты","docTitle":"2019 — ICON 2019. Когда герой не ты","sourceUrl":"https://ddv-comrades.blogspot.com/2019/09/icon-2019.html","categories":["Приключения"],"date":"2019","place":"Ливиньо","distance":"","result":"—","elevation":"","format":"Support crew; статья о конкретном событии","summary":"Приключение на ICON в роли команды поддержки, а не участника старта.","paragraphs":[{"kind":"h2","text":"О чём текст-то?"},{"kind":"p","text":"Заметка получилась очень длинной. Будет справедливо в самом начале кратко рассказать о чём она и стоит ли её читать:"},{"kind":"li","text":"Четыре дня назад я вернулся из северной части Италии, где выступил в качестве члена команды поддержки на экстремальном длинном триатлоне ICON 2019. Об этом своём опыте и написал один из самых длинных текстов в жизни.","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Может и не стоит – букв много, а недоступной где-либо в более лаконичной форме информации постольку-поскольку. Для меня это описание первого в жизни долгого-мощного соревнования, где я – подай-принеси персонаж, а не тот парень, что героически преодолевает трудности и затем получает заслуженную порцию восхищения, временные проблемы с ОДА и памятную медаль.","listType":"ol","listId":"list-1","level":0},{"kind":"p","text":"Если по каким-то причинам эта тема кажется тебе, читатель, стоящей часа твоей жизни… Что ж, я честно тебя предупредил. И свой выбор ты делаешь сам, как и я, когда вписался во всю эту историю. Ну, обо всём по порядку."},{"kind":"h2","text":"Часть 1. Начало."},{"kind":"p","text":"С Мишей я познакомился через Facebook в 2018 году, когда мы независимо друг от друга готовились к участию в ультрамарафоне Comrades 2018 down run – там же, в ЮАР, и встретились лично. Вторая наша встреча случилась ровно год спустя в ровно том же месте: укрепили наше знакомство совместной девятичасовой пробежкой по шоссе между Дурбаном и Питермарицбургом, а также сопутствующими приключениями. Хорошо, в общем, провели время."},{"kind":"p","text":"И вот как раз во время второй нашей встречи Миша сделал мне предложение. Это не были слова «‎Дима, выходи за меня», произнесённые на одном колене – мы оба женаты и при всём тёплом друг к другу отношении не готовы переходить определённые границы. Но что-то похожее в сказанном Мишей всё-таки было. Вот, сравните два варианта:"},{"kind":"li","text":"Дорогая, я хочу, чтобы ты стирала мои вещи, готовила мне еду и гладила рубашки. Хочу, чтобы то, что раньше дарило нам обоим радость и удовольствие, стало называться «супружеским долгом‎». Хочу, чтобы ты убирала наше жилище, выбирала подарки общим знакомым и слушала мои жалобы про работу и неуспехи любимой футбольной команды. Взамен я тебе буду немного помогать финансами и разрешу носить мою фамилию. Согласна?","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Дима, я хочу, чтобы ты подарил мне неделю своей жизни. Хочу, чтобы ты почти не спал несколько дней к ряду, носил мои вещи, одевал меня, кормил меня и поил. Хочу, чтобы ты хвостом катался за мной на машине 12 часов подряд, выкидывал за меня мусор, заботился обо мне и слушал мои жалобы на погоду, рельеф и температуру воды. Взамен я тебе оплачу койко-место в Италии и разрешу оставить себе оранжевую майку с белой надписью Support Team. Согласен?","listType":"ol","listId":"list-2","level":0},{"kind":"p","text":"Есть что-то общее, да? Я нашёл два сходства: во-первых, оба предложения более заманчивы, обоюдно-кайфовы и интересны, чем может показаться на первый взгляд. Во-вторых, задав лишь несколько уточняющих вопросов, я бодро ответил согласием, как и та девочка, которой впервые в жизни достойный кавалер предложил место на 14-й странице своего паспорта."},{"kind":"p","text":"Про институт брака и всякие его особенности рассказывать не буду, а про то, как в одно лицо стал командой поддержки на экстремальном длинном триатлоном старте – пожалуйста."},{"kind":"h2","text":"Часть 2. ICON – что это такое?"},{"kind":"p","text":"История появления этого старта видится мне примерно так:"},{"kind":"li","text":"Когда-то люди взяли и придумали спорт триатлон: cначала плывёшь, потом едешь на велосипеде, потом бежишь. Всё в один день и подряд. По времени у любителя олимпийская триатлонная дистанция занимает что-то в районе 2-3 часов.","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Потом другие люди придумали длинный триатлон и назвали его «Ironman». По сути, всё тоже самое, только дистанции не для слабых духом и телом: плыть теперь 4 километра, катить на велосипеде 180 километров, бежать – целый марафон (42 километра). Всё приключение обычно занимает от 9 до 13 часов.","listType":"ul","listId":"list-3","level":0},{"kind":"li","text":"Но, оказалось, есть ещё более отмороженные ребята и они сочинили историю про экстремальный длинный триатлон: расстояния те же, но с жестью: вода – ледяная, велосипед – с впечатляющим набором высоты, бег по горам, заметно трейл и как правило ночью. Ожидаемое время преодоления для подготовленного атлета от 14 до 20 часов.","listType":"ul","listId":"list-3","level":0},{"kind":"p","text":"Так вот ICON – это один из самых жёстких стартов третьего типа. Проходит на севере Италии (и немного в Швейцарии) в окрестностях деревни Ливиньо."},{"kind":"p","text":"В подобных соревнованиях принимает участие около 200-250 триатлетов, у каждого из которых в обязательном порядке должна быть команда поддержки от 1 до 3 человек. Основная функция поддержки: кормить, поить, переодевать атлета и вместе с ним преодолеть последнюю четверть беговой дистанции."},{"kind":"p","text":"Как ты, читатель, уже понял – именно этой командой поддержки Миша мне и предложил стать."},{"kind":"h2","text":"Часть 3. Подготовка."},{"kind":"p","text":"Свою работу в качестве суппортера я начал за месяц с небольшим до вылета в Италию. Сначала, например, попросил Мишу хотя бы немного потренироваться, чтобы не помереть во время гонки у меня на руках."},{"kind":"p","text":"Потом начал собирать информацию о старте: прочитал положение о соревновании и правила участия, составил список вопросов к бывалым экстремальным триатлетам и их командам поддержки, переварил и упорядочил собранную информацию. Не всё давалось просто – чего только стоило хладнокровно игнорировать в русском чате участников непонятные ветви дискуссий про кассеты, звёзды, петухи и прочие, кажется, связанные то ли с велосипедом, то ли со строительством космического корабля технические детали."},{"kind":"p","text":"К началу августа мне удалось выяснить, что и поддержке, и атлету необходимо взять с собой чёртову кучу всякого про инвентарь, экипировку, питание и первую помощь в случае разного. Без одной части – не допустят до старта, без другой – допустят, но атлет протянет ноги. В голове всё не удержать – сообразил для себя и Миши Google-таблицу: что надо, что есть, что купить и кто за что отвечает. Сборы стали проще, появилось ощущение, что процесс подготовки управляем. Стало поспокойней."},{"kind":"p","text":"Из интересного: обязательно каждому из нас нужна была ветровка для бегового этапа. Непростая, а с мембраной. Не с любой, а с определённым уровнем влагостойкости и паропроводимости. И свойства этой ветровки надо мочь доказать ярлыком, лейблом или чем-то ещё таким же очевидным: нет доказательства – нет допуска к старту. Купили."},{"kind":"p","text":"Всего пунктов в таблице примерно сто тридцать и ещё неопреновые перчатки."},{"kind":"h2","text":"Часть 4. Логистика."},{"kind":"p","text":"Даты поездки выбирал Миша, он же бронировал автомобиль и гостиницу. Из организационно-транспортных задач мне досталась перевозка в Италию велочемодана, приём машины из проката и встреча Миши в аэропорту, отличном от того, куда прилетел я и чемодан – вокруг Милана их целых три."},{"kind":"p","text":"Получилось всё не то, чтобы совсем без стресса: чужая страна, чужой язык, чужие правила ПДД и обычаи на дорогах – более-менее ожидаемые проблемы. Добавила колорита другая история: припасённая из дома держалка для телефона не подошла к прокатной машине – cто километров до Миши я ехал, держа телефон с навигатором в правой руке. Ну такое. Повезло, что в прокате решил доплатить за автоматическую коробку передач."},{"kind":"p","text":"После того, как забрал Мишу в Мальпенсе, нам предстояли примерно 400 километров дороги до Ливиньо с разными забавностями вроде борьбы с парковочным автоматом, перекусом в Макдональдсе и попытки следовать маршруту по скриншоту экрана навигатора. Вдвоём проще и веселее: задорно ехали по шоссе через длиннющие тоннели, уютные небольшие городки с католическими церквушками и ночные горные серпантины. Слушали музыку, болтали, изучали машину и всякое такое – вполне себе качественное дорожное приключение."},{"kind":"p","text":"Приехали глубоко ночью, устали, спать."},{"kind":"p","text":"Часть 5. Канун. Какой там выспаться! Скудный отельный завтрак в девять, и сразу в оборот: Миша – собирать велосипед, я – за покупками. Заправил машину, купил держалку для телефона, купил электрочайник. Далее тестировали свежесобранный велосипед: проехали около 15 километров по велосипедной трассе от Т1 и вернулись к отелю."},{"kind":"p","text":"Пообедать и передохнуть перед гонкой? Нет, не слышали. Сразу после перерыва на душ поехали регистрироваться и получать стартовый пакет. Поесть планировали сразу после, аккуратно уложившись до брифинга."},{"kind":"p","text":"Планы придумывают люди, а бог делает так, что наши с Мишей беговые штаны не проходят проверку организаторов на виндстопность – недопуск! Обед отменяется, в спешке пытаемся найти годные штаны в многочисленных местных спортивных магазинах. До брифинга не успеваем. Голодно!"},{"kind":"p","text":"Брифинг познавательный. Пытаясь соответствовать своей ответственной роли, внимательно впитываю всю информацию от организаторов. Слайды про контрольные отсечки и ключевые «do and don’ts» фотографирую на телефон. На брифинге между делом пересекаемся с соотечественниками, которых на страт приехало слегка за тридцать человек (атлеты + поддержка)."},{"kind":"p","text":"После инструктажа вновь бросаемся на поиски правильных ветрозащитных штанов. В одних магазинах их нет совсем, в других нет нужных размеров, в третьих есть штаны, но нет бирки, что брюки подходят для старта. Вера в успех вознаграждается свыше – долго выносим мозг продавцу очередного магазина: а точно против ветра? А где написано? А есть подтверждение? А покажи каталог? Ответы положительные. В благодарность за то, что мы от него в конце концов отстали, продавец даёт нам скидку в 30% на каждую пару брюк."},{"kind":"p","text":"Время около семи вечера. Теперь нас хотя бы допустят до старта. Можно наконец-то поесть что-то кроме хлеба и кофе. Ужин заканчивается ближе к восьми: МЫ ДАЖЕ НЕ НАЧИНАЛИ собирать вещи на гонку…"},{"kind":"p","text":"И вот они усталые сборы. Боже мой, сколько всего:"},{"kind":"li","text":"Сумка 1: всё, что нужно Мише для плавательного этапа: гидрокостюм, шапка, ошейник, перчатки, носки, тапочки, очки и вот это всё.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Сумка 2, самая большая: всё для Т1 и велоэтапа: трисьют, велотуфли, набор курток на разную погоду и на смену, бахилы, штаны и прочее.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Сумка 3, самая лаконичная: комплект для Т2 и бега до 30 километра: кроссовки, курточка и что-то ещё по мелочи.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Сумки 4: Т3 для Миши: обязательный комплект всякого тёплого, палки, злополучные штаны, заряженный гелями жилет.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Сумка 5: всё тоже самое для меня.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Сумка 6: тёплые сменные вещи для обоих, которые мы должны будем получить на финише.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Сумка 7: Рабочая сумка суппорта в машину. В ней гели, батончики, порошки, аптечка, полотенца, фляги, ремкомлект и бог знает, что ещё.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Рюкзак суппорта: документы, еда суппорту, повербанки, зарядки.","listType":"ul","listId":"list-4","level":0},{"kind":"p","text":"После сборов пьём чай и обсуждаем тактику взаимодействия на завтрашний день. Договорились о многом, но и белых пятен хватает – разберёмся по делу."},{"kind":"p","text":"Ложимся в двенадцать, вставать в три. Если можно было бы исправить одну только вещь при подготовке к гонке, я бы выбрал приехать в Ильвиньо на сутки раньше."},{"kind":"h2","text":"Часть 5. День ИКС, вода."},{"kind":"p","text":"Чётко как в армии: встаём ровно в три. Быстрый завтрак, грузим вещи в машину. Попутно помогаем пожилой французской паре, раздав им в ночи Интернет. На большой парковочной площади перед административным зданием аквапарка (выдача GPS-чипов и шапочек) мы одни из первых. В четыре утра получаем необходимое из рук приветливых волонтёров."},{"kind":"p","text":"На улице холодно. Ставим велосипед в транзитную зону, рядом сумку номер два. С сумкой номер один идём в шатёр, где триатлеты, словно рыцари к турниру, облачаются в доспехи, чтобы вместе со стартовым сигналом в кромешной мгле броситься в воду и плыть-плыть-плыть. Температура воды – пятнадцать градусов. За границами шатра вдоль транзитки ярким пламенем горят как будто первобытные костры. Атмосфера впечатляет - ух!"},{"kind":"p","text":"Миша окунается в воду. Плавает несколько минут и стуча зубами выходит к кострам: последние приготовления завершены. Еще несколько минут, проверка и построение атлетов, в 05:15 под эпично-героический саундтрек две сотни одинаковых белых шапочек россыпью погружаются в тёмные воды ледяного горного озера."},{"kind":"p","text":"Моя функция на плавательном этапе: надуть буй и помочь переодеться, перенести вещи из шатра в машину, постараться не тупить сильно и через примерно полтора часа встретить выходящего на сушу Мишу с веловещами, чтобы сопроводить его снова в шатёр."},{"kind":"p","text":"Совсем не тупить не получилось – сделал бесполезную ходку к отелю за тёплыми вещами, оставив ключ от номера в машине на парковке. Вернулся, греюсь чаем в кафе во всё том же административном здании аквапарка. Второй раз за два дня знакомлюсь Юлей – женой триатлета Стаса, которому вчера Миша одолжил запасные перчатки для плавания. Знакомимся не зря: Миша и Стас большую часть гонки пройдут практически синхронно, и мы с Юлей ещё много/долго вместе проведём время на обочине соревнования, помогая друг другу решать наши на первый взгляд незаметные, прикладные, но важные задачи."},{"kind":"p","text":"Встречать ребят выходим к 06:35, через час двадцать после стартового сигнала – вдруг проплывут быстрее чем за полтора часа. Ждём. Минуты идут, вереница выходящих на берег атлетов постепенно редеет. Наших нет. Волнительно. Проходит девяносто минут, проходит девяносто пять, проходит час сорок. Теперь атлеты выходят уже не цепочкой вовсе – по одному, с долгими паузами между друг другом."},{"kind":"p","text":"Через час сорок семь после старта из воды выходит Стас и вместе с Юлей исчезает в шатре. Через час пятьдесят наконец-то Миша – живой, бодрый, вроде бы в порядке. Узнаю его заблаговременно ещё в воде по цветным линзам очков – выхватываю из кармана телефон и снимаю видео о явлении миру героя."},{"kind":"h2","text":"Часть 6. День ИКС, огонь."},{"kind":"p","text":"В шатре первой транзитной зоны помогаю Мише переодеться из плавательного в велосипедное. Пою чаем. Узнаю про то, что задержка в 20 минут от ожидаемого результата – следствие панической атаки, которую Миша распознал и технично пережил по всем канонам буддизма: осознанно попробовал по-всякому и нашёл свой собственный путь – рассматривать звёзды лёжа на буйе. Сильно. Говорит, что в этот момент гонка могла закончиться, окажись к нему ближе спасатели. Ух."},{"kind":"p","text":"На велоэтап Миша уходит одним из последних. Собираю его вещи в транзитной зоне, гружу в машину и еду в отель. Решил, что за гонку сделаю два захода в номер: выложить и разобрать вещи после плавания – первый. Второй – после начала бегового этапа: занести в номер и разобрать вещи велосипедные, и погрузить в машину мешки для Т3. Цель простая: чем меньше вещей в машине, тем проще в них ориентироваться. Плавательные вещи в итоге не только заношу в номер, но и сразу споласкиваю и развешиваю сушиться – меньше будет забот, когда для забот уже не будет сил. Весь пит-стоп занял около 25 минут от границы Т1. На эти минуты позже мишиного начался мой «велосипедный этап»."},{"kind":"p","text":"Базовая задача суппортера на этом отрезке гонки – сделать так, чтобы у атлета во флягах всегда был запас жидкостей, а в кабуре запас гелей. Иначе атлет не доедет. Следующая по приоритету задача – обеспечить удовлетворение потребностей велосипедиста сверх базовых: кока-кола, переодевания, поливания водой, заморозки, помощь в ориентации в пространстве и времени."},{"kind":"p","text":"Изначально планировал, что буду искать место для парковки автомобиля каждые 25-30 километров. На этих остановках Миша будет, мол, останавливаться и пополнять запасы. Вышло не совсем так: на подъёмах останавливаться нужно было чаще. А на спусках – попробуй его сначала догони, чтобы накормить. Но, конечно, всё это я понял не сразу."},{"kind":"p","text":"Первые 50-70 километров из 200 шли более-менее по плану. Миша отогревался после купания, выкладывался в подъёмы и стильно скатывал в затяжных спусках. Я парковал машину там, где она не мешала движению, несколько минут впечатлялся красотой горных видов и тяжести градиента велосипедной трассы, делал десяток фотографий, а затем встречал подъезжающего Мишу и передавал ему необходимые припасы. Время от времени пересекался с Юлей и Стасом."},{"kind":"p","text":"Постепенно узнал от участников гонки и их суппортеров то, что должен был узнать и запомнить про гонку ещё в Москве: главный источник общего страха и трепета горный перевал – Стельвио – крутой подъём по серпантину с общим набором высоты в ДВА КИЛОМЕТРА. А говорят, что «Нашествие» - главное приключение лета. Как бы не так."},{"kind":"p","text":"До этого чуда природы ещё надо было добраться: стандартные пит-стопы сменяли друг друга, иногда Миша слезал с велосипеда, чтобы заморозить отказывающее уже от нагрузки колено и перевести дух, а мне даже удалось перекусить на веранде уютного кафе пельменоподобной пастой (ох зря). Был даже второй спуск с горы, на котором атлеты так сильно разгонялись, что не каждый суппорт мог, мча на машине по узким улочкам с реверсивным движением, догнать своего подопечного и вовремя его покормить: пару раз за гонку я успевал поухаживать не только за Мишей, но и спасти от чрезмерного дефицита еды и напитков Стаса – не всегда Юля успевала оказаться в нужном месте в нужное время."},{"kind":"p","text":"А потом начался ОН – подъём на Стельвио – бесчисленные зигзаги, круто восходящие на вершину перевала. Вид на горы – колоссальный, восхитительный, будоражащий! Но рельеф! В него тяжко ползти даже за рулём автомобиля. Эти зигзаги-зигзаги-зигзаги. Как хорошо, что я на машине. Как хорошо, что коробка автомат. Но на велосипеде?! Это вообще возможно?! А они ехали. Как?!"},{"kind":"p","text":"Пит-стопы стали чаще. От забеганий с бутылками в гору разбередилась в животе только что съеденная паста – мало приятного. Несмотря на трудности я успевал не только сносно выполнять свои основные функции и фотографировать альпийские красоты, но и продолжал вести текстово-графический онлайн репортаж в WhatsApp чат, посвященный Мишиному участию в гонке."},{"kind":"p","text":"Одним из самых драматичных моментов вело-этапа и старта в целом стала минута, когда, записав видео в чат про, казалось, один из последних витков серпантина, я выключил камеру и увидел впереди огромную вертикальную каменную стену, с зигзагами дороги на высоком боку. Захотелось плакать – настолько «несправедливым» был открывшийся вид к и так измученным атлетам. «Невозможно, нечестно, так нельзя, с этим не справиться» – такие были мои мысли. Сложно представить, что было в голове у самих велосипедистов."},{"kind":"p","text":"Помимо прочего, и жизнь поддержки, и жизнь атлетов осложнял интенсивный дорожный трафик: машины, стаи мотоциклистов, автобусы и дома на колёсах – среди всего этого нужно было маневрировать, разъезжаться и особую бдительность проявлять на многочисленных поворотах. Водителю с малым опытом (привет, Юля), это конечно тот ещё стресс. Да и для самих велосипедистов не слаще."},{"kind":"p","text":"Вторая драма гонки, как и предыдущая, тоже случилась при въезде на Стельвио. После долгих поисков я наконец-то выехал на большую плоскую площадку, кажется, близкую к вершине перевала. Площадку с туалетом - спасён! К этому моменту я регулярно вёл Стаса и Мишу по таймингу велоэтапа, ориентируя их на лимит времени в Т2 (переход с велосипеда на бег). И запас времени у парней был приличный. Но после долгожданного избавления от дискомфорта с ЖКТ, от русских ребят на площадке я узнал страшное: есть ещё промежуточная отсечка где-то на вершине горы. И до неё осталось всего полчаса."},{"kind":"p","text":"Т.е. ТРИДЦАТЬ МИНУТ до потенциального преждевременного конца гонки. Отсечка где-то выше, я на площадке, ребят не видно внизу на 2-3 ближайших витках серпантина. Парни не знают про лимит и крутят в гору точно спокойнее, чем стоило бы. Блять. Это мой фейл как суппорта. Я должен был помнить про лимит и ориентировать Мишу на него."},{"kind":"p","text":"Туплю несколько минут: не могу принять решение, не знаю, что делать. Потом пихаю в рюкзак колу, воду, сменную флягу, гели и бегу вниз по серпантину навстречу Стасу и Мише. Встречаю первого, кричу: «Гони! Двадцать пять минут до отсечки». Встречаю Мишу: заправляю его на ходу припасами и прошу поднажать, рассказывая про своё неприятное открытие. Теперь у ребят хотя бы есть шанс. Волнительно!"},{"kind":"p","text":"Быстрым шагом иду наверх обратно к машине. Долго ищу упавшие на коврик солнцезащитные очки, долго прибираюсь в багажнике – как будто оттягиваю момент, когда узнаю, получилось или нет. Стартую. Заезжаю на гору. Судя по расстоянию до неё, Стас успел минут за 10-12 до cut off. Миша – минут за 6-8. УСПЕЛИ!"},{"kind":"p","text":"За горой начинается крутой спуск. Где-то впереди должен быть ещё один подъём, но это не точно. Если его не будет, ребята рискуют остаться в Т2 без кроссовок – попробуй догони их с горки: парни летят вниз со скоростью под 60 километров в час! На тоненьких колёсах, пристёгнутые к педалям, с одним лишь шлемом из защиты! Я бы нет."},{"kind":"p","text":"Спускаюсь за ними. Горка таки есть. Сначала нагоняю Стаса – он пустой, Юля второй раз не успевает за ним на спуске – кормлю, пою. Догоняю Мишу: восхищаюсь, пиздец. Он крутит так, что в каждый момент времени понятно – не на пределе, докрутит, не сойдёт. Как робот, который медленно, верно, неотвратимо приближается к цели. Заправляю едой и напитками. Пытаюсь соответствовать уровню Миши в своей функции поддержки, но допускаю вторую ошибку – на длинном подъёме слишком далеко уезжаю вперёд. Еды и воды у Миши достаточно, а заморозки и колы для комфортной борьбы с секундами не хватает. Нехорошо, но вроде бы не критично. Дождался, обслужил, гонка продолжается."},{"kind":"p","text":"Пока ждал посчитал, что в Т2 ребята точно успеют, а вот забраться на гору – едва ли. Чтобы финишировать по престижному верхнему маршруту (последние 12 километров марафона – подъём с набором высоты в километр на Кароселло 3000), им нужно будет пробежать первые 30 километров марафона за два с половиной часа. Теоретически это возможно, если трасса плоская и ноги свежие. Но ноги не свежие, а трасса, как мы потом узнаем, вообще не плоская. Делюсь с ребятами опасениями: оба всё понимают, но сохраняют надежду на белую футболку (за менее престижный финиш по нижнему маршруту вручают чёрную)."},{"kind":"h2","text":"Часть 7. День ИКС, медные трубы."},{"kind":"p","text":"В транзитной зоне номер два у меня задача была такая: встретить, освежить, снарядить и отправить бежать. Перевыполнил план: относительно удачно заснял финиш очередного этапа и отправил в чатик. Возможно, репортёр из меня получился лучше суппортера – трансляцию хвалили за артистизм и драматургию."},{"kind":"p","text":"Забрал вещи, забрал велосипед. Пока Миша бежал в сторону нашей запрограммированной точки встречи на 13-м километре бегового этапа, мне предстояло метнуться в номер, выложить из машины лишние вещи, доложить снаряжение для Т3 и облачиться в беговое: от 30 километра, напомню, нам с Мишей требуется бегать по горам в паре."},{"kind":"p","text":"В районе 13-ого километра пробежал с Мишей и Стасом около пяти-семи минут. Ребята бодрые, пробежка с ними даётся не то, чтобы просто. Их средний темп в районе 6:30 на километр. Показалось, что Стас всё ещё рассчитывает успеть на Кароселло. Мишу пою, снаряжаю фонариком и гелями. От куртки он отказался… зря."},{"kind":"p","text":"Еду к Т3. У меня есть примерно полтора часа, чтобы припарковаться, подготовить снаряжение к заключительному отрезку гонки и выяснить детали этого отрезка у организаторов. Выяснил следующее: если ребята успеют в Т3 до 21:45, то побегут следующие 12 километров в гору на Кароселло 3000 и поборются за белые футболки. Если нет (наш вариант), но успеют в Т3 до 23:45, побегут круг 8 километров, чтобы финишировать в том же Т3 и претендовать на чёрную футболку – чуть менее почётный, но всё же ценный трофей, который тоже означает «гонка зачтена, успех»."},{"kind":"p","text":"К третьей транзитной зоне ребята должны подойти около половины одиннадцатого, если сохранят средний темп с начала бегового этапа. Рассчитывая на это, налегке (вода и гели, без тёплой одежды и палок для Миши) в 21:40 пешком выдвигаюсь к ним на встречу. Но до этой самой встречи иду целый час – темп сохранить парням не позволила трасса: полноценный холмистый трейл. Речь уже не про Кароселло, просто бы в лимит попасть."},{"kind":"p","text":"Около 22:40 встречаю Стаса, Мишу и Юлю, которая независимо от меня приняла точно такое же решение идти на встречу ребятам. Позже узнаю, что эта идея вообще не оригинальна и так поступила добрая половина всех суппортов. Миша и Стас, мягко стажем, утомились. На лицах страдания, на устах – проклятия. С небольшими перекурами двигаемся к Т3. До 23:45 должны успеть."},{"kind":"p","text":"В транзитной зоне, да сколько можно, снова начинается паника: оказывается на восемь непонятного рельефа и сложности километров у нас есть всего полтора часа. Стас и Юля не ждут нас – капуш и, переживая за успех мероприятия, уносятся вперёд. После необходимой санитарной паузы и смены нарядов мы выдвигаемся следом."},{"kind":"p","text":"Пока дорога идёт с небольшим уклоном вниз по деревне – чередуем бег и ходьбу. Затем крутой подъём метров на 200-300 по пересечённой местности, лай собаки и подъёмы, чередующиеся со спусками – дежавю! Эти уроки я учил в апреле на Маркотхском хребте – радуюсь, как будто встретил старого знакомого. Даже живот крутить перестало. Миша держится молодцом. Страх не уложиться в лимит не даёт расслабиться. Помогаю ему разобраться с палками, несколько раз походу корректирую длину с учётом рельефа. Не то, чтобы у нас есть какой-то очевидный запас по времени, но успеть, кажется, должны."},{"kind":"p","text":"Когда до финиша остаётся только один километровый спуск, сомнений в успехе нет – успеваем. На радостях азартно бежим с горы, Миша спотыкается, чудом удерживает равновесие и неприятно травмируют сразу две и так еле живые ноги. Переходим на шаг до тех пор, пока до финишной арки не остаётся всего 100-200 метров. В неё бежим! Зрителей уже толком нет, идёт второй час ночи, мы радостно делаем последнее ускорение и пересекаем финишную черту. После нас в лимит уложился ещё только один атлет. Замкнули."},{"kind":"p","text":"Забегая в финишную арку ловлю ощущение «Ура, победа, справились». Потом мозгом возвращаю себя в реальность – справились не мы, а Миша. Это он в темноте плыл 4 километра в ледяной воде, борясь с накинувшимся внезапно удушьем. Это он двенадцать часов крутил педали по жаре, чередуя подъёмы в сумасшедшие горы с опасными скоростными спусками по крутым зигзагам серпантинов. Это Миша на частично выживших после велоэтапа ногах пробежал 38 километров по непростому даже для свежего бегуна рельефу. Это он герой. А я просто в меру качественно исполнил «подай, принеси», чем, кстати, в целом, вполне горжусь."},{"kind":"p","text":"Общее время прохождение дистанции: 19 часов 46 минут. Миша – железный. Я – полезный. Проявляю последнюю за сутки каплю профессиональной заботы: развожу во фляге рекавери-порошок и подгоняю машину чуть ближе к выходу из финишной зоны – хватит уже на сегодня преодолений."},{"kind":"p","text":"РЕЗЮМЕ. Всего до финиша добралось около 130 человек из 250 стартовавших. Россиян – пятеро, меньше половины."},{"kind":"p","text":"Несмотря на рабочее название «КосякInn team», наш тандем, который до 30 августа вполне оправдывал своё название, в самый важный день оказался очень слаженной и организованной командой. С Мишей сошлись во мнении: «ШАЛАСТЬ УДАЛАСЬ»."},{"kind":"h2","text":"Что отложилось о поездке:"},{"kind":"li","text":"Это нифига не отдых. Из пяти дней приключения только один раз более-менее сносно поспал, проехал за рулём больше тысячи километров и даже времени толком не было достать из рюкзака книжку. Умотался будь здоров.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"На уверенные четыре бала, считаю, справился с задачей суппортера на гонке:","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Отработал в транзитках: встречал, провожал, помогал переодеваться, логистировал шмотки.","listType":"ul","listId":"list-6","level":1},{"kind":"li","text":"Сопроводил на велоэтапе: был рядом, находил карманы для парковки, шустро передавал вещи, еду, напитки и заморозку.","listType":"ul","listId":"list-6","level":1},{"kind":"li","text":"Ориентировал по таймингу, километрам и отсечкам.","listType":"ul","listId":"list-6","level":1},{"kind":"li","text":"Вёл онлайн-трансляцию для заинтересованных лиц и наснимал кучу памятного фото-видео контента.","listType":"ul","listId":"list-6","level":1},{"kind":"li","text":"Написал вот этот текст аж на четыре с лишним тысячи слов. Впрочем, это уже не про задачи поддержки.","listType":"ul","listId":"list-6","level":1},{"kind":"li","text":"При всей трудоёмкости приключения, получил искреннее удовольствие от поездки: потрясающие горные виды, удовлетворение сплочённой командной работой, отлично организованный старт, Ливиньо – место, в котором хочется годик пожить. И кофе пару раз успели попить весьма умиротворённо. Тёплое ощущение от приобретения нового интересного опыта и принесённой миру в лице конкретных людей пользы. Рад, что поехал.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Нам повезло с погодой. Тяжело по жаре в горку, но мы избежали необходимости постоянно менять тёплые вещи и добывать между пит-стопами горячую еду и напитки. Не рисковали здоровьем на обледенелой дороге и не боролись с морозом на беговом этапе. Не факт, что справился бы на четыре, если бы погода была хуже.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"ТОП-советов для суппортера на экстремальном триатлоне от человека, только что получившего такой опыт:","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Машина – обязательно с автоматической коробкой, большая и помощнее. По горам на ручке и без лошадиных сил тяжело. А в маленькой сложнее искать/использовать вещи.","listType":"ul","listId":"list-7","level":1},{"kind":"li","text":"Приезжать на гонку минимум за двое суток до старта. Иначе будет суматоха, усталость и продолбы.","listType":"ul","listId":"list-7","level":1},{"kind":"li","text":"Чек-листы для снаряжения и питания – хорошая идея. Притом, питания и воды на гонку стоит взять с полуторакратным запасом: и пойти что-то может не так, и чужих атлетов при случае подкармливать.","listType":"ul","listId":"list-7","level":1},{"kind":"li","text":"Нужно печатать, выучивать и тренироваться в отслеживании пространственно-временных параметров гонки: дистанция, рельеф, контрольные отсечки.","listType":"ul","listId":"list-7","level":1},{"kind":"li","text":"Вдвоём в поддержке веселее и удобнее, чем одному. И помогать можно эффективнее. Запасной вариант – знакомиться и синергировать с другими командами.","listType":"ul","listId":"list-7","level":1},{"kind":"li","text":"Заставляйте атлета готовиться к гонке. Пусть делает хорошие объёмы и тренирует горки. Вам будет спокойнее и ему тоже.","listType":"ul","listId":"list-7","level":1},{"kind":"li","text":"Миша – ТОП. Впервые при мне человек, которого я знаю лично, смог вытворить такое. Взял и сделал.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Посмотрел на триатлон изнутри – в ближайшие 4-5 лет мои жена, друзья и родственники могут спать спокойно: по середине гостиной не появится велостанок, а вечерний поход в кафе я не променяю на отработку шиномонтажа и скоростного выстёгивания из педалей. Да, конечно, хочется быть похожим на этих точёных атлетов, которых на церемонии награждения вызывают по имени и встречают аплодисментами. Но нужно очень любить сам процесс триатлонирования, чтобы столько инвестировать в отработку всех семи (плавание, велосипед, бег, питание, туалет, транзитки, обслуживание вело) его дисциплин и хранить где-то в квартире пару кубометров необходимого инвентаря.При этом, вполне вероятно, что в ближайшие пару лет подучусь плавать и выступлю где-то на открытой воде – мне интересно.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"С точки зрения аэробной производительности, не такая уж и большая разница между мной и «‎Иконами»: Комрадс - примерно 75% от Ironman, да и Маркотх содержит в себе не меньше трёх четвертей безумия экстремального триатлонного старта. Но, конечно, не одной аэробной живучестью ребята в таких гонках добираются до финиша – не претендую ни на близкий статус, ни на схожее реноме.","listType":"ol","listId":"list-5","level":0},{"kind":"p","text":"Такие дела. На сегодня всё :-)"}]},{"id":"2019-маркотх-2019-86-км","title":"Маркотх 2019. 86 км","docTitle":"2019 — Маркотх 2019. 86 км","sourceUrl":"https://ddv-comrades.blogspot.com/2019/04/2019-86.html","categories":["Ультра","Трейлы","Приключения"],"date":"2019","place":"Новороссийск","distance":"86 км","result":"19:41:00","elevation":"≈4000","format":"Горная ультра","summary":"Первый трейловый забег: сразу горный и сразу ультра. Приключение почти на 20 часов","paragraphs":[{"kind":"p","text":"Про этот день хочу написать большую книгу и обязательно с иллюстрациями, чтобы попытаться сохранить в памяти картинки, мысли и ощущения старта. Целый мир, большой, насыщенный и глубокий. Книги не будет. Будет текстовая зарисовка, похожая больше на облако впечатлений, чем на связный рассказ. Вот она."},{"kind":"h2","text":"Справка о забеге:"},{"kind":"p","text":"Новороссийск, Маркотхский горный хребет. Дистанция 86 километров, набор высоты около 4000 метров, лимит времени на прохождение – 20 часов. Трейл: агрессивные подъёмы, опасные спуски, кусты, камни, грязь, извилистые тропы, редкие относительно шоссейных забегов пункты питания, потрясающей красоты виды, душевные волонтёры, полная жилетка обязательного для допуска к старту инвентаря."},{"kind":"p","text":"Цель на гонку: длинная контрольная тренировка перед возвращением в ЮАР. В горки не бежать, сильно не убиваться – главный старт другой и впереди."},{"kind":"h2","text":"До старта."},{"kind":"p","text":"Холл отеля Новороссийск, три сорок пять утра. Два-три десятка атлетов в беговой форме, с рюкзаками и жилетами. Кто в креслах, кто на полу. Ждём трансфера. Старт запланирован на пять."},{"kind":"p","text":"Три микроавтобуса приходят, очевидно, с запланированным опозданием к четырём часам ровно. Мы грузимся и отправляемся в путь. На 10-15 минут останавливаемся на железнодорожном переезде - пропускаем товарный поезд. Волнительно."},{"kind":"p","text":"Приехали. Выгружаемся. Очередь в кабинки, когда вышел почти все ушли к старту – 600 метров вверх в темноте по умеренной грязи. День обещает быть непростым."},{"kind":"p","text":"Сдаю пакет со сменным вещами и рекавери. Прохожу контроль обязательного снаряжения на старте – меня просят показать загруженный в часы трек и маркировку питания. Еще пять минут, затем старт."},{"kind":"h2","text":"0-4 км. Первые метры."},{"kind":"p","text":"Стартовый гудок раздаётся затемно. Наконец-то! Волнение отступает. Бегу. Размеренно и не спеша – помню рекомендации не стартовать ультра-забеги в темпе выше еле-бега. Через 15-20 минут остаюсь практически один – атлеты широко расползаются по дистанции и большинство из них далеко впереди. Ну так. Новый для меня опыт уже на старте оказаться настолько близко к хвосту змейки. Да не важно!"},{"kind":"p","text":"Первый подъём уже через 800 метров – серпантин. Перехожу на шаг. Снимаю и убираю в жилет ветровку. Окриком возвращаю на трассу нескольких ребят, которые повернули не в ту сторону."},{"kind":"p","text":"Поднимаюсь, на ходу осваивая технику работы палками – до этого только десять метров по квартире из комнаты в комнату. Темп в районе 10-11 минут на километр, если продолжу так – точно уложусь в двадцатичасовой лимит."},{"kind":"p","text":"Ближе к концу подъёма отключаю ведение по треку на часах – раздражает постоянный писк про повороты (на серпантине-то) и быстро уходящая батарейка. Решаю, что справлюсь по разметке. Делаю первые фото с дистанции и пишу первое видео – цель после гонки смонтировать что-то типа отчётного видео-дневника, перемежающегося фотографиями – посмотрим, что выйдет."},{"kind":"h2","text":"4-21 км. Рома."},{"kind":"p","text":"Через сорок минут после старта догоняю Рому, с которым познакомился в субботу за завтраком в отеле. Рома идёт без палок и тоже ставит целью не слишком амбициозное \"уложиться в лимит\". Рома бежит Маркотх третий год подряд, от раза к разу увеличивая дистанцию. Двигаемся вместе. Рома рассказывает про особенности дистанции. Общаемся и восторгаемся окружающей красотой – горы, море, лес, тропа… Виды сказочные. Искренне засомневался, а точно ли я завяжу с длинным бегом в этом году."},{"kind":"p","text":"Вместе доходим до первого пункта питания в районе 11-ого километра. Электрическая помпа не работает, воду во фляги мне доливают из кувшина. Ем шоколад и кусочек банана – не планировал, но очень уж аппетитно выглядит."},{"kind":"p","text":"Тут же встречаем Славу. Славе пятьдесят один год. Он бодро учит нас тому, что гелями питаться не стоит, когда столько всякого изюма есть на пунктах питания. Не остаюсь с ним спорить – раньше и Славы, и Ромы ухожу в крутой подъём. Иду один, отрываясь от ребят."},{"kind":"h2","text":"21-22 км. Гора."},{"kind":"p","text":"Развилка на вершине холма. Можно идти прямо, можно налево. Следующей разметки не видно. Туплю минуту, решаю двигаться влево – блеснуло вдалеке что-то похожее на заветную красную ленту."},{"kind":"p","text":"Спускаюсь легко бегом. Дорога делает крутой изгиб и идёт ещё дальше вниз. Но мне туда не надо.. Перпендикулярно изгибу начинается мощный подъём в гору. Почти с вершины ребята кричат, что это гора – ад. А я и так вижу. Не помню точно, это ощущение на вкус – волнение? Предвкушение? Азарт?"},{"kind":"p","text":"У подножья догоняет Рома. Вместе карабкаемся в сорокапятиградусный подъём – впечатлений море. Как Рома справляет без палок, не представляю. На телефоны фотографируем потрясающие море и горы – это прямо очень. Сп
