  <noscript>Для работы архива нужен JavaScript.</noscript>
  <script id="notes-data" type="application/json">[{"id":"2026-дикий-трейл-в-архызе","title":"Дикий трейл в Архызе","docTitle":"2026 — Дикий трейл в Архызе","sourceUrl":"https://ddv-comrades.blogspot.com/2026/07/blog-post.html","categories":["Трейлы","Приключения"],"date":"2026","place":"Архыз","distance":"40 км","result":"8:26:17","elevation":"≈2000 м","format":"Горный трейл; высота до ≈2800 м","summary":"Редкий старт без гонки за результатом: сорок километров ради гор, снега и видов.","paragraphs":[{"kind":"p","text":"Редкий для меня пост о беге: не про подвиг, преодоление, выживание, личный рекорд и «смотрите, как я могу». А про посильный, радостный и сказочно красивый бег по горам."},{"kind":"h2","text":"Что за гонка"},{"kind":"p","text":"Arkhyz Wild Trail – горные сорок километров со стартом в посёлке Романтик, что в Карачаево-Черкесии, и общим набором около 2000 метров. Отличия от прочего моего горно-трейлового опыта:"},{"kind":"li","text":"Заметно выше над морем","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Относительно короткая дистанция","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Снег на дистанции как часть приключения","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Полтора месяца тренировался к горкам на Лисьей в Балашихе","listType":"ol","listId":"list-1","level":0},{"kind":"li","text":"Цель и смысл участия: наслаждаться красотой видов","listType":"ol","listId":"list-1","level":0},{"kind":"h2","text":"Как побегал"},{"kind":"p","text":"Бежали вместе: я и Юля. Удобно: и веселее, и шеринг эмоций, и комфортное ограничение усилий. А ещё про «чувствовать себя сноровистым и сильным рядом с менее опытной, но отважной напарницей»."},{"kind":"h3","text":"Этап 1. От старта до КП «Пхия»"},{"kind":"p","text":"Первые полтора километра – спокойный бег по брусчатке курортного посёлка. Потом умеренно беговая лесная тропа и тропа вдоль реки. Общий набор на этапе – всего 220 метров."},{"kind":"p","text":"Начали забег в плюс два градуса, но холода не ощущалось. За первые километры разделся до привычного горно-трейлового наряда: длинные тайтсы, компресспортовская футболка и рукава. Лёгкости в беге не чувствовал, но и страдать было не от чего."},{"kind":"p","text":"Самое яркое впечатление этапа – несколько трейлраннеров с головами, эффектно рассечёнными об опасно низкую ветку. Сам момент не застал, но последствия выглядели убедительно."},{"kind":"h3","text":"Этап 2. От Пхии до Загедана"},{"kind":"p","text":"Царь-гора всей дистанции: крутой подъём по грунтовой дороге до высоты 2400, шестьсот метров набора. Пришлось поработать. Благодаря густому туману в процессе не видели всего масштаба предстоящих страданий, а благодаря утренней прохладе – не так уж и сильно страдали."},{"kind":"p","text":"Удивил внедорожник организаторов, который сумел вскарабкаться по дороге вместе с нами – не думал, что гражданская машина вытянет такой градиент."},{"kind":"p","text":"Главное впечатление: ОШЕЛОМЛЯЮЩАЯ КРАСОТА ВИДОВ. Ближе к концу подъёма мы оказались выше облаков. И вот: облака под нами, а за ними – огромные зелёно-каменные горы со снежными вершинами. Ели гели, фотографировали, пили воду. Потом с трудом оторвали глаза от красоты и уговорили себя идти дальше."},{"kind":"p","text":"Конец этапа – относительно плоские красиво-зелёные склоны и даже небольшой сброс высоты перед ПП."},{"kind":"h3","text":"Этап 3. Петля Загедана до Загедана"},{"kind":"p","text":"Геометрия этапа: две горки и два спуска. Максимальную высоту над морем потрогали именно здесь – 2800. Общий набор 710 метров. Впечатлений – несколько товарных составов."},{"kind":"h4","text":"Снежное безумие"},{"kind":"p","text":"Почти сразу после ПП первый глубокий брод через ледяную речушку, а за ним несложный подъём по травянистому склону в сторону снежного горного покрывала. Вокруг цветы: жёлтые, фиолетовые и самые редкие – «чёрные тюльпаны». Которые иногда не чёрные и, почти наверняка, не тюльпаны."},{"kind":"p","text":"Дошли до снежника. В моих кроссовках идти по нему скользко, особенно, когда тропа с боковым уклоном – через шаг соскальзывал вниз перпендикулярно основному направлению движения. Неудобно, но не критично."},{"kind":"p","text":"Поднялись: вид – отвал башки. Боец МЧС говорит, что скоро будет ещё красивее, и предупреждает о скользком снежном спуске. Сначала спуск действительно просто скользкий, надо идти осторожнее. А потом..."},{"kind":"p","text":"Потом широкий в несколько десятков метров снежный склон высотой с восьмиэтажный дом. На нём дежурили спасатели с лошадьми, а десятки трейлраннеров пробовали микрошажками, в полуприседе, с опорой на палки, боком и просто хоть как-нибудь спуститься вниз. Без падений не получалось почти ни у кого. Кто-то, упав, скользил вниз 3-4 метра. Девушка, потеряв палку, кинематографически-завораживающе съехала на попе до самого низа. Затем так же проехал парень, который только чудом не сбил никого с ног. Оба отделались лёгким испугом. Палку подняли неравнодушные и вернули хозяйке."},{"kind":"p","text":"Я и Юля спустились относительно спокойно. Не быстро, с тормозными заземлениями в снег и лишь с малыми драмами. Юлю чуть не снёс палкой тот самый второй поехавший до низа бегун. А я был в шаге от перелома беговой конечности: левая нога под прямым углом по колено провалилась в снег, когда остального меня несло с уклона вниз – обошлось."},{"kind":"p","text":"Это был первый снежный спуск из многих, но на следующих градиент был спокойнее, а я – увереннее: приноровился и с диким азартом на большой скорости сбегал их вниз, чередуя быстрые короткие шаги с сноубордическим скольжением по несколько метров на стопах."},{"kind":"h4","text":"Рододендроновый экстрим"},{"kind":"p","text":"Спустились до 2500 метров и снова в горку. По пути – наполовину оттаявшее горное озеро. Таких чудес света должно было быть на дистанции около дюжины, но трек изменили за три дня до старта: часть перевалов и склонов не успели сбросить зимние шкуры до состояния, безопасного для любителей."},{"kind":"p","text":"У озера – близкий к вертикальному подъём спиной к обрыву по неуверенным коротким и высоким земляным ступеням среди рододендронов. Юля мужественно боролась со страхом и не оглядывалась назад, чтобы защитить себя от подступающей панической атаки. Подъём действительно был… скажем, интересный."},{"kind":"p","text":"За преодоление была положена награда – один из самых сильных видов дистанции: долина и высоченные горы вокруг неё – пейзаж на миллион долларов. Именно про него, видимо, говорил спасатель ещё перед «горнолыжным склоном»."},{"kind":"p","text":"Снежные спуски чередовались с обычными по грунту и тропам. Бегать вниз теперь, после тренировок на Лисьей, мне нравилось. Замкнули петлю и вернулись к ПП. Двадцать третий километр. Самое сложное уже позади. И самое красивое тоже."},{"kind":"h3","text":"Этапы 4-5. От Загедана до Абиширы и далее к финишу"},{"kind":"p","text":"Жарко, но терпимо. Склоны, ручьи, броды, немного грязюки и виды на горные реки. Оказалось, что красотой тоже можно пресытиться – стало меньше новизны и вау-эффектов, хотя качество картинки оставалось вполне себе. Мозг переключился в типовой для последней трети гонки режим: выполнил нехитрые расчёты и включился в игру «выбежать из девяти часов»."},{"kind":"p","text":"После 30-го километра до финиша оставалось два небольших подъема по 250-300 метров, ПП и два царь-спуска метров по 400-600. Самые яркие эмоции этапа – лихие длинные пробеги вниз по плотным грунтовым каменистым дорогам. Летел по камням как косуля, ловко выбирая траекторию и точки для постановки стоп. Удовольствие в чистом виде!"},{"kind":"p","text":"Было слегка тревожно за будущее состояния коленей и квадрицепсов, но азарт и радость движения гнали вперёд. И получалось! Впервые так уверенно и сильно чувствовал себя на спусках. Спасибо самому себе за идею хоть как-то поготовиться заранее к горной специфике."},{"kind":"p","text":"Усталость была, да. Особенно на последней горочке. Да и спуски мы бежали не все – где покруче и идти сложнее, чем бежать – лихачили. Где градиент небольшой – отдыхали и проходили пешком. Не было цели и желания убиваться."},{"kind":"p","text":"Финишные полтора километра – бегом по посёлку. Финишные триста метров – дежурное ускорение, чтобы самим себе сообщить «мы хотим, мы можем, мы делаем, мы веселимся»."},{"kind":"p","text":"Понравилась ли гонка? Сто процентов!"},{"kind":"h2","text":"Наблюдения по ходу гонки"},{"kind":"li","text":"Мои трейловые кроссовки ни к чёрту – скользят. Там, где Юля уверенно делает шаги, я съезжаю. Из плюсов – непробиваемые, и поэтому здорово годятся для каменистых сбеганий вниз. Но как будто бы этого мало. Пора искать новую пару?","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Злое солнце. Не думал про него по ходу дистанции, но впервые в истории: обгорели плечи под футболкой из-за едва-едва заметной вентиляционной перфорации. И обгорела относительно волосистая часть головы в прорези кепки над липучкой.","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Живые ноги на следующий день! Есть усталость, есть забитость. Но по уклонам и лестницам мог легко ходить и вверх, и вниз – без боли и особых усилий. Впервые после гор!","listType":"ol","listId":"list-2","level":0},{"kind":"h2","text":"Резюме"},{"kind":"p","text":"Горы Архыза – one love. Сорок километров в горах без чрезмерной жары – нет ощущений теста на выносливость и работы на пределе. Хорошо потрудился, но не страдал и не упоролся. И, главное: разнообразно, амплитудно и многократно насладился процессом – не на каждом забеге такое бывает. Аминь. )"}]},{"id":"2025-сутки-бегом-дубль-два-история-одной-неудачи","catalogPrefix":"Сутки 2025 ·","catalogTitle":"Старт","catalogSubtitle":"Сход после 100 км","title":"«Сутки бегом», дубль два. История одной неудачи","docTitle":"2025 — «Сутки бегом», дубль два. История одной неудачи","sourceUrl":"https://ddv-comrades.blogspot.com/2025/05/blog-post.html","categories":["Ультра","Приключения"],"date":"2025","place":"Москва","distance":"100 км","result":"10:26:00 (сход)","elevation":"","format":"24-часовой бег","summary":"Вторая попытка суточного бега закончилась сходом после ста километров из-за боли в ахиллах.","related":[{"id":"2025-сутки-бегом-дубль-два-подготовка","label":"Как готовился ко вторым суткам"}],"paragraphs":[{"kind":"p","text":"Краткое содержание заметки: «Замах на рубль, удар на копейку». Сошёл после 10,5 часов и 100 километров из-за боли в ахилле и тяжести пессимистичных мыслей. Важны ли детали?"},{"kind":"h3","text":"Перед гонкой"},{"kind":"p","text":"Про подготовку подробно писал пару недель назад – всё чётко: хорошие объёмы, мощные длительные, много работ, отработанная схема питания, укрепляющие горочки и подобранные под слабые места ОДА специальные упражнения."},{"kind":"p","text":"Ещё собрал команду поддержки, какой на стадионе ни у кого больше не было – многочисленную, ответственную, вовлечённую и заботливую. И с инвентарём порядок: проверенная экипировка, шатёр, кресла, столы, скамейка, аптечка, запас вещей для утепления и на смену."},{"kind":"p","text":"Вне моего прямого влияния оставалась только погода – десять дней смотрел за изменениями прогноза: то жарко, то солнечно, то ураган и ливень обещают на оба дня. Но к реальной погоде не придраться: почти идеальные для бега от трёх до восьми градусов тепла без солнца и осадков. Только ночью наледь неприятно покрыла дорожки стадиона, но в этот момент меня на нём уже не было. Увы."},{"kind":"h2","text":"Гонка"},{"kind":"p","text":"Без десяти секунд опоздал на старт. На стадион приехал вовремя: полтора часа было между получением номера и началом гонки. Хотел переодеться с минимальным запасом, чтобы не замёрзнуть – с этим и вышел казус: часы отстали от реального времени на 15 минут. Валю на глушилки GPS, но настоящей причины не знаю."},{"kind":"p","text":"И вот я не торопясь переодеваюсь, а у всех уже торжественная линейка. Я иду в туалет из почему-то пустой раздевалки, а все уже пакуются в стартовый коридор. Телефон давно выключен и убран, а в него звонит растерянная команда: «Ты где?!» Вломились ко мне в раздевалку, надели на меня номер и выгнали в бег."},{"kind":"p","text":"В хвост кластера забежал аккурат во время обратного отсчёта. Зато не замёрз. И не нервничал лишнего."},{"kind":"h4","text":"Первый час"},{"kind":"p","text":"Начал неспешно, бежал комфортно, темп выходил в районе 5:40, ничто не беспокоило. Привыкал к стадиону, разглядывал бегунов."},{"kind":"p","text":"Время летело быстро. Из развлечений – обскакивал по островкам суши не успевшую досохнуть дробную лужу на вираже. Из-за неё бежал не в основных кроссовках, а в тех, которые взял на случай дождя. Лужа мелкая, можно было бы и не заморачиваться."},{"kind":"p","text":"Когда час закончился, порадовался: даже не начал уставать, а уже больше четырёх процентов дистанции! Следом напомнил себе, что не стоит по первому отрезку делать выводы."},{"kind":"h4","text":"Второй час"},{"kind":"p","text":"Эффект новизны прошёл, минуты стали сменяться медленнее. Всё ещё ничто не беспокоило, но душевную лёгкость ощущать перестал: «бег – работа, надо бежать, бегать ещё долго, бежим». Помнил, что циклы настроения чередуются, и унынию не поддавался."},{"kind":"h4","text":"Третий и четвёртый часы"},{"kind":"p","text":"Вработался. Поймал ритм. Включился в режим: раз в полчаса пью 150 миллилитров питания и иду пешком минуту, на следующем кругу пью воду. Подустали ягодичные мышцы – привычное ощущение, даже переживать на это счёт не стал."},{"kind":"p","text":"Получасовые отрезки сменяли друг друга. Средний темп так и держался в районе 5:40. Перебрасывался короткими фразами со знакомыми. Наслаждался перформансом от команды поддержки: криками, танцами и позированием для Матч ТВ."},{"kind":"p","text":"Кажется, эти два часа – самый кайфовый отрезок дистанции. И последний, когда всё шло хорошо."},{"kind":"h4","text":"Пятый и шестой часы"},{"kind":"p","text":"Появился и стал нарастать дискомфорт в колене и стопах. Бежать ощущения не мешали, но внимание привлекли – что-то рано. Задумался."},{"kind":"p","text":"Пробежал первый марафон из пяти целевых! С одной стороны – радостно. С другой – уже есть тревожные сигналы, а это только пятая часть дистанции. Возложил надежды на запланированный после шести часов бега перерыв: затеял поменять кроссовки в расчёте на то, что менее стоптанная и более любимая пара поможет решить возникшие проблемы."},{"kind":"p","text":"За шесть часов пробежал шестьдесят два километра – приятное и допустимое опережение плана. Со смешанными чувствами пошёл в раздевалку: туалет, вазелин, сменить кроссовки."},{"kind":"h4","text":"Седьмой час"},{"kind":"p","text":"После перерыва полегчало. Кажется, больше сказался сам отдых в 10-12 минут. Но и смена обуви тоже: пропало ощущение плоской неработающей стопы, и боль в колене стала менее выраженной."},{"kind":"p","text":"Новые кроссовки – новые тревоги: появились неоднозначные ощущения в ахилле. После пары кругов расслабил шнурки, стало чуть лучше. Но, вообще-то, нездоровая тема."},{"kind":"p","text":"Седьмой час понравился. И бежалось легче, и мысли стали светлей и оптимистичней. А вдруг всё получится?"},{"kind":"h4","text":"Часы с восьмого по одиннадцатый"},{"kind":"p","text":"Свежести и оптимизма от короткого перерыва хватило на час: колено снова напомнило о себе, а дискомфорт в ахилле вырос от тревожного до угрожающего."},{"kind":"p","text":"А ещё усталость и ужасная ментальная жвачка из мрачных прогнозов, неудовольствия, сомнений и бесконечных торгов о том, как правильно оценивать свои мысли по шкале между «Ловушками разума» и «Благоразумием»."},{"kind":"p","text":"Хотел, чтобы боль в ногах стала непреодолимой и очевидно травматичной, – с чистой совестью бы закончил соревнование и поехал домой. Но нет. Я мог бежать. И даже как будто бы не сильно провисал по темпу – радостная нотка в мрачном коктейле ощущений и мыслей."},{"kind":"p","text":"Решил, что хочу пробежать 100 километров как минимально приемлемую ачивку от участия: сотка по личнику – достойная история, которую можно занести себе в актив."},{"kind":"p","text":"Сто километров – скромный относительно изначального плана рубеж, но даже до него добираться было тяжело: время ползло, ноги устали, ахиллы болели, мозг поедал себя, удовольствия ноль. Зачем всё это? Зачем так мучить человека, которого любишь – себя?"},{"kind":"h4","text":"Финиш"},{"kind":"p","text":"Пока бежал, думал, что преодолею 100 километров за десять часов и пять-семь минут. Вышло – 10:21. Всё ещё в границах целевого плана, но с сильно меньшим оптимизмом по поводу возможности добиться цели, даже если не сойду из-за травмы."},{"kind":"p","text":"Постоял пару минут у шатра и после этой паузы едва-едва мог бежать из-за боли в ахилле. Договорился с командой, что отдохну в раздевалке 5-10 минут и будем держать совет:"},{"kind":"li","text":"Аргументы в пользу схода: низкая вероятность набегать хотя бы 200 километров из-за тормозящей боли, высокий риск серьёзной травмы, дикое нежелание страдать за просто так и возможность уйти домой на мажорной ноте – условно добровольно и сразу после личника на сотке.","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Аргументы в пользу продолжения забега: а вдруг потом пожалею? А вдруг это просто слабость и временный кризис? А товарищи на стадионе – оставить их? Не съел и половину питания – выкидывать?","listType":"ul","listId":"list-1","level":0},{"kind":"p","text":"Выбрал сойти. Из раздевалки вышел, сильно хромая даже под обезболом и без ощущения, что это состояние можно разбегать. Вероятно, выбора как такового у меня и не было."},{"kind":"p","text":"Сдал чипы, забрал медаль, домой."},{"kind":"h3","text":"После гонки"},{"kind":"p","text":"До дома довезли: помылся, поел, лёг спать. Утром нога болела меньше, но угрожающе посинела. Перед визитом к травматологу поехал на стадион снять лагерь и поддержать на финише добегающих друзей."},{"kind":"p","text":"В травмпункте успокоили – сухожилия целы."},{"kind":"quote","text":"Основной диагноз: S93.4 – растяжение и перенапряжение связочного аппарата правого голеностопного сустава, тендовагинит. Со слов, травму не помнит. Во время пробежки появилась нарастающая боль, со временем болевой синдром усилился. Болезненность при пальпации. Незначительный отёк по наружной задней поверхности сустава. Деформации нет. Крепитация отсутствует. Движения в суставе в полном объёме, болезненные. На рентгенограммах без патологии."},{"kind":"p","text":"Спустя два дня хожу не хромая, синевы нет, отёк спал. Моральное состояние – тоже окейное, претензий к себе нет. По-доброму завидую финишёрам, которые смогли."},{"kind":"h3","text":"Другие мысли"},{"kind":"li","text":"Очевидная шутка на тему: показал отличный результат, пробежав сутки за рекордные 10,5 часов.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Личник на 100 километрах – неплохо. Унёс свою порцию удовлетворения даже с неудачного старта.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Горд, что прислушался к себе, а не поддался мыслям вида «а что люди подумают?» и уговорам продолжить бег от команды, знакомых бегунов и тренера.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"«Чемпион околобега»: подготовка, шатёр, кресла, столы, команда, питание, инструкции, пропуск для машины – эталон организации. А результат – 111-й из 132 участников.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Суточный бег – с какого-то момента тягостная, пессимистичная, неприятная, сложная ментальная жвачка. Обидно, что не развил навык «осваиваться в дискомфорте». Раз до сотки всё равно добегал, почему бы не делать это с лёгкой головой? Не хочу быть угрюмым терпилой, даже когда тяжело.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Лена Зеленкова: «Устала, как будто сотку сбегала. В прошлый раз всё намного хуже было, когда целиком сутки осилила», – очень точная формулировка, у меня так же. Быстро восстановился и пришёл в себя: выносливости было на всю дистанцию, а побегал всего ничего.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Новые лайфхаки: хомуты для крепления чипов на шнурки – ТОП-решение. А для двух номеров (спереди и сзади) удобно использовать один шнурок или специальный минималистичный поясок.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"На «Вымпеле» понравилось больше, чем на «Искре»: ближе к дому, и тёплые раздевалки с нормальными туалетами и раковинами решают. Но общедоступные парковки в полутора километрах от стадиона – это жесть.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"В команде было около десяти человек. Ещё столько же просто приходили поддержать на стадион. Полезно, приятно, ценно. И есть диссонанс между уровнем их поддержки и моего бега, а хотелось бы соответствовать.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Пока совсем нет идей о причинах неудачи, и даже, в какой стороне искать, предположить не могу.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Про медаль. Красивая! Оставить или выкинуть? Нет ощущения, что сутки пробежал. А зачем мне чужие медали?","listType":"ul","listId":"list-2","level":0},{"kind":"p","text":"Побегу ли ещё раз? Очень маловероятно. Прав был Дима из 2023-го: не нужны ему вторые сутки, не нужны!"}]},{"id":"2025-сутки-бегом-дубль-два-подготовка","catalogPrefix":"Сутки 2025 ·","catalogTitle":"Подготовка","catalogSubtitle":"Цель: 210–215 км","title":"«Сутки бегом», дубль два. Подготовка","docTitle":"2025 — «Сутки бегом», дубль два. Подготовка","sourceUrl":"https://ddv-comrades.blogspot.com/2025/04/blog-post.html","categories":["Ультра"],"date":"2025","place":"Москва","distance":"Цель: 210–215 км","result":"","elevation":"","format":"Подготовка к 24-часовому бегу","facts":[{"label":"Подготовка","value":"18 недель"},{"label":"Цель","value":"210–215 км"},{"label":"Формат","value":"Суточный бег","wide":true}],"summary":"Восемнадцать недель подготовки ко вторым суткам: объёмы, питание, крепость ног и ожидания от старта.","related":[{"id":"2025-сутки-бегом-дубль-два-история-одной-неудачи","label":"Что получилось на самом старте"}],"paragraphs":[{"kind":"p","text":"Плохое быстро забывается, а жажда приключений и желание потешить эго берут верх над инстинктом самосохранения: я решил пробежать сутки ещё раз."},{"kind":"p","text":"Расскажу сейчас про подготовку, а через 2-4 недели, надеюсь, поделюсь впечатлениями о самом старте. Про итерацию 2023 года можно почитать по ссылкам: мысли о гонке, подготовка, сам старт."},{"kind":"h2","text":"Зачем снова"},{"kind":"p","text":"Первым заходом на сутки я остался доволен – фантастический результат, классное кино (раз, два, три), интересный опыт. Было очень сложно, многое пошло не по плану, страдал от всей души и пробежал чуть меньше гипотетически возможной «программы максимум»."},{"kind":"p","text":"Прошло два года. Я стал быстрее, сильнее и отдохнул от беспощадных длительных продолжительностью в рабочий день. Почему бы не попробовать ещё раз?"},{"kind":"p","text":"Основная причина: манит число двести одиннадцать. Не круглое? Напротив: ровно пять марафонов. «Пробежал пять марафонов за раз» – звучит же, да?! Ещё это норматив на первый взрослый разряд по лёгкой атлетике с небольшим запасом – тоже приятно. А о том, что обещал таких экспериментов над собой больше не ставить, почти уже и забыл."},{"kind":"h2","text":"Подготовка 1. Выносливость"},{"kind":"p","text":"Сделать подготовку идеальной не вышло. Было бы здорово приступить за полгода, быстро выйти на 400+ километров в месяц и подойти к старту без тени сомнений в собственных силах."},{"kind":"p","text":"Начать готовиться в ноябре у меня получилось, но уже через две недели пришлось уйти в перерыв на полтора месяца – обидная травма стопы из-за перетянутой кроссовки. Вернулся к бегу в январе – фантазии про шесть месяцев ударной подготовки стремительно отменились."},{"kind":"p","text":"Но кое-что вышло. В таблице сравнение подготовки в этом году с той, что была в 2023-м:"},{"kind":"table","rows":[["","2023","2025"],["Период подготовки","20 недель","18 недель"],["Тренировочный план","Самостоятельно плюс советы","С тренером Кириллом Смирновым"],["Тренировки","Кроссы и длительные","Кроссы, две-три работы в неделю, длительные"],["Количество тренировок в неделю","Беговых: 3\nСиловых: 2","Беговых: 6\nВело: 3-4\nОФП: 6-7"],["Объёмы","Месяцев 400+: 2\nНедель 100+: 4\nВ среднем за неделю: 78","Месяцев 400+: 3\nНедель 100+: 10\nВ среднем за неделю: 92"],["Длительные","От марафона и более: 12 штук\nТОП 3 длительных: 73, 66, 66","От марафона и более: 6 штук\nТОП 3 длительных: 81, 78, 50"]]},{"kind":"h2","text":"Подготовка 2. Питание"},{"kind":"p","text":"Одна из главных проблем прошлых суток – спазмы живота от любого питания начиная с шестого часа бега. В качестве работы над ошибками придумал такое:"},{"kind":"li","level":0,"listId":"prep-food-2025","listType":"ul","text":"Быть выносливей и сильнее. Темп будет примерно тот же, но для организма он будет проще – еда должна усваиваться легче."},{"kind":"li","level":0,"listId":"prep-food-2025","listType":"ul","text":"Паузы в беге для еды. Планирую переходить на шаг во время питания, чтобы меньше тряски для желудка в процессе."},{"kind":"li","level":0,"listId":"prep-food-2025","listType":"ul","text":"Жидкое хэндмейд-питание вместо покупных гелей. По идее, тоже должно быть попроще с ним справляться организму."},{"kind":"p","text":"На длительных протестировал эту схему. Замешивал в воду мальтодекстрин, сахарозу и сывороточной протеин. Пропорции: 68:34:5. Две порции питания на час – 55 грамм порошка на пол-литра. Зашло хорошо, проблем с ЖКТ не было, даже, я бы сказал, вкусно."},{"kind":"h2","text":"Подготовка 3. ОДА"},{"kind":"p","text":"Вторая проблема – крепость ног. Когда бегаю что-то околомарафонское, проблем с ними не бывает, работают чётко. Но на прошлых сутках после примерно 14 часов бега сильно болело место, которое я решил называть «надкостницей» (на самом деле не она, но тоже что-то на голени)."},{"kind":"p","text":"В этот раз при подготовке в этом же месте болела нога после первой восьмичасовой длительной. А после второй другое старое уязвимое место – паховая связка. Было бы обидно при хорошей выносливости показать слабый результат из-за травмоопасной боли, блокирующей бег."},{"kind":"p","text":"Тут разбирался так: немного СФП на ноги, регулярные скоростные работы, эпизодические ускорения в горки. И на последние две недели – дополнительные упражнения от Миши Ермохина. Поможет ли? Увидим."},{"kind":"h2","text":"Ожидания и прогноз"},{"kind":"p","text":"Есть десяток причин, по которым у меня могут на соревнованиях не получится целевые 210-215 километров: внезапная болезнь, слишком жаркая погода, необязательная травма, отравление, недопуск из-за неправильно оформленной страховки – вариантов масса."},{"kind":"p","text":"Но цифры в финишном протоколе – не самая важная штука для меня сейчас. Я тренировался упорно и дисциплинированно, проделал большую работу, знатно упахался и готов к старту. Прошлой формы хватило на 192 километра. Текущая и ощутимо, и измеримо лучше. Она ничего не гарантирует, но она и есть значимый для меня результат."},{"kind":"p","text":"Чего я жду? Жду, что будет нечеловечески тяжело на второй половине дистанции. Что буду в сердцах проклинать решение бежать сутки ещё раз. Что буду хотеть бросить бег и сойти. Что буду вращать в голове полдюжину разных способов считать часы, минуты, километры и круги до финиша. И, честно говоря, хотелось бы со всем этим справиться."},{"kind":"p","text":"Хочу через пару часов после финального гудка почувствовать «удовлетворение победителя». И чтобы с чувством «я молодец, горд, крут и невероятен» прожить следующие пару недель. Всё, что зависело от меня, я уже сделал. Следим все вместе за новостями. 😎"}]},{"id":"2024-марафон-белые-ночи-2024","title":"Марафон «Белые ночи 2024»","docTitle":"2024 — Марафон «Белые ночи 2024»","sourceUrl":"https://ddv-comrades.blogspot.com/2024/07/2024.html","categories":["Марафоны"],"date":"2024","place":"Санкт-Петербург","distance":"42,2 км","result":"3:37:44","elevation":"","format":"Шоссейный марафон","summary":"Возвращение на любимый петербургский марафон перед осенней попыткой на результат.","paragraphs":[{"kind":"p","text":"«Белые ночи» до поездки я бегал четыре раза, результаты: 4:10, 4:22 , 3:50 и 4:13. Про каждый из них есть своя история и свои особые обстоятельства. В этой главе расскажу историю и обстоятельства своего пятого марафона в Питере."},{"kind":"h2","text":"Контекст и ожидания"},{"kind":"p","text":"Последний раз в полную силу я бежал марафон в конце 2019 года в Валенсии , тогда и установил на плоской трассе в умеренно тёплую погоду ныне действующий личный рекорд: 3:27:16. После этого тешил эго бегового достигаторства другими способами. И вот спустя почти пять лет решил снова сделать быстрый марафон."},{"kind":"p","text":"Даже два быстрых марафона. «Белые ночи» – умеренно напрягаясь пробежать за 3:27:00, обойдя валенсийский рекорд. А уже осенью: на все деньги стартовать Московский марафон и проверить гипотезу о том, что результат 3:10-3:15 на марафоне для меня достижим, а не просто фантазия тренера об устройстве мира."},{"kind":"p","text":"Почему должно было в Питере всё получится:"},{"kind":"li","text":"Плоская трасса","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Ночной забег: нет солнца, нет жары, не нужны крем от загара и кепка","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Отлично готов: шесть тренировок в неделю, хорошие объёмы, много работ, длительные бегал по 5:00, включаю контрольную на 32 километра","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Бежать планировал в компании тренера и друга: и скучно не должно быть, и поддержать есть кому","listType":"ul","listId":"list-1","level":0},{"kind":"p","text":"Не думал, что будет просто – даже на фановых марафонах обычно приходится в какие-то моменты погрустить, но в результате был уверен. Я готов!"},{"kind":"h2","text":"Что получилось. Начало"},{"kind":"p","text":"Логистика до стартового городка, посещение туалетов, разминка – всё чётко, без проблем. Бежать сразу начали с целевым средним темпом – около 4:54 на километр."},{"kind":"p","text":"По предыдущему опыту удачных марафонов на результат ожидал комфортного бега первые 20 километров, умеренно тяжёлого до 30-го километра и чувствительно страдательного на последнем отрезке до финиша. Реальность с ожиданиями не совпала: сложным бег начал казаться уже в самом начале, а после 15-го километра впервые захотел перейти на шаг – настолько было нездорово."},{"kind":"p","text":"Стало очевидно, что до финиша в целевом темпе не дотерплю. Решил попробовать продержаться хотя бы до середины дистанции: хоть какой-то результат, не так стыдно будет пешеходить и меньше вероятность, что встречу болельщиков из числа знакомых – не охото было отвечать на сочувственные взгляды и вопросы «что случилось?»."},{"kind":"h2","text":"Что получилось. Середина"},{"kind":"p","text":"Болят ягодичные мышцы, устал, дышать тяжело, вообще всё сложно. До 21-го километра еле-еле дотянул в целевом марафонском темпе – время по чипу: 1 час 43 минуты 25 секунд."},{"kind":"p","text":"Попробовал не сбавлять и терпеть, пока физически получается бежать, но темп начал залипать: средний с 20-го по 25-й километр – 5:08. А дальше – всё, быдыщ! Больше не могу. Перехожу на шаг на ближайшем пункте питания и каждом следующем, а средний темп от сих и до финиша – что-то в районе 5:30. Желаемого результата не будет, вероятность ноль."},{"kind":"p","text":"С 21-го по 28-й километры – самый психологически тяжёлый отрезок марафона. Телу всё ещё адски неприятно, а в голове разрушающие мысли о том, что вот-вот начну чередовать медленный бег с ходьбой и буду таким образом добираться до финиша невыносимые 2,5-3 часа."},{"kind":"h2","text":"Что получилось. Финиш"},{"kind":"p","text":"Вторая половина марафона на карте выглядит так: с 21-го километра по 30-й – бег по набережной в сторону от финиша. С 30-го до финишной арки – бег по той же набережной в обратную сторону с двумя ответвлениями в сторону города и обратно."},{"kind":"p","text":"И вот после разворота на 30-м километре стало попроще. Перестало ухудшаться самочувствие: при темпе в районе 5:30 оно вышло на плато. И перестал пугать обратный отсчёт километров до финиша: 12-10-8 – это всего около часа бега, и даже если быстрым шагом – уже не вечность. Фух! Стало пободрее, оклемался."},{"kind":"p","text":"На набережной ветер, но сильно не беспокоит. Воспрял духом: 41-й за 5:10, 42-й за 4:50, финишные 200 метров по 3:30. Ура! Упасть на землю не хочется, выкинуть кроссовки не хочется, ощущение довольства жизнью присутствует."},{"kind":"p","text":"Результат: 3:37:44, на 11 минут медленнее целевого. Настолько плохо было в середине дистанции, что более-менее нормальное самочувствие на последних километрах добавило контраста: доволен не только тем, что всё закончилось, но и вообще."},{"kind":"h2","text":"Послесловие и выводы"},{"kind":"p","text":"Ночной старт, плохое покрытие, встречный ветер, тёплая погода – столько уважительных причин! Казалось бы, бери любую в качестве оправдания и закрывай вопрос. Но я выбрал две альтернативных: «Не зашло» и «Проклятие БН 2024»."},{"kind":"p","text":"« Не зашло » – такое действительно бывает. Но пользы из этой причины не извлечь и выводов не сделать. И самый страшный её грех – она скучная! Даже обсудить нечего."},{"kind":"p","text":"« Проклятье » – это другое дело. Пользы не больше, зато какой колорит! Легко можно накинуть в эту топку:"},{"kind":"li","text":"Все ТОП 10 финишёров вторую половину пробежали медленнее первой. Пятеро из них потеряли на второй половине от 5 до 10 минут!","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Время лидеров на две минуты хуже результатов месячной давности в Казани, и результатов Белых ночей прошлого года. Большая разница для элиты!","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"После 21-го километра я был 1374-м среди мужчин. Потом очень сильно сбавил в скорости и финишировал… 1379-м! Все сбавили?","listType":"ol","listId":"list-2","level":0},{"kind":"li","text":"Почти единогласный вой среди знакомых, которые бежали марафон на результат, про то, что он дался тяжело и пробежали хуже цели.","listType":"ol","listId":"list-2","level":0},{"kind":"p","text":"Получается, как будто бы я просто пробежал в рамках общего тренда, объясняемого этим неведомым проклятием. Нормальных и полезных выводов нет. Просто отдохну недельку и продолжу готовиться к Московскому марафону."}]},{"id":"2024-московский-марафон-2024-прорыв","title":"Московский марафон 2024. Прорыв!","docTitle":"2024 — Московский марафон 2024. Прорыв!","sourceUrl":"https://ddv-comrades.blogspot.com/2024/10/2024.html","categories":["Марафоны"],"date":"2024","place":"Москва","distance":"42,2 км","result":"3:20:00","elevation":"","format":"Личный рекорд; пик формы","summary":"Лучший марафонский результат и кульминация длинного цикла подготовки.","paragraphs":[{"kind":"p","text":"Впервые за пять лет обновил ЛР на марафоне! С предыдущего лучшего результата снял сразу семь минут! А с лучшего Московского – двенадцать. Дико рад. Новый «персонал бест»: 3:20:00."},{"kind":"h2","text":"Подводка"},{"kind":"p","text":"После неудачных «Белых ночей» нашёл у себя железодефицитную анемию и за месяц бодро подлечил её таблетками. Параллельно скинул вес с хороших 64 до классных 62,5 килограммов. Выполнил всё, что для меня придумал тренер на месяцы с июля по октябрь. Результат: лучшая беговая форма за всё время существования бега в моей жизни."},{"kind":"p","text":"Среди прочего сбегал длительную в Измайловском парке со средним темпом 4:41 – получился третий по скорости полумарафон, но с рельефом и в качестве обычной тренировки. И бегал отрезки на стадионе от 400 до 1000 метров в темпе около четырёх минут. Ноги несли, почти все задания без сверхусилий получались лучше плановых цифр от тренера. Дико приятное ощущение, которое напитало уверенностью – редким для меня в беге чувством."},{"kind":"h2","text":"План"},{"kind":"p","text":"Оценив форму, решил пробовать бежать марафон по 4:45. Даже если не получится, должен уверенно обновить личный рекорд и показать хороший результат. Ещё решил, что на каждую из восьми горок накину по 15 условно неотыгрываемых секунд. Итого должно получиться что-то около 3:22 плюс-минус пара минут. Тренер со мной, кажется, был согласен и план не корректировал."},{"kind":"p","text":"Сложнее было выбрать экипировку. Пока обещали что-то между шестью и восемью градусами тепла, планировал бежать в коротких тайтсах, майке и рукавах. Протестировал на вечерней тренировке на стадионе – более-менее окей. Когда стали обещать не больше плюс шести, майку в моих планах заменила футболка. Утром в день старта обещали уже всего плюс четыре – финальный выбор: короткие тайтсы, лёгкая термомайка и футболка сверху."},{"kind":"p","text":"Ещё из плана: питание ДО старта. Строго запретил себе есть накануне после семи вечера – хотел, чтобы утренние ритуалы прошли без неприятных сюрпризов. Так и сделал, так и случилось."},{"kind":"h2","text":"Гонка"},{"kind":"p","text":"Всё предмарафонское получилось как надо: не замёрз до старта, успел необходимое количество раз выгрузить лишнее из организма, умеренно размялся, попал в свой кластер. Оставалось только пробежать по плану."},{"kind":"p","text":"На GPS не рассчитывал, делал километровые отсечки руками по флагам от организаторов. Смотрел на дельту от плановых 4:45 и дополнительно сверял общее время каждые четыре километра с целевыми 19-й, 38-й, 57-й и так далее минутами (с поправкой на горки). Четыре подъёма ждал с 4-го по 11-й километр, ещё четыре – с 18-го по 28-й. Бежим!"},{"kind":"p","text":"Первые 18 километров. Начал легко, бежал с запасом по силам. Горки прошёл без ожидаемых потерь: взбирался чуть медленнее, но целиком отыгрывал на спусках. С первых километров отставал на 10-15 секунд от эталонного плана, но легко наверстал их к концу отрезка. Вначале пожалел, что надел термомайку и взял баф (на руку как манжету) – было жарко. Но первые же порывы встречного ветра сдули жалость вместе с ощущением избыточного тепла. Марафон получался, километры шли уверенно и чётко."},{"kind":"p","text":"Отрезок с 18-го по 30-й километр. Начали побаливать ягодичные мышцы. В горки специально укорачивал шаг и увеличивал каденс, чтобы снизить на них нагрузку. Половинку пробежал за 1:40:28 – это на полминуты быстрее плана. На горках по-прежнему получалось не терять средний темп. После 28-го километра посмаковал мысль, что личный рекорд точно будет: чисто математически стало очень маловероятным растерять 5-7 минут запаса на оставшейся четверти дистанции. Ещё было ощущение, что халтурю и мог бы прибавить. Но, слава опыту и лени, не стал. Это не было халтурой. Это просто был ещё не марафон."},{"kind":"p","text":"Последние 12 километров. Около 30-го километра стало тяжело. Лимитировала в основном не общая усталость, а ноги – ягодичные сильно болели и мешали бежать. Вариант ускориться на «плоском длинном финише по набережной» уже не рассматривал. Мысли в голове были примерно такими: «Сколько километров бега в темпе около 4:45 надо ещё выдержать, чтобы после того, как выставит на 5:00-5:15, финишное время не очень сильно испортилось?». И после каждой следующей отсечки: «Вот бы ещё хотя бы километр или два». Тяжело и страдательно, но темп удержался! Мог позволить себе сбавить, но тогда бы пришлось терпеть это всё ещё дольше."},{"kind":"p","text":"Последние 2 километра. После сороковой отсечки понял, что точно дотерплю. На зубах, но справлюсь. А ещё вспомнил, что марафон – это не 42 километра, а 42,195 – большая, между прочим, разница. Последний километр меня тащил товарищ по Измайлонгу, но даже с его помощью – 4:39. Быстрее уже нет. И никакого спурта на последних 200 метрах – не мог. После ленты хронометража на финише нажал последний раз на отсечку круга и заземлился на колени. Это была славная охота. Время ещё не знал, но по часам на арке прикинул: что-то около трёх двадцати – по верхней границе плана."},{"kind":"h2","text":"Итоги"},{"kind":"p","text":"Путь от арки до раздевалки с прихрамыванием на оба полупопия занял около 20 минут. Снять кроссовки – было счастьем. Приседать и нагибаться – мучением. А потом я с телефона посмотрел свой результат и обомлел – 3:20:00. Костёр!"},{"kind":"p","text":"Это очень быстро! Предел мечтаний на сегодня. А ещё ЭТО КРАСИВО. В протоколе, в почте, в СМС, в гравировке на задней стороне медали – смотрю заворожённо и не могу нарадоваться."},{"kind":"p","text":"Разложился по дистанции максимально удачно: ровно и с небольшим накатом. Половинки: 1:40:28 и 1:39:32. Пятёрки: 23:57, 23:40, 23:51, 23:40, 23:38, 23:35, 23:35, 23:35. Судя по тому, что не смог прибавить на последнем километре и финишной прямой, – выдал все силы, которые были."},{"kind":"p","text":"Доволен? Сказочно!"}]},{"id":"2023-сутки-бегом-отчет-о-старте","catalogPrefix":"Сутки 2023 ·","catalogTitle":"Старт","catalogSubtitle":"192 км · 24 часа","title":"«Сутки бегом». Отчёт о старте","docTitle":"2023 — «Сутки бегом». Отчёт о старте","sourceUrl":"https://ddv-comrades.blogspot.com/2023/05/blog-post_21.html","categories":["Ультра","Приключения"],"date":"2023","place":"Москва","distance":"191,869 км","result":"24:00:00","elevation":"","format":"24-часовой бег","summary":"Первые сутки бегом и почти 192 километра на стадионе.","related":[{"id":"2023-сутки-бегом-за-шесть-недель-до","label":"За шесть недель до старта"},{"id":"2023-сутки-бегом-за-одну-неделю-до","label":"За одну неделю до старта"}],"paragraphs":[{"kind":"p","text":"Для литературных спринтеров, интересующихся стайерским бегом, – краткое содержание огромной заметки:"},{"kind":"quote","text":"За 24 часа пробежал по стадиону 191 километр 869 метров. Сложно, трудно, доволен. Основные неприятности: дневная жара, сложности с питанием и боли в надкостнице. Основные яркости: команда поддержки, болельщики, съёмка фильма, динамика собственных состояний и борьба с кризисами."},{"kind":"p","text":"Двести километров не пробежал, но и скучно не было. Полный текст заметки: 5 685 слов на 30-35 минут чтения, для простоты навигации можно ориентироваться на структуру:"},{"kind":"li","text":"До забега: последняя неделя подготовки, правила соревнования, план на гонку и утро перед стартом","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Про саму гонку: первые шесть часов, вторые, третьи и финальная четверть","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Впечатления и мысли: про результат, про мысли и эмоции в процессе, о самочувствии, команда и поддержка, съёмка фильма, другие впечатления","listType":"ul","listId":"list-1","level":0},{"kind":"li","text":"Заключение","listType":"ul","listId":"list-1","level":0},{"kind":"h2","text":"1. До забега"},{"kind":"p","text":"Про первые мысли на тему суточного бега и процесс подготовки уже писал в « За шесть недель до‎ » и « ‎За одну неделю до ». Продолжу с места, где остановился."},{"kind":"h3","text":"Последняя неделя подготовки"},{"kind":"p","text":"Соревнование стартует в субботу в 12:00 и длится 24 часа. Хорошей идеей показалось попробовать выспаться и отдохнуть до и после забега: взял на работе отпуск с четверга по вторник."},{"kind":"p","text":"Финальные этапы подготовки:"},{"kind":"li","text":"Побегать днём в тёплую погоду. Природа не оставила шансов на годную акклиматизацию к соревновательным условиям: последние пару недель бегал при 2-7 градусах тепла, а на стартовую неделю синоптики обещали плавный рост до солнечных +23 аккурат к субботе. Ох. Сделал во вторник, четверг и пятницу две с половиной пробежки в комфортном темпе ровно в середине дня – пусть организм хоть чуть-чуть привыкнет к теплу.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Подготовить план на гонку для себя и команды. Дополнить, проверить, прислать команде и, на всякий случай, распечатать пару копий. В плане не только про темп на разных отрезках, ещё про циклы обновления вазелина и крема от загара, режим питания, переодевания и целый список решений на тему «‎если случилось ЭТО, делаем ТО».","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Собрать вещи. Тут и из шкафов в чемодан переложить разный стафф по чек-листу, и более сложные логистические задачи: например, забрать шатёр, стол, стулья и кресло для лагеря. Что-то докупить, что-то одолжить.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Дорешать организационные моменты. Где, когда и с кем встречаемся. Купить страховку. Спланировать заезд в апартаменты, которые мы сняли около стадиона – в них удобней провести часть стартово-финишных процедур, заряжать девайсы и поспать ночью поддерживающей меня супруге.","listType":"ul","listId":"list-2","level":0},{"kind":"li","text":"Подвестись. Сон и умеренная активность в течение недели, макаронная диета с вечера четверга. Цель – быть свежим и отдохнувшим к началу забега. И без всякого лишнего в желудке и кишечнике.","listType":"ul","listId":"list-2","level":0},{"kind":"h3","text":"Правила соревнования"},{"kind":"p","text":"Форматы беговых соревнований на 24 часа немного отличаются от старта к старту. Иногда – длиной и формой основного круга дистанции. Иногда наличием других соревновательных дистанций, на которых параллельно соревнуются атлеты."},{"kind":"p","text":"Расскажу на примере конкретного старта – «‎Сутки бегом». В нём, собственно, и участвовал."},{"kind":"li","text":"Атлеты бегут по кругу стадионной дорожки длиной 400 метров. Чтобы было немного интересней, направление движения каждые 4 часа меняется на противоположное.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"У атлетов на ногах чипы. А в месте старта дорожку пересекает считывающая лента. Таким образом фиксируются промежуточные результаты, которые каждый час вывешивают на стенде и объявляют в громкоговоритель по стадиону: место, фамилия и имя, набеганные к очередной отсечке километры.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"Чтобы попасть в протокол финишёром, достаточно стартовать вместе со всеми и пробежать хотя бы один полный круг. Но трушным и почётным считается находиться на стадионе все 24 часа. А для тех, кто за сутки впервые пробежит больше 100 километров, положен специальный значок – фигурка Стива Префонтейна. На мой вкус, хорошая идея: до ста километров называться суточником как-то неинтересно.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"На одной длинной стороне стадиона – судейская палатка, организаторский столик с напитками, столик с едой, столик с губками и мусорные пакеты. Среди напитков: вода, изотоник, кола, энергетик и чай. Что было из еды – не знаю, не смотрел.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"На другой длинной стороне – столики участников и их команд поддержки, если они есть. Тут можно попить и поесть что-то своё, переодеться, отдохнуть, получить порцию моральной поддержки и даже поспать, если есть такая потребность.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"А вот сопровождать участников бегом по кругу дистанции нельзя. Приемлемым считается пробежать несколько десятков метров, чтобы дать указания и покормить/попоить. За нарушение – предупреждение от судей и угроза дисквалификации.","listType":"ol","listId":"list-3","level":0},{"kind":"li","text":"За 10-15 минут до конца суток участникам выдают специальные колышки, на которые нанесены стартовые номера атлетов. За десять секунд начинается обратный отсчёт, на счёт «‎ноль» участник должен остановиться и положить колышек у ног на первой дорожке. Количество преодолённых кругов для каждого участника считается хронометражной лентой, а длина финального отрезка от начала круга до колышка – курвиметром после завершения гонки.","listType":"ol","listId":"list-3","level":0},{"kind":"h5","text":"Другие особенности, которые стоит учесть:"},{"kind":"li","text":"Разницу дневных и ночных температур: переодеваться по ходу дистанции под ощущения и погоду – обычная практика. Вещей лучше взять больше, чем меньше.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Участникам разрешено отдыхать. Сидя, лёжа, пять часов подряд – как угодно. Но время и соперников не остановят: длительный отдых, как правило, будет означать низкие и относительные, и абсолютные результаты.","listType":"ul","listId":"list-4","level":0},{"kind":"li","text":"Первая дорожка короче третьей. Четырнадцать метров – вроде бы немного, но за сутки бега так можно набрать до 4-5 лишних километров, которые не пойдут в зачёт.","listType":"ul","listId":"list-4","level":0},{"kind":"p","text":"Вот, пожалуй, и все особенности суточного бега относительно шоссейных или трейловых ультр."},{"kind":"h3","text":"План на гонку"},{"kind":"p","text":"Для начала о том, как этот план появился: случайно. Готовился без тренера, своего опыта не было. А близкий опыт – ЗКМ и горные трейлы – прилично отличался и форматом, и интенсивностью бега."},{"kind":"p","text":"Думал, что буду делать так: начну бежать примерно по 6:20, пробегу так первые часов 10-12, а дальше буду смотреть по ощущениям. Питание: гели раз в 40-50 минут и вода, когда устану – кола."},{"kind":"p","text":"Но мне повезло, через сестру познакомился с Серёжей Якимовым, а по Измайлонгу уже знал невозможного ультрачеловека Женю Однорога. Серёжа, Женя и присоединившийся к ним капитан команды поддержки Андрей Меньшов очень сильно скорректировали то, что раньше я называл планом."},{"kind":"p","text":"Финальная версия выглядела примерно так:"},{"kind":"li","text":"Темп. Гонку поделили на 4 отрезка по 6 часов. Целевой средний темп по каждому: 6:00, 6:30, 8:00, 9:00. Если будет солнце и жарко на первом отрезке, замедлиться на 20-30 секунд и их же отыграть на ночных этапах.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Питание. Гели каждые 30 минут. Минимально приемлемый объём потребления воды в час по отрезкам: 400, 300, 300 и снова 400 миллилитров.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Всякое. Днём солнцезащитный крем обновлять раз в 2,5 часа на лице/шее и раз в четыре – на теле. Вазелин обновлять раз в шесть часов. Солевые таблетки – каждые два часа днём, каждые три часа ночью.","listType":"ol","listId":"list-5","level":0},{"kind":"li","text":"Список действий для меня и команды на случаи санитарных остановок, болей, падения темпа, мозолей, дождя.","listType":"ol","listId":"list-5","level":0},{"kind":"p","text":"Темп – средний. То есть реальный темп бега должен быть на 5-10 секунд быстрее на первых отрезках и существенно выше на остальных, когда будет больше остановок и пешеходных отрезков."},{"kind":"p","text":"Бег на первом этапе этого плана мне показался слишком резвым, а ожидание сильной деградации среднего к концу забега – наоборот, излишне пессимистичным. Но у Серёжи на прошлых сутках на «Искре» был результат уровня МСМК – странно было бы с моей стороны не прислушаться."},{"kind":"h3","text":"Утро в день старта"},{"kind":"p","text":"К стадиону приехал около девяти. Там уже были ребята из команды и стоял шатёр. Поздоровался, потусовался и пошёл с Владой вселяться в апартаменты в 3-4 минутах от «Искры»."},{"kind":"p","text":"Через час снова был на стадионе: нужно было дозарегистрироваться на участие. Отстоял очередь минут на 30-35, предъявил себя, медицинскую справку и страховку, отдал ещё немного денег, получил стартовый номер и хронометражные чипы. Ну всё, пора собираться."},{"kind":"p","text":"В апартаментах повалялся 5-10 минут на кровати, вплёл в шнурки хронометражные чипы, сходил необходимое количество раз в туалет, намазался вазелином и кремом от загара. Оделся в стартовую форму: короткие тайтсы, носки Инджинджи с пальцами, велосипедная светлая кепка, тёмные очки, стартовая футболка Компресспорт. Вcё, кроме кепки, со мной ещё с Комрадса 2018 года – отличный выбор для длительной гонки."},{"kind":"p","text":"Не рассчитал время, опаздывал, на старт пришлось бежать. Парад участников пропустил, показать команде где-что лежит из вещей вышло скомкано. Всё немного нервно, суматошно. Выручила официальная линейка: успокоился и расслабился под речи организаторов перед самим стартом."},{"kind":"p","text":"Небо голубое, солнце яркое, жарко. Яндекс обещал, что через час после начала забега на помощь придут облака и будет лучше."},{"kind":"p","text":"Каким был звуковой сигнал к началу гонки, я не помню."},{"kind":"h2","text":"2. Про саму гонку"},{"kind":"p","text":"Начну с дисклеймера: все события вымышлены, а совпадения с реальными персонажами случайны! Шутка."},{"kind":"p","text":"Но не совсем: в этот раз тяжело далась попытка и вспомнить, и разложить по правильным местам отчёта события, ощущения и промежуточные результаты."},{"kind":"p","text":"Устал? Переполнился буфер? Не хватило пространственных якорей на круге в 400 метров? Так или иначе, прошу не судить строго за неточности и убывающее по ходу текста количество деталей."},{"kind":"h3","text":"12:00 – 18:00. Четверть солнца"},{"kind":"p","text":"Цель: 60 километров, темп 6:00.Ожидаемые вызовы: жаркая погода, солнце"},{"kind":"p","text":"Жарко и солнце, но бежать всё равно надо. Общий старт. На первых кругах бежал медленней основной группы и слегка отдельно от всех: стартовая эйфория – не мой выбор на длинные гонки. Постепенно бегуны относительно равномерно распределились по всему кругу."},{"kind":"p","text":"Решил не переключаться сразу на план для жары: если будет тяжело бежать по шесть, замедлюсь, а если нет – продолжу так. Легко не было, но и непосильной тяжести не наступало: уверенно бежал со средним темпом около 5:50."},{"kind":"p","text":"Самочувствие хорошее. Ругался на солнце и отсутствующие вопреки прогнозам облака, не из-за сверхстраданий здесь и сейчас, а из-за опасений за то, как это скажется на общем успехе мероприятия."},{"kind":"p","text":"Чувствовал физическую удаль и отличную готовность к старту: я бежал из шести, в жару, под солнцем! На удивление, у меня это получалось лучше, чем у многих других более опытных и, казалось, сильных участников."},{"kind":"p","text":"Хорошим решением был выбор беспрекословно подчиняться подсказкам Андрея Меньшова и Жени Однорога: ел гели и солевые таблетки по первой просьбе, часто пил воду, регулярно макал кепку в тазик и обтирался губкой. Белый цвет футболки и кепки тоже, наверняка, помогали избежать перегрева."},{"kind":"p","text":"Первые признаки общей усталости появились через три часа после старта. Движению не мешали, просто заметил: вот, уже что-то есть."},{"kind":"p","text":"Основные развлечения этапа:"},{"kind":"li","text":"Разворот через 4 часа после старта. После первой смены направления бежать было непривычно и неуютно. Потребовались круги, чтобы адаптироваться. После четырёх следующих такой проблемы уже не было.","listType":"ul","listId":"list-6","level":0},{"kind":"li","text":"Знакомство с Ксюшей Анисимовой, подопечной Жени Однорога. И с Катей Михайловой, с которой были знакомы заочно по комментариям на Ютубе: «‎Так это ты гламурный мальчик из Ютуба?», «‎Да, да, это я». Время от времени перебрасывался парой фраз с другими бегунами и отвечал на подбадривания.","listType":"ul","listId":"list-6","level":0},{"kind":"li","text":"Музыкальные вставки от команды поддержки: включали что-то тематическое и задорное время от времени, когда я пробегал мимо.","listType":"ul","listId":"list-6","level":0},{"kind":"li","text":"Объявления промежуточных результатов диктором. Оказалось, что я не хуже многих переношу жару. А ещё довольно хорош, хоть и заявился впервые на такое соревнование: постепенно поднялся с 32-го на 8-е промежуточное место по парням. Ого.","listType":"ul","listId":"list-6","level":0},{"kind":"li","text":"Наблюдал за гостями и болельщиками, которые приходили на стадион, чтобы поддержать меня. Ребята с Измайлонга, друзья, семья – всего за сутки через стадион прошло примерно три-четыре десятка человек. Было очень приятно.","listType":"ul","listId":"list-6","level":0},{"kind":"li","text":"Наблюдал, как Женя Однорог играюче совмещает бег, поедание шаурмы и пиццы, наставление тренируемых им и не только атлетов, и троллинг других участников гонки. Женя тут, Женя там, Женя везде. И, кстати, было приятно де-факто войти на время гонки в число Жениных подопечных, которым достаётся его опыт, забота, поддержка, подбадривания и инструктаж для команд поддержки.","listType":"ul","listId":"list-6","level":0},{"kind":"p","text":"Завершения первых шести часов прямо ждал. Очень уже хотелось сбавить темп до более спокойного. И было важно разделаться с первой психологической отметкой – финишем жаркого этапа."},{"kind":"p","text":"Пробежал: 61,2 километра. Средний темп: 05:51."},{"kind":"h3","text":"18:00 – 24:00. Четверть борьбы"},{"kind":"p","text":"Цель: 55 километров, темп 6:30.Ожидаемые вызовы: соблюсти целевой темп на фоне усталости"},{"kind":"p","text":"С началом этапа не стало мгновенно прохладно и легко. Наоборот, кажется, что почти сразу появились проблемы: неприятные ощущения в животе, как будто бы давление или спазмы. Сходил в туалет – ноль эффекта, дело не в этом. Отдохнул пару минут, пока обновлял вазелин, – тоже не помогло."},{"kind":"p","text":"Раз в полчаса мне положено было съесть гель и запить его водой. После того, как делал это, дискомфорт усиливался до состояния, при котором я мог только идти пешком. Спазмы и, кажется, высокий пульс. Грустно шёл круг или два, а затем начинал бежать с темпом от 6:10 до 6:40. Но через 15-20 минут снова пора было есть, и история повторялась. После первых шести часов был запас в километр с копейками, но я быстро его растерял и уже начал отставать от графика."},{"kind":"p","text":"Андрей и Женя искали способы меня починить. Закидывали в меня Нош-пы, а через раз вместо гелей с водой в ход пошли морсы и кисели. Сначала приём работал, на таком питании у меня получалось бежать почти нормально. Но вскоре спазмы стали возникать даже просто в ответ на воду. Казалось, что для них достаточно пребывания в желудке чего угодно или даже только мыслей о еде."},{"kind":"p","text":"После девяти вечера от гелей стало ещё и тошнить. Ввели на них временный мораторий. Вместо еды всё чаще пил калорийные ягодные жидкости. Несколько раз по 4-5 минут отдыхал у шатра: долго и с чувством подтягивал шнурки на кроссовках. У ребят в лагере была почти дачная обстановка: много людей, все закутаны в тёплое, куча еды и напитков на столах. Уютно!"},{"kind":"p","text":"С 18:00 до 21:00 настолько потерял ритм, что от плана отстал уже на 4-5 километров. Это то, что можно отыграть потом, если станет лучше. Но станет ли? В какой-то момент, видимо, привык к новому режиму существования и отставание перестало расти. Более того, в перерывах между страданиями выдал полтора-два хороших часа со средним темпом около шести минут на километр!"},{"kind":"p","text":"Счастливчиком, конечно, я не выглядел. За час до двенадцати Женя пообещал мне 10-15 минут отдыха после полуночи – супермотивация! Нашёл силы и бежал бодро до конца второго этапа и середины гонки."},{"kind":"p","text":"Пробежал: 50,4 километра. Средний темп: 07:06."},{"kind":"h3","text":"00:00 – 06:00. Четверть неопределённости"},{"kind":"p","text":"Цель: 45 километров, темп 8:00.Ожидаемые вызовы: кризис, психологическая усталость, утомление"},{"kind":"p","text":"Отрезок начался с обещанного перерыва! Сел, надел ветровку, закутался в плед – всё равно трясёт. Впервые испытал озноб гликогенового истощения в середине ультры, а не после. Трясло так, что не все из команды верили, что забег продолжится. Поел, попил, согрелся, поболтал с ребятами – на всё про всё 10 минут. Пора дальше."},{"kind":"p","text":"Начал бег ещё в ветровке, постепенно разделся до более комфортного облачения: дневная форма + лёгкий жилет + лёгкие перчатки. Рукава и куртка мне были не нужны, шапка тоже была бы лишней. Когда двигался, было тепло. Судя по статистике кругов, следующие два часа с небольшим я бежал довольно неплохо, уверенно вписывая километры в планку темпа из 6:30."},{"kind":"p","text":"Но этот отрезок радости закончился. Помню, что сильно начала мешать бежать болящая левая надкостница. Помню, что по просьбе Жени Однорога мне её промассировали, и на время пришло облегчение. Помню высокий пульс и десятки попыток перейти с шага на бег, конверсия которых в успех снижалась с каждым разом. Был ещё только один небольшой отрезок бега с приличным темпом в районе 15-го часа дистанции. И всё, никакого больше праздника:"},{"kind":"li","text":"За третий этап 35% кругов преодолел с темпом быстрее 6:30. На прошлом было 52%, на первом – 99%.","listType":"ul","listId":"list-7","level":0},{"kind":"li","text":"Ещё 38% – медленный бег. Тот, что от шести с половиной до семи с половиной минут на километр.","listType":"ul","listId":"list-7","level":0},{"kind":"li","text":"21% – круги, часть которых преодолевал пешком. Считал такими те, где средний темп был ниже 7:30.","listType":"ul","listId":"list-7","level":0},{"kind":"li","text":"Оставшиеся 6% – с остановками, средний темп на круг меньше 12:00.","listType":"ul","listId":"list-7","level":0},{"kind":"p","text":"До середины этапа, пока бежалось, думал, что ещё есть шансы на 200 километров. Был период, когда отставание от плана сократилось с пяти километров до двух – тот гандикап, который возможно отыграть на этапе с целевым темпом в девять минут на километр. Но нет."},{"kind":"p","text":"За циклами упадка перестали следовать циклы подъёма. Нимесил, который неплохо взбодрил в конце второго этапа, в этот раз не сработал. Команда считала, что я ещё могу набежать на 1-й разряд, и гнала вперёд. А я был уверен, что шансов нет, и переключился на цель «‎досуществовать до финиша, иногда побегивая»."},{"kind":"p","text":"Все ждали рассвет. Он наступил около четырёх утра, но сил особо не прибавил."},{"kind":"p","text":"Пробежал: 44,8 километра. Средний темп: 08:02."},{"kind":"h3","text":"06:00 – 12:00. Четверть развязки"},{"kind":"p","text":"Цель: 40 километров, темп 9:00.Ожидаемые вызовы: скука, мозоли, боли"},{"kind":"h4","text":"Часть первая, когда мог"},{"kind":"p","text":"К возвращению солнца на стадион я был настроен скептически: не верил в магию природных циклов и пробуждение всего живого. Настроение стало пободрее, но быстро прогревавшийся воздух вообще не помогал на дорожке."},{"kind":"p","text":"Двадцать часов назад я здорово перенёс злой майский солнцепёк, чему был приятно удивлён. Но утром, на фоне утомления, сопротивлялся ему с всё возрастающим трудом."},{"kind":"p","text":"За шесть часов этапа ни одного круга не смог пробежать с темпом из 6:30. Кругов, где совсем не переходил на шаг, было меньше половины. Стоп-факторы те же: спазмы, пульс, надкостница и теперь ещё усталость и солнце."},{"kind":"p","text":"Команда отчаянно пыталась придумать способ заставить меня бежать. Я головой был благодарен за попытки, но чувствовал в этот момент другое: лишнее давление и рассинхрон оценки состояний. Андрей справедливо считал, что если буду просто еле-еле бежать с темпом в районе хотя бы 7-8 минут на километр, то могу зацепить 200. А я не мог бежать и полагал, что и ходить ещё смогу не слишком долго. Будет только хуже."},{"kind":"p","text":"Типовая история с этапа: после питания шёл круг пешком. На втором соглашался, что пора бы бежать. Делал 4-7 коротких беговых шагов и снова пешком – не получалось. Через 100-150 метров повторял попытку завестись – снова неудачно. С третьей или четвёртой начинал-таки бежать. Небыстро. Недолго."},{"kind":"h4","text":"Часть вторая, когда нет"},{"kind":"p","text":"Около 09:40, за два с небольшим часа до финиша, мои мучения закончились. Я перестал мочь."},{"kind":"p","text":"Мне стало тяжело даже стоять на месте. Белой одежды, обливаний и смачивания кепки больше не хватало для защиты от солнца. Я уже преодолел минимально приемлемые для себя 180 километров и больше не ощущал ни смысла, ни сил пытаться дотерпеть до конца суток. Сказал команде, что всё. Баста!"},{"kind":"p","text":"Попросил поставить кресло в тень, залез в ветровку, закутался в плед и плюхнулся вниз. Всё. Горячий чай и два больших бутерброда с сыром сбили подкативший снова озноб. Ел, пил, отдыхал, разговаривал. Мне перестало быть плохо. Ушло давление гонкой, расслабился, повеселел."},{"kind":"p","text":"Надо было решать, что делать дальше. Сидеть два часа в кресле не хотелось. Появилась идея сходить в душ в апартаментах, переодеться и не спеша вернуться на стадион к награждению. Этот вариант никому не понравился. Тем временем облака скрыли солнце: «‎Дим, давай просто пройдёшься кружок, и посмотрим что-как?». Согласился."},{"kind":"p","text":"Встал, пошёл, мне вроде бы нормально. Бежать нет, а ходить могу. Тут подъезжают с разных сторон дельные мысли:"},{"kind":"li","text":"Миша говорит, что вообще-то они все приехали на «сутки бегом», а не на «22 часа бегом».","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Андрей говорит, что если продолжу ходить, то смогу сохранить место в десятке. В десятке, Карл!","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Для меня самого, психологически, остаться на круге к концу суток значило справиться. А уйти раньше значило DNF.","listType":"ul","listId":"list-8","level":0},{"kind":"li","text":"Быстрые арифметические прикидки: есть шанс зацепить приятные 190 километров, вместо терпимых 180.","listType":"ul","listId":"list-8","level":0},{"kind":"p","text":"Да-да-да, я буду ходить!"},{"kind":"h4","text":"Часть третья, когда снова да"},{"kind":"p","text":"Шёл быстрым шагом. Иногда один, иногда с Ксюшей. Когда вместе – прикольно, болтаем. Пробовал сделать несколько коротких пробежек – получилось только пару раз по 50-100 метров очень медленного бега. Блокирующе болела надкостница."},{"kind":"p","text":"Питание всё ещё доставляло проблемы, даже когда, сидя за столом под смех разросшейся за утро команды, пытался есть блины и сырники со сгущёнкой. Ходить пешком это сильно не мешало."},{"kind":"p","text":"Сделать 190 километров успевал лишь с небольшие запасом – совсем сильно не расслабиться. А ребят всё больше и больше: радостные, яркие, свои подтягивались после МПМ и Измайлонга. Стало веселее. Жаль только, что бежать толком не мог."},{"kind":"p","text":"За 5-7 минут до финиша мне наконец-то передали финишный колышек. Мы прикинули место и рассчитали время, как бы мне позадорней финишировать поближе к команде."},{"kind":"p","text":"Дальше, как мечтал: смотрел на часы и отсчитывал 23, 22, 21… за 20 секунд до финиша внутренним эндорфиново-адреналиновым коктейлем задавил все мысли про боль и усталость. И побежал! Побежал! ПОБЕЖАЛ! В середине отрезка начался обратный отсчёт диктора от десяти, а я летел свою коронную финишную стометровку."},{"kind":"p","text":"Женя Однорог неодобрительно поднял бровь: «Так, я не понял! Ты же помирал!». На счёт ноль я затормозил, покричал и положил сначала колышек, а затем себя на дорожку. Передышка, объятия, радость, ветровка и пешком в сторону медалей, награждения и речей. Чувствовал себя героем и паровозиком, который смог."},{"kind":"p","text":"Пробежал: 35,2 километра. Средний темп: 10:11."},{"kind":"h2","text":"3. Впечатления и мысли"},{"kind":"p","text":"То, что образовалось в голове уже после финиша."},{"kind":"h3","text":"Результат"},{"kind":"p","text":"191 километр 869 метров – я доволен! Да, не двести. Но очень близко. Учитывая погоду, возникшие сложности и самочувствие за 2-4 часа до финиша, и не рассчитывал бы на лучшее."},{"kind":"p","text":"А вообще, градация возможных результатов для меня была и остаётся примерно такая:"},{"kind":"li","text":"210+. Такого не будет. Если вдруг как-то случайно, то на отметке 210 просто остановился бы и дождался спокойно финиша.","listType":"ul","listId":"list-9","level":0},{"kind":"li","text":"Примерно 205. Абсолютное счастье, походка звезды, раздутое эго и неприличный уровень довольства собой.","listType":"ul","listId":"list-9","level":0},{"kind":"li","text":"200. Это цель. Умеренно амбициозная планка и ориентир для построения плана.","listType":"ul","listId":"list-9","level":0},{"kind":"li","text":"190+. Довольство и ощущение успеха. Молодец, крут, справился.","listType":"ul","listId":"list-9","level":0},{"kind":"li","text":"180+. Минимально-положительный результат. Если есть – окей, терпимо. Если нет – расстроился бы.","listType":"ul","listId":"list-9","level":0},{"kind":"li","text":"Меньше 140. Ощущение провала и стыда. Типа «‎гламурный мальчик» на пафосе: гонора много, а как до дела – вот тебе.","listType":"ul","listId":"list-9","level":0},{"kind":"p","text":"Это не общая градация, а именно под себя. Учитывая предыдущий опыт, данные, физическую форму и так далее. К другим атлетам, разумеется, такую не применишь. У каждого своя."},{"kind":"p","text":"Хотя и тут есть смешное. Поделился мыслями про то, что считал бы стыдом и провалом с подругой. В ответ: «‎Подожди. Ты серьёзно считал бы фейлом, если бы за сутки пробежал 139 километров?!». Ну да, действительно, простите."},{"kind":"p","text":"А ещё, с учётом всех приключений: 10 место среди 50 стартовавших по мужчинам. И один из всего 14 мужчин, разменявших отметку в сто миль."},{"kind":"h5","text":"Другие цифры гонки:"},{"kind":"li","text":"Марафон в составе суток: 4 часа с копейками","listType":"ul","listId":"list-10","level":0},{"kind":"li","text":"50 километров: 4 часа 52 минуты","listType":"ul","listId":"list-10","level":0},{"kind":"li","text":"6 часов стадионного бега по жаре под солнцем: 61,2 километра","listType":"ul","listId":"list-10","level":0},{"kind":"li","text":"100 километров: 10 часов 40 минут (6:24 на километр)","listType":"ul","listId":"list-10","level":0},{"kind":"li","text":"100 миль / 161,2 километра: 18 часов 42 минуты","listType":"ul","listId":"list-10","level":0},{"kind":"h3","text":"О чём думал, что чувствовал"},{"kind":"p","text":"Про мысли во время гонки – один из самых популярных вопросов. Я понимаю почему. Меня бы тоже интересовало. Но мало мне есть что рассказать на эту тему."},{"kind":"li","text":"Во-первых, их действительно было немного.","listType":"ul","listId":"list-11","level":0},{"kind":"li","text":"Во-вторых, большая их часть была про текущее физическое состояние и арифметику: темп, время, круги, километры, позиции в протоколе.","listType":"ul","listId":"list-11","level":0},{"kind":"li","text":"Много времени провёл, рассматривая табло со временем и выхватывая из объявлений диктора свои ФИ и промежуточные результаты.","listType":"ul","listId":"list-11","level":0},{"kind":"li","text":"В хорошем смысле слова отвлекался на ребят, которые приходили поддержать на стадион.","listType":"ul","listId":"list-11","level":0},{"kind":"li","text":"Время от времени решал задачу про оптимальное положение кепочного козырька, выбирая между защитой от солнца, охлаждением тыквы и раздачей стиля на объективы.","listType":"ul","listId":"list-11","level":0},{"kind":"li","text":"Пытался прислушиваться к указаниям команды.","listType":"ul","listId":"list-11","level":0},{"kind":"li","text":"Около часа, наверное, наразговаривал с другими участниками забега. Шутили про пистоны подопечным от Жени Однорога, обменивались впечатлениями, подбадривали друг друга.","listType":"ul","listId":"list-11","level":0},{"kind":"p","text":"Вот, пожалуй, и всё. Наверное, действительно во время ультры мозг работает в более ограниченном и медленном режиме. Это бы объяснило, почему не спать сутки во время гонки даётся легче, чем в гражданской жизни."},{"kind":"p","text":"Про эмоции контента ещё меньше. Чувствование и рефлексия эмоций не самая сильная моя сторона. Плюс спецэффект с этими эмоциями случился интересный, о котором расскажу под самым последним заголовком текста."},{"kind":"p","text":"Что помню?"},{"kind":"li","text":"Кажется, большую часть дистанции был умеренно спокойным. Извинялся, если случайно мешал кому-то из участников. Был вежлив с командой, благодарен им за поддержку и помощь.","listType":"ul","listId":"list-12","level":0},{"kind":"li","text":"Пару раз локально вспылил: рявкнул в сторону ребят. Оба момента: мне что-то не успели подать во время пробега мимо лагеря. А был подуставший и не успел отловить волну раздражения. Через круг уже хотелось извиниться, но вроде бы не надо было.","listType":"ul","listId":"list-12","level":0},{"kind":"li","text":"Помню дискомфорт на стыке третьей и четвёртой четвертей от рассинхрона ожиданий с командой про достижимость 200 километров. Я понимал, что и зачем происходит. Благодарен. Но приятным это не было.","listType":"ul","listId":"list-12","level":0},{"kind":"li","text":"Одна из самых ярких положительных эмоций: облегчение, когда объявил, что «‎я всё» и плюхнулся в кресло. Прямо выдохнул, сбросил груз, очень хорошо стало в моменте.","listType":"ul","listId":"list-12","level":0},{"kind":"li","text":"Вторая по силе яркость: утреннее наполнение стадиона ребятами и девчатами, что пришли поддержать в последние часы гонки и увидеть финиш. Почувствовал прилив радости и как будто бы сил.","listType":"ul","listId":"list-12","level":0},{"kind":"p","text":"И снова дисклеймер: большую часть эмоций, видимо, в момент написания текста уже не помню или не смог их отловить даже тогда – в процессе. Жду фильм: посмотрю, как было на самом деле."},{"kind":"h3","text":"Самочувствие во время и после"},{"kind":"p","text":"На мой взгляд, это одна из самых интересных тем для небегунов. Тут и в самом деле есть много любопытного."},{"kind":"h4","text":"Что беспокоило во время гонки:"},{"kind":"li","text":"Проблемы с животом. Начались примерно с седьмого часа забега. Я называл их «спазмами‎» в «желудке‎», что это было на самом деле и где – не знаю. Ощущалось как напряжение внутри посередине туловища в верхней части живота после употребления еды или напитков. Пробовали менять схему питания и Но-шпу, действенного способа починить не нашли.","listType":"ul","listId":"list-13","level":0},{"kind":"li","text":"Боль в надкостнице. В левой, в нижней её части. Впервые обратил внимание, кажется, через 14-16 часов после старта. Иногда сильно болела и мешала перейти с шага на бег. Иногда просто болела. Скорее всего на её чувствование влияло обезболивающее. Один раз массировали дядей Колей минуты 3-4, на какое-то время стало лучше. Вместе с животом входит в ТОП2 самых значимых тормозящих факторов.","listType":"ul","listId":"list-13","level":0},{"kind":"li","text":"Высокий пульс. Иногда он совпадал со спазмами. Иногда был отдельным явлением. Ощущался как одышка и, собственно, слишком частое сердцебиение. Такое могло происходить и когда шёл пешком, и когда сидел, не двигаясь, в кресле. Проявлялось эпизодически, немного озадачивало, но большой проблемой не было. Помогали отдых, время и нурофен.","listType":"ul","listId":"list-13","level":0},{"kind":"li","text":"Дефицит энергии. Во время бега я не чувствовал голода. Но команда говорит, что именно пустые баки не дали мне добежать, что выглядел хорошо, что сил было много, а топлива не хватило. Может быть, так и есть.","listType":"ul","listId":"list-13","level":0},{"kind":"li","text":"Мелкие проблемы с ОДА, которые сильно не влияли на ход гонки. Усталость и лёгкая боль в стопах, боль в левом плече, усталость в шее, забитость передних поверхностей бёдер, ощущение общего утомления.","listType":"ul","listId":"list-13","level":0},{"kind":"li","text":"Тошнота от гелей и нежелание есть сладкое после первых 10 часов. Влияние оценить сложно – не главная проблема с питанием. Но в планах на будущие старты стоит учесть.","listType":"ul","listId":"list-13","level":0},{"kind":"h4","text":"Каких проблем смог избежать:"},{"kind":"li","text":"Солнечных ожогов. Мазался кремами со степенью защиты 30 и 50. Делал это качественно и регулярно. Помню, во время своего первого марафона в Питере сильно обгорел в пасмурную погоду. Теперь так не ошибаюсь.","listType":"ul","listId":"list-14","level":0},{"kind":"li","text":"Мозолей. Поясницу заклеил тейпом. Торс защищала компресспортовская футболка. В стопы две недели до старта втирал питающий крем, рисковое место между пальцами правой ноги смазал карандашом от мозолей Компид. Носки с пальцами, кроссовки проверенные. Паховую область и ягодицы раз в шесть часов мазал вазелином. Самая безмазольная ультра в моей жизни.","listType":"ul","listId":"list-14","level":0},{"kind":"li","text":"Диареи. Таких проблем у меня на длительных, к счастью, пока не было. Не случилось и сейчас. Макаронная диета и минимум экспериментов с питанием – этого пока хватает. Лоперамида выпил только одну таблетку перед стартом, а потом забил: решил, что нафиг.","listType":"ul","listId":"list-14","level":0},{"kind":"li","text":"Скуки от бега по кругу. Было совсем не до мыслей про пейзажи. Ни разу за 24 часа не подумал о том, что вот бы сейчас картинку сменить. Повезло? Ну или просто проблем других хватало.","listType":"ul","listId":"list-14","level":0},{"kind":"li","text":"Тяжести ночного бега. С самого начала не считал бег ночью проблемой, особенно по освещённому стадиону. Когда экспериментировал и закрывал глаза, сознание, конечно, мгновенно пыталось отъехать. Но закрывать их не хотелось, бежалось нормально, в сон не клонило.","listType":"ul","listId":"list-14","level":0},{"kind":"h4","text":"Самочувствие после финиша:"},{"kind":"li","text":"Вертолёты усталости. Первые часы после финиша и несколько отглосков до конца дня. Похожи на алкогольные, но другие. Раздражительность, чувствительность, лёгкое головокружение, мысли «‎пусть меня отпустит». Хуже всего ощущалось под прямым солнцем и в машине.","listType":"ul","listId":"list-15","level":0},{"kind":"li","text":"Голод. Настиг через час после финиша. Страх и ощущение чёрной дыры в желудке. Починил пиццей и мороженым на афтепати. Вечером появлялись отголоски, но менее яркие. Из необычного: привередливость. Например, тушить его конфетами, колой и тортами не хотелось. А куском сыра, например, норм.","listType":"ul","listId":"list-15","level":0},{"kind":"li","text":"Дробный сон. Такого раньше не помню. Первые 2-3 дня после гонки спал порциями по 4 часа. Лёг в два, а в шесть уже окончательно проснулся. Видимо, к
